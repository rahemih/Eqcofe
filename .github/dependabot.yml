version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: auto
    allow:
      - dependency-name: "@nestjs/*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-type: production
        update-types:
          - version-update:semver-patch
      - dependency-type: development
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      nestjs-minor-patch:
        patterns:
          - "@nestjs/*"
        update-types:
          - minor
          - patch
      runtime-patch:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@nestjs/*"
        update-types:
          - patch
      development-minor-patch:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
