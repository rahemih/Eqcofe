version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    rebase-strategy: auto
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    rebase-strategy: auto
