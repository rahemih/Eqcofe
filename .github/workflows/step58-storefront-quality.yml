name: Step 58 Storefront Quality

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/step58-storefront-quality.yml'
      - 'apps/storefront/**'
      - 'docs/13-product-design/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/step58-storefront-quality.yml'
      - 'apps/storefront/**'
      - 'docs/13-product-design/**'

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned free browser QA tools in isolated temp root
        run: |
          rm -rf /tmp/eqcofe-browser-qa
          mkdir -p /tmp/eqcofe-browser-qa
          npm install --prefix /tmp/eqcofe-browser-qa --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3
          /tmp/eqcofe-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Build storefront
        run: pnpm --filter @eqcofe/storefront build
      - name: Run browser accessibility, keyboard, responsive and reflow gates
        env:
          EQCOFE_BROWSER_QA_ROOT: /tmp/eqcofe-browser-qa
        run: pnpm --filter @eqcofe/storefront quality:browser
