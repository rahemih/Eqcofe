name: Merge Policy Enforcement

permissions:
  contents: read

on:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to merge through deterministic Merge Policy Controller'
        required: true
        type: number

jobs:
  deterministic-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
      - name: generate-current-project-map
        run: node scripts/multi-agent/project-map.mjs
      - name: deterministic-primary-review
        run: node scripts/multi-agent/merge-policy-controller.mjs --deterministic-review

  merge-policy:
    needs: deterministic-review
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
      - name: generate-current-project-map
        run: node scripts/multi-agent/project-map.mjs
      - name: deterministic-merge-policy-validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/multi-agent/merge-policy-controller.mjs --ci-pr

  protection-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
      - name: hourly-protection-drift-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/multi-agent/merge-policy-controller.mjs --protection-live

  merge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
      pull-requests: write
      issues: read
    outputs:
      merge_sha: ${{ steps.merged.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
      - name: generate-current-project-map
        run: node scripts/multi-agent/project-map.mjs
      - name: deterministic-merge-policy-execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/multi-agent/merge-policy-controller.mjs --merge-pr '${{ inputs.pr_number }}'
      - name: resolve-exact-merge-sha
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          read -r merged merge_sha < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.merged, .merge_commit_sha] | @tsv')
          test "$merged" = "true"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/commits/${merge_sha}" --silent
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

  postmerge-verify:
    needs: merge
    if: github.event_name == 'workflow_dispatch' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eqcofe_phase_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eqcofe_phase_a"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eqcofe_phase_a
    steps:
      - name: checkout-exact-canonical-merge-sha
        uses: actions/checkout@v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.merge.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: verify-exact-merge-checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.merge.outputs.merge_sha }}"
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: install-postmerge-dependencies
        run: pnpm install --frozen-lockfile
      - name: postmerge-canonical-verify
        run: pnpm verify
      - name: postmerge-phase-a-verify
        run: node scripts/verify-phase-a.mjs

  postmerge-failure:
    needs: [merge, postmerge-verify]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.merge.result == 'success' && needs.postmerge-verify.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: open-postmerge-investigation
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.merge.outputs.merge_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VERIFY_RESULT: ${{ needs.postmerge-verify.result }}
        run: |
          set -euo pipefail
          title="[POST_MERGE_FAILED] PR #${PR_NUMBER} @ ${MERGE_SHA}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" | jq -r --arg title "$title" '.[] | select(.title == $title) | .html_url' | head -n 1)"
          if [ -n "$existing" ]; then
            echo "Existing investigation: $existing"
            exit 0
          fi
          body="$(printf '%s\n' \
            'incident_state: POST_MERGE_FAILED' \
            "source_workflow: ${GITHUB_WORKFLOW}" \
            "workflow_run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "pull_request: #${PR_NUMBER}" \
            "merge_sha: ${MERGE_SHA}" \
            "verification_result: ${VERIFY_RESULT}" \
            "owner: @${GITHUB_REPOSITORY_OWNER}" \
            '' \
            'The canonical merge has already occurred. Automatic rollback is prohibited. Create a separate governed investigation/remediation task before any rollback or follow-up merge.')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="$title" \
            -f body="$body" \
            -f "assignees[]=${GITHUB_REPOSITORY_OWNER}" \
            --jq '.html_url'
