name: Merge Policy Enforcement

permissions:
  contents: read

on:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to merge through deterministic Merge Policy Controller'
        required: true
        type: number

jobs:
  merge-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
      - name: generate-current-project-map
        run: node scripts/multi-agent/project-map.mjs
      - name: deterministic-merge-policy-validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/multi-agent/merge-policy-controller.mjs --ci-pr

  protection-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
      - name: hourly-protection-drift-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/multi-agent/merge-policy-controller.mjs --protection-live

  merge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eqcofe_phase_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eqcofe_phase_a"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eqcofe_phase_a
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
      - name: generate-current-project-map
        run: node scripts/multi-agent/project-map.mjs
      - name: deterministic-merge-policy-execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/multi-agent/merge-policy-controller.mjs --merge-pr '${{ inputs.pr_number }}'
      - name: resolve-exact-merge-sha
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          read -r merged merge_sha < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.merged, .merge_commit_sha] | @tsv')
          test "$merged" = "true"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: checkout-exact-merge-sha
        uses: actions/checkout@v5.1.0
        with:
          ref: ${{ steps.merged.outputs.merge_sha }}
          fetch-depth: 0
      - name: verify-exact-merge-checkout
        run: test "$(git rev-parse HEAD)" = "${{ steps.merged.outputs.merge_sha }}"
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - name: install-postmerge-dependencies
        run: pnpm install --frozen-lockfile
      - name: postmerge-canonical-verify
        run: pnpm verify
      - name: postmerge-phase-a-verify
        run: node scripts/verify-phase-a.mjs
