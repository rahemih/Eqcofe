name: EQCOFE Step45 Canonical Selective Import

on:
  pull_request:
    branches: [main]
    paths:
      - '.step45-trigger/**'
      - '.github/workflows/step45-canonical-import.yml'

permissions:
  contents: write

jobs:
  import-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/step45-canonical-final
          fetch-depth: 0

      - name: Download canonical Step45 artifact
        env:
          STEP45_URL: 'https://at.adobe.com/6e2cbS1umJ7OfEdU'
        run: |
          set -euo pipefail
          if ! curl -fL "$STEP45_URL" -o /tmp/step45.zip; then
            echo "External Step45 artifact unavailable; reconstructing repository-pinned artifact."
            test -n "$(find .step45-import -maxdepth 1 -type f -name 'chunk-*' -print -quit)"
            : > /tmp/step45.zip
            for chunk in .step45-import/chunk-*; do
              base64 --decode "$chunk" >> /tmp/step45.zip
            done
          fi
          test -s /tmp/step45.zip
          if ! unzip -t /tmp/step45.zip; then
            echo "Pinned artifact lacks a central directory; repairing recoverable ZIP entries."
            zip -FF /tmp/step45.zip --out /tmp/step45-repaired.zip
            mv /tmp/step45-repaired.zip /tmp/step45.zip
            unzip -t /tmp/step45.zip
          fi
          unzip -q /tmp/step45.zip -d /tmp/step45
          ROOT="$(find /tmp/step45 -maxdepth 2 -type f -name package.json -printf '%h\n' | head -1)"
          if [ -z "$ROOT" ]; then ROOT=/tmp/step45; fi
          echo "STEP45_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Step45 delta without overwriting Step46
        run: |
          set -euo pipefail
          ROOT="$STEP45_ROOT"
          for p in \
            database/migrations/0034_content_core.sql \
            database/migrations/0035_content_editorial_lifecycle.sql \
            src/modules/content \
            tests/content \
            docs/steps/step45; do
            if [ -e "$ROOT/$p" ]; then
              mkdir -p "$(dirname "$p")"
              rm -rf "$p"
              cp -a "$ROOT/$p" "$p"
            fi
          done

          while IFS= read -r -d '' f; do
            rel="${f#$ROOT/}"
            case "$rel" in
              .git/*|node_modules/*|src/modules/marketing/*|tests/marketing/*|database/migrations/0036_*|database/migrations/0037_*) continue ;;
            esac
            if [ ! -e "$rel" ]; then
              mkdir -p "$(dirname "$rel")"
              cp -a "$f" "$rel"
            fi
          done < <(find "$ROOT" -type f -print0)

          STEP45_ROOT="$ROOT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';

          const root = process.env.STEP45_ROOT;
          const openapiPath = 'contracts/http/openapi.yaml';
          const artifactOpenapiPath = `${root}/${openapiPath}`;
          if (!fs.existsSync(artifactOpenapiPath)) {
            throw new Error(`Canonical Step45 OpenAPI not found at ${artifactOpenapiPath}`);
          }

          const current = YAML.parse(fs.readFileSync(openapiPath, 'utf8'));
          const canonical = YAML.parse(fs.readFileSync(artifactOpenapiPath, 'utf8'));
          const contentPath = /(?:article|content|blog|seo|sitemap)/i;

          current.tags ??= [];
          const knownTags = new Set(current.tags.map((tag) => tag.name));
          for (const tag of canonical.tags ?? []) {
            if (!knownTags.has(tag.name)) current.tags.push(tag);
          }

          current.components ??= {};
          for (const section of ['schemas', 'responses', 'parameters', 'headers', 'securitySchemes']) {
            current.components[section] ??= {};
            for (const [name, value] of Object.entries(canonical.components?.[section] ?? {})) {
              if (!(name in current.components[section]) || contentPath.test(name)) {
                current.components[section][name] = value;
              }
            }
          }

          current.paths ??= {};
          for (const [path, operation] of Object.entries(canonical.paths ?? {})) {
            if (contentPath.test(path)) current.paths[path] = operation;
          }

          fs.writeFileSync(openapiPath, YAML.stringify(current, { lineWidth: 0 }));
          NODE

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const servicePath = 'apps/scheduler/scheduler-tasks.service.ts';
          let service = fs.readFileSync(servicePath, 'utf8');
          const importLine = "import { ArticleOperationsService } from '../../src/modules/content/application/article-operations.service';";
          if (!service.includes(importLine)) {
            service = service.replace(
              "import { OrderService } from '../../src/modules/orders/application/order.service';",
              "import { OrderService } from '../../src/modules/orders/application/order.service';\n" + importLine,
            );
          }
          if (!service.includes('private readonly content: ArticleOperationsService')) {
            service = service.replace(
              'private readonly notifications:NotificationOperationsService)',
              'private readonly notifications:NotificationOperationsService, private readonly content: ArticleOperationsService)',
            );
          }
          if (!service.includes('publishScheduledContent')) {
            service = service.replace(
              '  @Cron(CronExpression.EVERY_10_MINUTES) refreshCurrencyRates()',
              '  @Cron(CronExpression.EVERY_MINUTE) async publishScheduledContent(): Promise<void> { await this.content.publishDue(50); }\n  @Cron(CronExpression.EVERY_10_MINUTES) refreshCurrencyRates()',
            );
          }
          fs.writeFileSync(servicePath, service);

          const modulePath = 'apps/scheduler/app.module.ts';
          let moduleSource = fs.readFileSync(modulePath, 'utf8');
          const moduleImport = "import { ContentModule } from '../../src/modules/content/content.module';";
          if (!moduleSource.includes(moduleImport)) {
            moduleSource = moduleSource.replace(
              "import { PaymentsModule } from '../../src/modules/payments/payments.module';",
              "import { PaymentsModule } from '../../src/modules/payments/payments.module';\n" + moduleImport,
            );
          }
          if (!moduleSource.includes('PaymentsModule, ContentModule')) {
            moduleSource = moduleSource.replace('PaymentsModule, NotificationsModule', 'PaymentsModule, ContentModule, NotificationsModule');
          }
          fs.writeFileSync(modulePath, moduleSource);
          NODE

          test -d src/modules/marketing
          test -n "$(find src/modules/marketing -type f -print -quit)"
          test -n "$(find database/migrations -maxdepth 1 -type f \( -name '0036*' -o -name '0037*' -o -iname '*marketing*' -o -iname '*loyalty*' \) -print -quit)"
          grep -q 'publishDue(50)' apps/scheduler/scheduler-tasks.service.ts
          grep -q 'publishScheduledContent' apps/scheduler/scheduler-tasks.service.ts

          rm -rf .step45-import .step45-trigger

      - name: Full verification
        run: pnpm verify

      - name: Commit verified Step45 integration
        run: |
          set -euo pipefail
          rm -f .github/workflows/step45-canonical-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No Step45 delta to commit.'
            exit 1
          fi
          git commit -m 'step(45): integrate canonical content and SEO backend without Step46 regression'
          git push origin HEAD:agent/step45-canonical-final
