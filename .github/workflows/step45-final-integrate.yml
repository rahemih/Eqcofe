name: Step45 Final Canonical Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-step45:
    if: github.head_ref == 'agent/step45-canonical-final-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download verified Step45 payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://at.adobe.com/BQ3rgoRtLJ6tAC4u' -o /tmp/step45-payload.zip
          echo '7a4145d05ef5a563ec95cc8e7118bd0f1257d52fb4d7be7ebb51fb4065b00fab  /tmp/step45-payload.zip' | sha256sum -c -

      - name: Apply Step45 add-only payload and three-way shared patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/step45-payload.zip -d .
          git apply --3way .step45-shared.patch
          rm -f .step45-shared.patch

      - name: No destructive diff / no Step46 overlap gate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-status origin/main | tee /tmp/step45-diff.txt
          if awk '$1 ~ /^D/ || $1 ~ /^R/ {bad=1} END{exit bad}' /tmp/step45-diff.txt; then
            echo 'PASS: no deletion/rename introduced by Step45.'
          else
            echo 'FAIL: destructive diff detected.' >&2
            exit 1
          fi
          if git diff --cached --name-only origin/main | grep -E '^(src/modules/marketing/|src/modules/loyalty/|test/marketing-loyalty-step46|docs/11-step-history/STEP-46-)'; then
            echo 'FAIL: Step46 overlap detected.' >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify current lineage with Step45 integrated
        run: pnpm verify

      - name: Persist Step45 implementation on integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'eqcofe-canonical-bot'
          git config user.email 'eqcofe-canonical-bot@users.noreply.github.com'
          git commit -m 'step(45): persist canonical content and SEO backend'
          git push origin HEAD:${{ github.head_ref }}
