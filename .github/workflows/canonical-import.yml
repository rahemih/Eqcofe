name: Canonical EQCOFE Import

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

env:
  CANONICAL_TAR_XZ_SHA256: 0964e3728749128dd3501fc3092d84779277cb86547cc067fe38c2d0af1462f3

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'canonical-import-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Reassemble and verify canonical payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .canonical-import/READY
          cat .canonical-import/chunk-* > /tmp/eqcofe-canonical.tar.xz.b64
          base64 --decode /tmp/eqcofe-canonical.tar.xz.b64 > /tmp/eqcofe-canonical.tar.xz
          echo "${CANONICAL_TAR_XZ_SHA256}  /tmp/eqcofe-canonical.tar.xz" | sha256sum --check --strict
          rm -rf /tmp/eqcofe-import
          mkdir -p /tmp/eqcofe-import
          tar -xJf /tmp/eqcofe-canonical.tar.xz -C /tmp/eqcofe-import
          test -f /tmp/eqcofe-import/Eqcofe/package.json
          test -f /tmp/eqcofe-import/Eqcofe/contracts/http/openapi.yaml
          test -f /tmp/eqcofe-import/Eqcofe/database/migrations/0033_notification_operations.sql

      - name: Reset to canonical main parent and install source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B canonical-final origin/main
          rsync -a --delete --exclude='.git/' /tmp/eqcofe-import/Eqcofe/ ./
          rm -rf .canonical-import .bootstrap .canonical-import-trigger

      - name: Commit and publish canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EQCOFE Canonical Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import canonical EQCOFE source through Step 44"
          git push origin HEAD:main

      - name: Publish canonical tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git reset --hard origin/main
          if git rev-parse -q --verify refs/tags/eqcofe-canonical-import-v1 >/dev/null; then
            echo "Tag already exists"
          else
            git tag -a eqcofe-canonical-import-v1 -m "EQCOFE canonical import through Step 44"
            git push origin eqcofe-canonical-import-v1
          fi
