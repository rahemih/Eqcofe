name: Canonical EQCOFE Import

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

env:
  DRIVE_FILE_ID: 1bWR6xn1_uFHjhPxuRQVsZXBd4NTR9sjy
  CANONICAL_TRACKED_COUNT: '782'
  CANONICAL_TREE_MANIFEST_SHA256: 926f1793e1a367d8f87f7f28167f79a2580c9c02d7b34098236c93dac0fce7e3

jobs:
  import:
    if: github.event_name != 'pull_request' || github.head_ref == 'canonical-import-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download canonical package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
            --output /tmp/eqcofe-canonical.zip
          unzip -t /tmp/eqcofe-canonical.zip

      - name: Verify canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eqcofe-import
          mkdir -p /tmp/eqcofe-import
          unzip -q /tmp/eqcofe-canonical.zip -d /tmp/eqcofe-import
          test -f /tmp/eqcofe-import/Eqcofe/package.json
          test -f /tmp/eqcofe-import/Eqcofe/contracts/http/openapi.yaml
          test -f /tmp/eqcofe-import/Eqcofe/database/migrations/0033_notification_operations.sql
          cd /tmp/eqcofe-import/Eqcofe
          rm -rf .git
          git init -q
          git add -A
          python3 - <<'PY'
          import hashlib, subprocess, os, sys
          expected_count = int(os.environ['CANONICAL_TRACKED_COUNT'])
          expected_manifest = os.environ['CANONICAL_TREE_MANIFEST_SHA256']
          raw = subprocess.check_output(['git','ls-files','-z'])
          paths = sorted(p.decode() for p in raw.split(b'\0') if p)
          lines = []
          for p in paths:
              with open(p, 'rb') as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              lines.append(f'{digest}  {p}\n')
          manifest = ''.join(lines).encode()
          actual = hashlib.sha256(manifest).hexdigest()
          print(f'TRACKED_COUNT={len(paths)}')
          print(f'TREE_MANIFEST_SHA256={actual}')
          if len(paths) != expected_count:
              print('Tracked file count mismatch', file=sys.stderr)
              sys.exit(1)
          if actual != expected_manifest:
              print('Canonical tree manifest mismatch', file=sys.stderr)
              sys.exit(1)
          print('CANONICAL_TREE_VERIFIED=YES')
          PY

      - name: Replace repository with canonical tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/eqcofe-import/Eqcofe/ ./
          rm -rf .canonical-import .bootstrap

      - name: Commit canonical import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EQCOFE Canonical Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No canonical changes to commit"
          else
            git commit -m "Import canonical EQCOFE source through Step 44"
            git push origin HEAD:main
          fi

      - name: Tag canonical import
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main
          if git rev-parse -q --verify refs/tags/eqcofe-canonical-import-v1 >/dev/null; then
            echo "Tag already exists"
          else
            git tag -a eqcofe-canonical-import-v1 -m "EQCOFE canonical import through Step 44"
            git push origin eqcofe-canonical-import-v1
          fi
