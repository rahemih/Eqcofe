name: Canonical EQCOFE Import

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

env:
  DRIVE_FILE_ID: 1bWR6xn1_uFHjhPxuRQVsZXBd4NTR9sjy

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'canonical-import-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Diagnose Drive package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
            --output /tmp/eqcofe-canonical.zip
          echo "SIZE=$(stat -c %s /tmp/eqcofe-canonical.zip)"
          sha256sum /tmp/eqcofe-canonical.zip
          file /tmp/eqcofe-canonical.zip
          unzip -t /tmp/eqcofe-canonical.zip
          rm -rf /tmp/drive-check && mkdir -p /tmp/drive-check
          unzip -q /tmp/eqcofe-canonical.zip -d /tmp/drive-check
          find /tmp/drive-check -maxdepth 2 -type f | head -30
          test -f /tmp/drive-check/Eqcofe/package.json
          test -f /tmp/drive-check/Eqcofe/contracts/http/openapi.yaml
          test -f /tmp/drive-check/Eqcofe/database/migrations/0033_notification_operations.sql
          echo "DRIVE_PACKAGE_STRUCTURALLY_VALID=YES"
