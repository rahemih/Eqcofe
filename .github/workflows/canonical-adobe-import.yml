name: Canonical EQCOFE Step-44 Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-adobe-import.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

env:
  CANONICAL_ZIP_SHA256: 2fd70647072b2808a2879de5b542b8c92d32b9b6252f09cd901e7b43b390e90d
  CANONICAL_FILE_COUNT: '782'
  CANONICAL_TREE_FINGERPRINT: 926f1793e1a367d8f87f7f28167f79a2580c9c02d7b34098236c93dac0fce7e3
  CANONICAL_URL: https://at.adobe.com/PaZBfNM34WPHdAik

jobs:
  import-and-verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'canonical-adobe-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout official repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$CANONICAL_URL" -o /tmp/eqcofe-canonical.zip
          echo "$CANONICAL_ZIP_SHA256  /tmp/eqcofe-canonical.zip" | sha256sum --check --strict
          rm -rf /tmp/eqcofe-extract /tmp/eqcofe-verify
          mkdir -p /tmp/eqcofe-extract /tmp/eqcofe-verify
          unzip -q /tmp/eqcofe-canonical.zip -d /tmp/eqcofe-extract
          test -f /tmp/eqcofe-extract/Eqcofe/package.json
          test -f /tmp/eqcofe-extract/Eqcofe/contracts/http/openapi.yaml
          test -f /tmp/eqcofe-extract/Eqcofe/database/migrations/0033_notification_operations.sql

      - name: Verify exact canonical tracked tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/eqcofe-extract/Eqcofe/ /tmp/eqcofe-verify/
          cd /tmp/eqcofe-verify
          git init -q
          git add -A
          git ls-files | LC_ALL=C sort > /tmp/canonical-files.txt
          count=$(wc -l < /tmp/canonical-files.txt | tr -d ' ')
          echo "Canonical tracked files: $count"
          test "$count" = "$CANONICAL_FILE_COUNT"
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/canonical-files.txt > /tmp/canonical-manifest.txt
          fingerprint=$(sha256sum /tmp/canonical-manifest.txt | awk '{print $1}')
          echo "Canonical tree fingerprint: $fingerprint"
          test "$fingerprint" = "$CANONICAL_TREE_FINGERPRINT"
          git ls-files -z | tar --null -T - -cf /tmp/canonical-tracked.tar

      - name: Replace main working tree with canonical source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf /tmp/canonical-tracked.tar -C .
          git add -A
          staged_count=$(git ls-files | wc -l | tr -d ' ')
          echo "Staged tracked files: $staged_count"
          test "$staged_count" = "$CANONICAL_FILE_COUNT"

      - name: Setup exact Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'

      - name: Enable Corepack and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          node --version
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run full canonical verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify

      - name: Commit verified canonical source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EQCOFE Canonical Import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Import verified canonical EQCOFE source through Step 44'
          git push origin HEAD:main
