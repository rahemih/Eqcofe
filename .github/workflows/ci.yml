name: Canonical CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
