<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">AD-F-01 مشتری و تاریخچهٔ مرتبط 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Entire surface is a retained design obligation only. All operations, including reads, remain NO_ACTION until canonical reconciliation; no permission, public/customer fallback or executable lifecycle is inferred. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="500" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتری و تاریخچهٔ مرتبط</text><rect x="24" y="160" width="552" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">این سطح تا تطبیق منابع قراردادی غیرفعال است؛ خواندن،</text><text x="560" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر و نتیجهٔ موفق در دسترس نیست.</text><rect x="24" y="256" width="552" height="52" rx="4" fill="#eeeeee" stroke="#555555"/><text x="560" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هیچ داده یا موفقیت اجرایی نمایش داده نمی‌شود.</text><rect x="24" y="336" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="366" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="560" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
