<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1558" viewBox="0 0 320 1558" role="img" aria-labelledby="title desc"><title id="title">AD-F-08 ایجاد — کوپن و استفاده‌ها 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Coupon create needs existing promotion_id and window within promotion; normalized uppercase code3..32, optional positive usage limits, enabled=true. Promotion lookup and disable are blocked; no automatic selection, rollback or redemption read is invented. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1558" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — کوپن و استفاده‌ها</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ ترویج موجود — بدون</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فهرست انتخاب</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کد کوپن — ۳ تا ۳۲ نویسهٔ</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لاتین</text><rect x="16" y="416" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="480" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان شروع</text><rect x="16" y="548" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="612" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان پایان</text><rect x="16" y="680" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="744" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سقف کل استفاده — صحیح مثبت</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا خالی</text><rect x="16" y="840" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="904" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سقف هر مشتری — صحیح مثبت یا</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خالی</text><rect x="16" y="1000" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1064" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1094" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازه داخل ترویج مبنا و شروع</text><text x="288" y="1122" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قبل از پایان؛ ایجاد با وضعیت</text><text x="288" y="1150" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال است. بدون شناسهٔ معتبر</text><text x="288" y="1178" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ادامه ندهید؛ غیرفعال‌سازی</text><text x="288" y="1206" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اینجا در دسترس نیست.</text><rect x="16" y="1244" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فهرست و ایجاد کوپن قابل</text><text x="288" y="1302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">طراحی‌اند؛ انتخاب ترویج،</text><text x="288" y="1330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">استفاده‌ها و تغییر وضعیت</text><text x="288" y="1358" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اینجا غیرفعال‌اند.</text><rect x="16" y="1408" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
