<svg xmlns="http://www.w3.org/2000/svg" width="320" height="626" viewBox="0 0 320 626" role="img" aria-labelledby="title desc"><title id="title">AD-F-15 در دسترس نیست — پیش‌نویس و راستی‌آزمایی مقالهٔ هوش مصنوعی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Entire surface is a retained design obligation only. All operations, including reads, remain NO_ACTION until canonical reconciliation; no permission, public/customer fallback or executable lifecycle is inferred. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="626" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در دسترس نیست — پیش‌نویس و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">راستی‌آزمایی مقالهٔ هوش</text><text x="288" y="176" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مصنوعی</text><rect x="16" y="216" width="288" height="136" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">این سطح تا تطبیق منابع</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قراردادی غیرفعال است؛</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خواندن، تغییر و نتیجهٔ موفق</text><text x="288" y="330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در دسترس نیست.</text><rect x="16" y="368" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هیچ داده یا موفقیت اجرایی</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش داده نمی‌شود.</text><rect x="16" y="476" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="288" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
