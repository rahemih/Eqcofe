<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="title desc"><title id="title">AD-F-15 پیش‌نویس و راستی‌آزمایی مقالهٔ هوش مصنوعی 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Entire surface is a retained design obligation only. All operations, including reads, remain NO_ACTION until canonical reconciliation; no permission, public/customer fallback or executable lifecycle is inferred. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="570" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نویس و راستی‌آزمایی مقالهٔ</text><text x="328" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هوش مصنوعی</text><rect x="16" y="188" width="328" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="328" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">این سطح تا تطبیق منابع قراردادی</text><text x="328" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال است؛ خواندن، تغییر و</text><text x="328" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ موفق در دسترس نیست.</text><rect x="16" y="312" width="328" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="328" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هیچ داده یا موفقیت اجرایی نمایش</text><text x="328" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">داده نمی‌شود.</text><rect x="16" y="420" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="328" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
