<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1042" viewBox="0 0 320 1042" role="img" aria-labelledby="title desc"><title id="title">AD-F-06 مشاهده — مقاله، نسخه و انتشار 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Draft/unpublished submit; in_review approve; approved future schedule; approved/scheduled publish; published unpublish. Archive requires reason2..1000; restore forbidden archived/approved/scheduled, creates new content version without publishing. No client If-Match or expected-version support; current/published version pointers differ. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1042" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — مقاله، نسخه و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتشار</text><rect x="16" y="188" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر محلیِ موارد نمایش‌داده‌شده</text><rect x="16" y="252" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="338" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="408" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="564" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><text x="288" y="628" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ در حال ویرایش با نسخهٔ</text><text x="288" y="656" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منتشرشده متفاوت است؛ ذخیره</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا بازیابی، انتشار خودکار</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست. شناسهٔ مقاله، وضعیت،</text><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری و نسخهٔ منتشرشده</text><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جدا؛ متن مقاله فقط نمایش امن</text><text x="288" y="796" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و غیرقابل‌اجرا. فهرست: وضعیت</text><text x="288" y="824" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و جست‌وجوی حداکثر ۲۰۰ نویسه،</text><text x="288" y="852" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سقف پاسخ ۲۰۰ رکورد.</text><rect x="16" y="892" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="922" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
