<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1538" viewBox="0 0 320 1538" role="img" aria-labelledby="title desc"><title id="title">AD-F-06 ویرایش — مقاله، نسخه و انتشار 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Draft/unpublished submit; in_review approve; approved future schedule; approved/scheduled publish; published unpublish. Archive requires reason2..1000; restore forbidden archived/approved/scheduled, creates new content version without publishing. No client If-Match or expected-version support; current/published version pointers differ. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1538" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش — مقاله، نسخه و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتشار</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان فارسی — الزامی، حداکثر</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۳۰۰ نویسه</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اسلاگ لاتین — حداکثر ۱۸۰</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="444" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="508" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متن مقاله — حداکثر ۱۰۰۰۰۰</text><text x="288" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="604" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="668" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان سئو — اختیاری، حداکثر</text><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۳۰۰ نویسه</text><rect x="16" y="764" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="828" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="858" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">توضیحات متا — اختیاری،</text><text x="288" y="886" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۵۰۰ نویسه</text><rect x="16" y="924" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="988" width="288" height="220" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1018" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداقل یک فیلد مجاز؛</text><text x="288" y="1046" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آرشیوشده، تأییدشده و</text><text x="288" y="1074" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان‌بندی‌شده قفل‌اند. ذخیره</text><text x="288" y="1102" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ تازه است و نسخهٔ</text><text x="288" y="1130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منتشرشده را جایگزین نمی‌کند؛</text><text x="288" y="1158" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازنویسی کهنه از سمت مشتری</text><text x="288" y="1186" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تضمین نشده است.</text><rect x="16" y="1224" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1254" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ در حال ویرایش با نسخهٔ</text><text x="288" y="1282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منتشرشده متفاوت است؛ ذخیره</text><text x="288" y="1310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا بازیابی، انتشار خودکار</text><text x="288" y="1338" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="16" y="1388" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1418" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1458" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1486" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
