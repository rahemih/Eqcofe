<svg xmlns="http://www.w3.org/2000/svg" width="320" height="598" viewBox="0 0 320 598" role="img" aria-labelledby="title desc"><title id="title">AD-F-06 موردی در پاسخ فعلی نیست 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Draft/unpublished submit; in_review approve; approved future schedule; approved/scheduled publish; published unpublish. Archive requires reason2..1000; restore forbidden archived/approved/scheduled, creates new content version without publishing. No client If-Match or expected-version support; current/published version pointers differ. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="598" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موردی در پاسخ فعلی نیست</text><rect x="16" y="160" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ در حال ویرایش با نسخهٔ</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منتشرشده متفاوت است؛ ذخیره</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا بازیابی، انتشار خودکار</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ خالی به معنی نبودن</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تمام داده‌ها نیست؛ دسترسی</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گسترده‌تر درخواست نشود.</text><rect x="16" y="448" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پاک‌کردن فیلتر محلی</text><text x="288" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
