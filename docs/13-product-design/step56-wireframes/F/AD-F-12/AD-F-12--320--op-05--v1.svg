<svg xmlns="http://www.w3.org/2000/svg" width="320" height="814" viewBox="0 0 320 814" role="img" aria-labelledby="title desc"><title id="title">AD-F-12 پیش‌نمایش — قالب اعلان و پیش‌نمایش نسخه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create/revise draft; revise preserves key/channel/locale/strict and creates new id/version. Activate draft only replaces active sibling; retire non-retired. Preview read-only without Step-Up/idempotency, does not send. Scalar variables, allowlist and strict renderer; no HTML-sanitizer guarantee. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="814" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش — قالب اعلان و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش نسخه</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متغیرهای نمونهٔ غیرحساس</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="192" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پیش‌نمایش؛ هیچ گیرنده‌ای</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیام نمی‌گیرد. متغیر الزامی</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خالی، مقدار پیچیده و متغیر</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نامجاز رد می‌شوند. متن به</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شکل امن و غیرقابل‌اجرا نمایش</text><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یابد.</text><rect x="16" y="528" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش، نسخهٔ پیش‌نویس تازه</text><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌سازد؛ پیش‌نمایش هیچ پیامی</text><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال نمی‌کند.</text><rect x="16" y="664" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="694" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش</text><text x="288" y="734" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="762" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
