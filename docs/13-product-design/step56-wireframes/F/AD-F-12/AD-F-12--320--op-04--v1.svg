<svg xmlns="http://www.w3.org/2000/svg" width="320" height="764" viewBox="0 0 320 764" role="img" aria-labelledby="title desc"><title id="title">AD-F-12 فعال‌سازی نسخه — قالب اعلان و پیش‌نمایش نسخه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create/revise draft; revise preserves key/channel/locale/strict and creates new id/version. Activate draft only replaces active sibling; retire non-retired. Preview read-only without Step-Up/idempotency, does not send. Scalar variables, allowlist and strict renderer; no HTML-sanitizer guarantee. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="764" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال‌سازی نسخه — قالب اعلان</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و پیش‌نمایش نسخه</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پیش‌نویس؛ نسخهٔ فعال</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">همان کلید، کانال و زبان</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگزین می‌شود. فعال‌سازی به</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">معنی ارسال نیست.</text><rect x="16" y="340" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش، نسخهٔ پیش‌نویس تازه</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌سازد؛ پیش‌نمایش هیچ پیامی</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال نمی‌کند.</text><rect x="16" y="464" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="544" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="614" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="644" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال‌سازی نسخه</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
