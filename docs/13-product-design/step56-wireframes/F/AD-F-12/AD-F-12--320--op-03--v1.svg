<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2050" viewBox="0 0 320 2050" role="img" aria-labelledby="title desc"><title id="title">AD-F-12 ایجاد — قالب اعلان و پیش‌نمایش نسخه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create/revise draft; revise preserves key/channel/locale/strict and creates new id/version. Activate draft only replaces active sibling; retire non-retired. Preview read-only without Step-Up/idempotency, does not send. Scalar variables, allowlist and strict renderer; no HTML-sanitizer guarantee. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="2050" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — قالب اعلان و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش نسخه</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید قالب — ۳ تا ۱۶۰ نویسهٔ</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لاتین</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کانال: پیامک، ایمیل یا</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درون‌برنامه</text><rect x="16" y="444" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="508" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زبان — پیش‌فرض فارسی ایران</text><rect x="16" y="576" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="640" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی اختیاری — حداکثر</text><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۲۰۰ نویسه</text><rect x="16" y="736" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="800" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="830" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان — برای ایمیل الزامی،</text><text x="288" y="858" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۵۰۰ نویسه</text><rect x="16" y="896" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="960" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متن قالب — ۱ تا ۲۰۰۰۰ نویسه</text><rect x="16" y="1028" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1092" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1122" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متغیرهای مجاز</text><rect x="16" y="1160" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1224" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1254" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متغیرهای الزامی — زیرمجموعهٔ</text><text x="288" y="1282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز</text><rect x="16" y="1320" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1384" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1414" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنترل سختگیرانه — پیش‌فرض</text><text x="288" y="1442" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">روشن</text><rect x="16" y="1480" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1544" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نویس ساخته می‌شود؛ نام</text><text x="288" y="1602" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متغیر حساس و عبارت اجرایی</text><text x="288" y="1630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ممنوع. مقادیر نمونه فقط</text><text x="288" y="1658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ساختگی و غیرحساس باشند.</text><rect x="16" y="1696" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش، نسخهٔ پیش‌نویس تازه</text><text x="288" y="1754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌سازد؛ پیش‌نمایش هیچ پیامی</text><text x="288" y="1782" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال نمی‌کند.</text><rect x="16" y="1820" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="1900" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1930" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1970" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1998" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
