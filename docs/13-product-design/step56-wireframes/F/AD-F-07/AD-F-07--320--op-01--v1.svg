<svg xmlns="http://www.w3.org/2000/svg" width="320" height="986" viewBox="0 0 320 986" role="img" aria-labelledby="title desc"><title id="title">AD-F-07 مشاهده — کمپین و چرخه اجرا 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Only list/get/create/pause supported; pause active only with body expected_version, Step-Up and idempotency. Create draft with name, description&lt;=2000 and start&lt;end. Frozen activation/reschedule/end/archive authority gaps remain NO_ACTION. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="986" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — کمپین و چرخه اجرا</text><rect x="16" y="160" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر محلیِ موارد نمایش‌داده‌شده</text><rect x="16" y="224" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="254" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="380" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="536" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><text x="288" y="600" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط مشاهده، ایجاد پیش‌نویس و</text><text x="288" y="628" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">توقف کمپین پشتوانهٔ معتبر</text><text x="288" y="656" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دارند؛ سایر اقدامات</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال‌اند. نام، وضعیت،</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع، پایان و نسخهٔ کمپین؛</text><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر وضعیت پشتیبانی می‌شود.</text><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سایر اقدامات فقط مطابق نگاشت</text><text x="288" y="796" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجازند.</text><rect x="16" y="836" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="866" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
