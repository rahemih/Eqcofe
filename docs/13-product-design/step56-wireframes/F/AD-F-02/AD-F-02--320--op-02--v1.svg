<svg xmlns="http://www.w3.org/2000/svg" width="320" height="846" viewBox="0 0 320 846" role="img" aria-labelledby="title desc"><title id="title">AD-F-02 مشاهده — بررسی عضویت عمده 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Submitted-&gt;under_review; approve/reject under_review only. Approve requires active retail customer and promotes atomically; no added separation-of-duties rule. Comments optional2000, reject reason2..2000. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="846" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — بررسی عضویت عمده</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع بررسی با تصمیم نهایی</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جداست؛ تأیید، مشتری خردهٔ</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال را عمده می‌کند.</text><rect x="16" y="284" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت —</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پاسخ مجاز</text><rect x="16" y="380" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو یا فیلتر تنها در</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محدودهٔ پشتیبانی‌شده؛ بدون</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شمارش ساختگی.</text><rect x="16" y="504" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام کسب‌وکار، مدیر، نوع</text><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعالیت، استان و شهر، وضعیت و</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت تصمیم؛ فیلتر وضعیت</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال‌شده، در حال بررسی،</text><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأییدشده یا ردشده.</text><rect x="16" y="696" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
