<svg xmlns="http://www.w3.org/2000/svg" width="320" height="730" viewBox="0 0 320 730" role="img" aria-labelledby="title desc"><title id="title">AD-F-02 شروع بررسی — بررسی عضویت عمده 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Submitted-&gt;under_review; approve/reject under_review only. Approve requires active retail customer and promotes atomically; no added separation-of-duties rule. Comments optional2000, reject reason2..2000. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="730" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع بررسی — بررسی عضویت</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عمده</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">توضیح اختیاری — حداکثر ۲۰۰۰</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط ارسال‌شده؛ بررسی را آغاز</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید.</text><rect x="16" y="444" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع بررسی با تصمیم نهایی</text><text x="288" y="502" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جداست؛ تأیید، مشتری خردهٔ</text><text x="288" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال را عمده می‌کند.</text><rect x="16" y="580" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="610" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="650" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="678" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
