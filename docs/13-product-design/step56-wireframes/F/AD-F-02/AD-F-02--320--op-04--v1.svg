<svg xmlns="http://www.w3.org/2000/svg" width="320" height="742" viewBox="0 0 320 742" role="img" aria-labelledby="title desc"><title id="title">AD-F-02 رد — بررسی عضویت عمده 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Submitted-&gt;under_review; approve/reject under_review only. Approve requires active retail customer and promotes atomically; no added separation-of-duties rule. Comments optional2000, reject reason2..2000. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="742" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رد — بررسی عضویت عمده</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل رد — ۲ تا ۲۰۰۰ نویسه</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط در حال بررسی؛ رد نیازمند</text><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل است.</text><rect x="16" y="388" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="418" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع بررسی با تصمیم نهایی</text><text x="288" y="446" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جداست؛ تأیید، مشتری خردهٔ</text><text x="288" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال را عمده می‌کند.</text><rect x="16" y="512" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="542" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="592" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="622" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="662" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="690" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
