<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1042" viewBox="0 0 320 1042" role="img" aria-labelledby="title desc"><title id="title">AD-F-11 مشاهده — تحویل اعلان و تلاش مجدد 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Manual retry only sms/email delivery statuses blocked/failed/dead_lettered/retry_wait; delivered/processing/in_app excluded. Returns retried ids, not delivered. Raw detail projection is not certified masked; show only safe allowlisted metadata. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1042" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — تحویل اعلان و تلاش</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجدد</text><rect x="16" y="188" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر محلیِ موارد نمایش‌داده‌شده</text><rect x="16" y="252" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="338" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="408" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="564" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><text x="288" y="628" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تلاش مجدد، کانال واجد شرایط</text><text x="288" y="656" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را صف می‌کند؛ به معنی تحویل</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعلان نیست. وضعیت هر کانال،</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان، تعداد تلاش و کد خطا؛</text><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقصد فقط پوشیده، بدون نمایش</text><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محتوای خام یا اطلاعات حساس.</text><text x="288" y="796" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر وضعیت و کانال، حداکثر</text><text x="288" y="824" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۱۰۰ رکورد و جابه‌جایی با</text><text x="288" y="852" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">offset.</text><rect x="16" y="892" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="922" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
