<svg xmlns="http://www.w3.org/2000/svg" width="320" height="874" viewBox="0 0 320 874" role="img" aria-labelledby="title desc"><title id="title">AD-F-11 مشاهده — تحویل اعلان و تلاش مجدد 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Manual retry only sms/email delivery statuses blocked/failed/dead_lettered/retry_wait; delivered/processing/in_app excluded. Returns retried ids, not delivered. Raw detail projection is not certified masked; show only safe allowlisted metadata. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="874" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — تحویل اعلان و تلاش</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجدد</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تلاش مجدد، کانال واجد شرایط</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را صف می‌کند؛ به معنی تحویل</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعلان نیست.</text><rect x="16" y="312" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت —</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پاسخ مجاز</text><rect x="16" y="408" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو یا فیلتر تنها در</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محدودهٔ پشتیبانی‌شده؛ بدون</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شمارش ساختگی.</text><rect x="16" y="532" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خلاصهٔ شمارش و تأخیر عملیاتی</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط از پاسخ این مسیر؛ نتیجهٔ</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان‌بندی یا صف، موفقیت</text><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتشار یا تحویل را تضمین</text><text x="288" y="674" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌کند.</text><rect x="16" y="724" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
