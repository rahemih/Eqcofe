<svg xmlns="http://www.w3.org/2000/svg" width="320" height="820" viewBox="0 0 320 820" role="img" aria-labelledby="title desc"><title id="title">AD-F-11 صف‌کردن مجدد — تحویل اعلان و تلاش مجدد 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Manual retry only sms/email delivery statuses blocked/failed/dead_lettered/retry_wait; delivered/processing/in_app excluded. Returns retried ids, not delivered. Raw detail projection is not certified masked; show only safe allowlisted metadata. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="820" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">صف‌کردن مجدد — تحویل اعلان و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تلاش مجدد</text><rect x="16" y="188" width="288" height="192" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پیامک یا ایمیلِ مسدود،</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ناموفق، کنارگذاشته‌شده یا</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منتظر تکرار؛ کانال تحویل‌شده</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا در حال پردازش تکرار</text><text x="288" y="330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌شود. پاسخ فقط شناسهٔ</text><text x="288" y="358" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کانال‌های دوباره صف‌شده است.</text><rect x="16" y="396" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تلاش مجدد، کانال واجد شرایط</text><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را صف می‌کند؛ به معنی تحویل</text><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعلان نیست.</text><rect x="16" y="520" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="600" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="670" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="700" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">صف‌کردن مجدد</text><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
