<svg xmlns="http://www.w3.org/2000/svg" width="320" height="654" viewBox="0 0 320 654" role="img" aria-labelledby="title desc"><title id="title">AD-C-03 مقدار ویژگی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Maintain typed definitions/values separately from product/variant assignments; review the full replacement set and reject mismatched category, scope or value ownership. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="654" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار ویژگی</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط یکی: متن، عدد یا بله/خیر</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار انتخاب‌شده</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ترتیب نمایش</text><rect x="16" y="504" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ذخیرهٔ مقدار</text><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="602" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
