<svg xmlns="http://www.w3.org/2000/svg" width="320" height="846" viewBox="0 0 320 846" role="img" aria-labelledby="title desc"><title id="title">AD-C-03 تعریف ویژگی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Maintain typed definitions/values separately from product/variant assignments; review the full replacement set and reject mismatched category, scope or value ownership. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="846" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعریف ویژگی</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید ویژگی</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع: متن، عدد، بله/خیر یا</text><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخابی</text><rect x="16" y="520" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسته و واحد</text><rect x="16" y="588" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کاربرد برای کالا یا گونه؛</text><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر و مقایسه</text><rect x="16" y="696" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ذخیرهٔ ویژگی</text><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
