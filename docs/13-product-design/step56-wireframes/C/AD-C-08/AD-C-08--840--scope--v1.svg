<svg xmlns="http://www.w3.org/2000/svg" width="840" height="700" viewBox="0 0 840 700" role="img" aria-labelledby="title desc"><title id="title">AD-C-08 کنترل فروش 840</title><desc id="desc">Persian RTL low-fidelity design evidence. Choose exact scope/action, receive a ten-minute preview, inspect stored impact, confirm and perform source-required Step-Up. Do not claim fresh recount/requester binding; expired/consumed preview and unknown outcome never auto-retry. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="840" height="700" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="840" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="808" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="808" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="600" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="616" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="616" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="616" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="616" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="616" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="616" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="616" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="616" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="568" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="552" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنترل فروش</text><rect x="32" y="160" width="536" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه: همه، برند، دسته، کالا یا گونه</text><rect x="32" y="228" width="536" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="292" width="536" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ هدف برای دامنهٔ انتخابی</text><rect x="32" y="360" width="536" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="424" width="536" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هدف: توقف یا ازسرگیری فروش</text><rect x="32" y="504" width="536" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="552" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت پیش‌نمایش</text><text x="552" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
