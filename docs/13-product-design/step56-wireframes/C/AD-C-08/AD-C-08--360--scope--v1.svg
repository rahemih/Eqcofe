<svg xmlns="http://www.w3.org/2000/svg" width="360" height="682" viewBox="0 0 360 682" role="img" aria-labelledby="title desc"><title id="title">AD-C-08 کنترل فروش 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Choose exact scope/action, receive a ten-minute preview, inspect stored impact, confirm and perform source-required Step-Up. Do not claim fresh recount/requester binding; expired/consumed preview and unknown outcome never auto-retry. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="682" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنترل فروش</text><rect x="16" y="160" width="328" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه: همه، برند، دسته، کالا یا</text><text x="328" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گونه</text><rect x="16" y="256" width="328" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="328" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ هدف برای دامنهٔ انتخابی</text><rect x="16" y="388" width="328" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="328" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هدف: توقف یا ازسرگیری فروش</text><rect x="16" y="532" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت پیش‌نمایش</text><text x="328" y="602" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
