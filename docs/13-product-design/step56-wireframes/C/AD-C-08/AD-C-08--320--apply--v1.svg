<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" role="img" aria-labelledby="title desc"><title id="title">AD-C-08 تأیید تغییر فروش 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Choose exact scope/action, receive a ten-minute preview, inspect stored impact, confirm and perform source-required Step-Up. Do not claim fresh recount/requester binding; expired/consumed preview and unknown outcome never auto-retry. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="680" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید تغییر فروش</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر و دامنه را دوباره بررسی</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید</text><rect x="16" y="256" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">احراز مجدد با کلید امنیتی</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لازم است</text><rect x="16" y="352" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پس از تأیید، درخواست فقط یک</text><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بار ارسال می‌شود</text><rect x="16" y="460" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="530" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="560" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال تغییر</text><text x="288" y="600" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="628" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
