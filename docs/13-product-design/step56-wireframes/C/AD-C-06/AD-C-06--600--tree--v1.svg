<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">AD-C-06 دسته‌بندی‌ها 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Maintain the category hierarchy with parent existence and cycle validation; preserve source versions, and review sales impact without claiming all inherited stops are removed. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="500" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسته‌بندی‌ها</text><rect x="24" y="160" width="552" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دستهٔ اصلی نمونه</text><rect x="24" y="224" width="528" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="536" y="254" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زیر‌دستهٔ نمونه</text><rect x="24" y="288" width="552" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="318" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب دسته برای ویرایش</text><rect x="24" y="364" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">افزودن دسته</text><text x="560" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
