<svg xmlns="http://www.w3.org/2000/svg" width="320" height="610" viewBox="0 0 320 610" role="img" aria-labelledby="title desc"><title id="title">AD-C-01 نسخهٔ کالا تغییر کرده 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create a draft, edit using current version, inspect active variants and price eligibility before publication; archive stops sales and restore returns to draft. Preserve absent descriptions rather than inventing prefill. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="610" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ کالا تغییر کرده</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییرات شما هنوز ذخیره</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشده‌اند</text><rect x="16" y="256" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ تازه را دریافت و</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقایسه کنید</text><rect x="16" y="352" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پس از بازبینی دوباره ذخیره</text><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید</text><rect x="16" y="460" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت نسخهٔ تازه</text><text x="288" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
