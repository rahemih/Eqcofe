<svg xmlns="http://www.w3.org/2000/svg" width="320" height="660" viewBox="0 0 320 660" role="img" aria-labelledby="title desc"><title id="title">AD-C-01 آرشیو کالا 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create a draft, edit using current version, inspect active variants and price eligibility before publication; archive stops sales and restore returns to draft. Preserve absent descriptions rather than inventing prefill. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="660" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آرشیو کالا</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا: نمونهٔ آموزشی</text><rect x="16" y="228" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">با آرشیو، فروش متوقف می‌شود</text><rect x="16" y="296" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل آرشیو را وارد کنید</text><rect x="16" y="364" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="440" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="470" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="510" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="540" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید آرشیو</text><text x="288" y="580" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="608" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
