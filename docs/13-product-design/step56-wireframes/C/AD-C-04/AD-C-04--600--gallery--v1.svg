<svg xmlns="http://www.w3.org/2000/svg" width="600" height="722" viewBox="0 0 600 722" role="img" aria-labelledby="title desc"><title id="title">AD-C-04 رسانه‌های کالا 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Attach only active media to the same product/variant, edit Persian alternative text, reorder using buttons and choose at most one primary. Detach is not asset deletion. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="722" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رسانه‌های کالا</text><rect x="24" y="160" width="552" height="96" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="200" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگاه رسانه — بدون تصویر واقعی</text><rect x="24" y="272" width="552" height="96" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="312" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگاه رسانه — بدون تصویر واقعی</text><rect x="24" y="384" width="552" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="414" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تصویر نمونه — اصلی</text><rect x="24" y="452" width="552" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویدئوی نمونه — دوم</text><rect x="24" y="520" width="552" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متن جایگزین فارسی برای تصویر</text><rect x="24" y="600" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اتصال رسانه</text><text x="560" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
