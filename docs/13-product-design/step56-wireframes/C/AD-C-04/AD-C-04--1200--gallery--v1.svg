<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="722" viewBox="0 0 1200 722" role="img" aria-labelledby="title desc"><title id="title">AD-C-04 رسانه‌های کالا 1200</title><desc id="desc">Persian RTL low-fidelity design evidence. Attach only active media to the same product/variant, edit Persian alternative text, reorder using buttons and choose at most one primary. Detach is not asset deletion. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1200" height="722" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1200" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1168" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1168" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="960" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="976" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="976" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="976" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="976" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="976" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="976" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="976" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="976" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="928" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="912" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رسانه‌های کالا</text><rect x="32" y="160" width="896" height="96" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="912" y="200" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگاه رسانه — بدون تصویر واقعی</text><rect x="32" y="272" width="896" height="96" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="912" y="312" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگاه رسانه — بدون تصویر واقعی</text><rect x="32" y="384" width="896" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="414" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تصویر نمونه — اصلی</text><rect x="32" y="452" width="896" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویدئوی نمونه — دوم</text><rect x="32" y="520" width="896" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متن جایگزین فارسی برای تصویر</text><rect x="32" y="600" width="896" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="912" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اتصال رسانه</text><text x="912" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
