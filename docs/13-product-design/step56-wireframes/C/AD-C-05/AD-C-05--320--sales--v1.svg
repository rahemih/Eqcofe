<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" role="img" aria-labelledby="title desc"><title id="title">AD-C-05 فروش محصولات برند 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create/edit brands through the list, reconcile version conflicts and distinguish brand sales control from product publication. No invented brand archive/delete operation. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="680" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش محصولات برند</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برند: نمونهٔ آموزشی</text><rect x="16" y="228" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر فروش برند بر فروش مؤثر</text><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالاها اثر دارد</text><rect x="16" y="324" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="354" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برای عملیات گروهی از</text><text x="288" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش کنترل فروش استفاده</text><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید</text><rect x="16" y="460" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="530" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="560" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید تغییر فروش</text><text x="288" y="600" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="628" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
