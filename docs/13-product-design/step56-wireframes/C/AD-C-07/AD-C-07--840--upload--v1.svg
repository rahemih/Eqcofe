<svg xmlns="http://www.w3.org/2000/svg" width="840" height="700" viewBox="0 0 840 700" role="img" aria-labelledby="title desc"><title id="title">AD-C-07 بارگذاری رسانه 840</title><desc id="desc">Persian RTL low-fidelity design evidence. Request a configured signed upload target, transfer and complete separately, inspect processing/quarantine before approval. Delete only unreferenced assets; no media browser endpoint, scan certification or secret URL display. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="840" height="700" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="840" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="808" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="808" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="600" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="616" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="616" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="616" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="616" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="616" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="616" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="616" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="616" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="568" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="552" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بارگذاری رسانه</text><rect x="32" y="160" width="536" height="96" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="552" y="200" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگاه رسانه — بدون تصویر واقعی</text><rect x="32" y="272" width="536" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب تصویر یا ویدئو</text><rect x="32" y="340" width="536" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">JPEG، PNG، WebP یا MP4؛ حداکثر ۵۰ مگابایت</text><rect x="32" y="408" width="536" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پس از ارسال فایل، تکمیل و بررسی جداگانه انجام می‌شود</text><rect x="32" y="488" width="536" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="552" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب فایل</text><text x="552" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
