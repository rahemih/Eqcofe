<svg xmlns="http://www.w3.org/2000/svg" width="320" height="694" viewBox="0 0 320 694" role="img" aria-labelledby="title desc"><title id="title">AD-C-07 بارگذاری رسانه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Request a configured signed upload target, transfer and complete separately, inspect processing/quarantine before approval. Delete only unreferenced assets; no media browser endpoint, scan certification or secret URL display. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="694" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بارگذاری رسانه</text><rect x="16" y="160" width="288" height="96" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="200" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگاه رسانه — بدون تصویر واقعی</text><rect x="16" y="272" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب تصویر یا ویدئو</text><rect x="16" y="340" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">JPEG، PNG، WebP یا MP4؛</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۵۰ مگابایت</text><rect x="16" y="436" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پس از ارسال فایل، تکمیل و</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی جداگانه انجام می‌شود</text><rect x="16" y="544" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب فایل</text><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
