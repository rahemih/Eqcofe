<svg xmlns="http://www.w3.org/2000/svg" width="320" height="582" viewBox="0 0 320 582" role="img" aria-labelledby="title desc"><title id="title">AD-C-07 رسانه هنوز استفاده می‌شود 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Request a configured signed upload target, transfer and complete separately, inspect processing/quarantine before approval. Delete only unreferenced assets; no media browser endpoint, scan certification or secret URL display. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="582" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رسانه هنوز استفاده می‌شود</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ابتدا اتصال کالا را بررسی</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید</text><rect x="16" y="256" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برداشتن اتصال با حذف فایل</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است</text><rect x="16" y="352" width="288" height="52" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هیچ حذف اجباری انجام نمی‌شود</text><rect x="16" y="432" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت به کالا</text><text x="288" y="502" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
