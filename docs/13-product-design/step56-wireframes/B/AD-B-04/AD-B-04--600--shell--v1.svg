<svg xmlns="http://www.w3.org/2000/svg" width="600" height="978" viewBox="0 0 600 978" role="img" aria-labelledby="title desc"><title id="title">AD-B-04 پوستهٔ مدیریت 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Inline-start sidebar at expanded widths, disclosure/drawer below 840. Header contains context, local destination search and account/exit. No invented notification feed. Breadcrumb links preserve safe context and focus main heading after navigation. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="978" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پوستهٔ مدیریت</text><rect x="24" y="160" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="24" y="220" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="250" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="24" y="280" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="24" y="340" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="24" y="400" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="430" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="24" y="460" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="24" y="520" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="24" y="580" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="610" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><rect x="24" y="640" width="552" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مسیر جاری و زمینهٔ کاری</text><rect x="24" y="708" width="552" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="738" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هشت گروه اصلی، با فیلتر دسترسی</text><rect x="24" y="776" width="552" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="806" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان صفحه و مسیر بازگشت</text><rect x="24" y="856" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="886" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باز کردن منو</text><text x="560" y="926" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
