<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1034" viewBox="0 0 320 1034" role="img" aria-labelledby="title desc"><title id="title">AD-B-04 فهرست بخش‌ها 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Inline-start sidebar at expanded widths, disclosure/drawer below 840. Header contains context, local destination search and account/exit. No invented notification feed. Breadcrumb links preserve safe context and focus main heading after navigation. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1034" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فهرست بخش‌ها</text><rect x="16" y="160" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="16" y="220" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="250" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="16" y="280" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="16" y="340" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="16" y="400" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="430" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="16" y="460" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="16" y="580" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="610" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><rect x="16" y="640" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بستن منو و بازگشت فوکوس</text><rect x="16" y="708" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="738" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گروه‌ها با دکمهٔ باز و</text><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بسته‌شدن</text><rect x="16" y="804" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="834" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشانهٔ متنی مقصد جاری</text><rect x="16" y="884" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="914" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بستن منو</text><text x="288" y="954" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="982" fon