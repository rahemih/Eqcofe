<svg xmlns="http://www.w3.org/2000/svg" width="360" height="526" viewBox="0 0 360 526" role="img" aria-labelledby="title desc"><title id="title">AD-B-02 نشست و دسترسی من 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Read /admin/me, /permissions and /scopes for the current session. A context selector can narrow assigned scopes only; it cannot edit RBAC. A role/session change clears sensitive data and rechecks each destination. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="526" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشست و دسترسی من</text><rect x="16" y="160" width="328" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع حساب: کارکنان</text><rect x="16" y="228" width="328" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوزها فقط از پاسخ معتبر سرور</text><rect x="16" y="296" width="328" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه‌های انبار و فروشگاه فیزیکی</text><rect x="16" y="376" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی دسترسی</text><text x="328" y="446" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
