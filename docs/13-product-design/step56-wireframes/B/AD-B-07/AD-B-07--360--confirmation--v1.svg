<svg xmlns="http://www.w3.org/2000/svg" width="360" height="624" viewBox="0 0 360 624" role="img" aria-labelledby="title desc"><title id="title">AD-B-07 بررسی اقدام حساس 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Confirmation, Step-Up and approval are separate gates. Validate exact operation permission conjunction, scope, lifecycle and fresh impact before submission. Unknown result requires owner-supported status check before any safe idempotent retry. No automatic replay or fabricated audit reference. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="624" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی اقدام حساس</text><rect x="16" y="160" width="328" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام هدف، دامنه و پیامد اقدام</text><rect x="16" y="228" width="328" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برگشت‌پذیری و موارد تحت تأثیر</text><rect x="16" y="296" width="328" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ابتدا انصراف؛ ادامه پس از بررسی</text><text x="32