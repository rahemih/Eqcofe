<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">AD-B-03 نمای کلی در دسترس نیست 600</title><desc id="desc">Persian RTL low-fidelity design evidence. GET /admin/dashboard is contract-only and unresolved. Only unavailable concept evidence is permitted; static known authorized destination links do not imply a dashboard read, metric feed or notification count. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="500" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی در دسترس نیست</text><rect x="24" y="160" width="552" height="52" rx="4" fill="#eeeeee" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات نمای کلی فعلاً در دسترس نیست</text><rect x="24" y="228" width="552" height="52" rx="4" fill="#eeeeee" stroke="#555555"/><text x="560" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از فهرست بخش‌ها وارد کارهای مجاز شوید</text><rect x="24" y="296" width="552" height="52" rx="4" fill="#eeeeee" stroke="#555555"/><text x="560" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برای پیگیری با مسئول پشتیبانی تماس بگیرید</text><rect x="24" y="376" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رفتن به فهرست مسیرها</text><text x="560" y="446" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
