<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="626" viewBox="0 0 1440 626" role="img" aria-labelledby="title desc"><title id="title">AD-B-01 ورود مدیر 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. Public login returns pre-authentication only, then mandatory FIDO authentication or first-key enrollment with a valid enrollment token. Preserve paste/password manager support. No OTP or password-only bypass. Credential registration/revocation requires existing Step-Up. Logout clears the session; never render tokens. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="626" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ورود امن کارکنان</text><text x="960" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ورود به مدیریت</text><text x="944" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ورود مدیر</text><rect x="480" y="160" width="480" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="944" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام کاربری</text><rect x="480" y="228" width="480" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="480" y="292" width="480" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="944" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رمز عبور</text><rect x="480" y="360" width="480" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="480" y="424" width="480" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="944" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ورود با رمز، سپس کلید امنیتی</text><rect x="480" y="504" width="480" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="944" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ادامه</text><text x="944" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
