<svg xmlns="http://www.w3.org/2000/svg" width="320" height="554" viewBox="0 0 320 554" role="img" aria-labelledby="title desc"><title id="title">AD-B-01 کلیدهای امنیتی من 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Public login returns pre-authentication only, then mandatory FIDO authentication or first-key enrollment with a valid enrollment token. Preserve paste/password manager support. No OTP or password-only bypass. Credential registration/revocation requires existing Step-Up. Logout clears the session; never render tokens. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="554" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلیدهای امنیتی من</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام دستگاه و زمان ثبت</text><rect x="16" y="228" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">افزودن کلید: احراز مجدد</text><rect x="16" y="296" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو کلید انتخاب‌شده: بررسی</text><text x="288" y="354" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر و احراز مجدد</text><rect x="16" y="404" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">افزودن کلید</text><text x="288" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="502" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
