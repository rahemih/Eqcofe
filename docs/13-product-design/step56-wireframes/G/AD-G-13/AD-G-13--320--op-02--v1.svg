<svg xmlns="http://www.w3.org/2000/svg" width="320" height="982" viewBox="0 0 320 982" role="img" aria-labelledby="title desc"><title id="title">AD-G-13 مشاهده — درخواست تغییر تنظیمات 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Submitted approve/reject; requester-only cancel submitted/approved; apply approved. No added two-person rule; scheduled_for is stored transition metadata, not deferred job. Proposed value revalidated; not tied to preview snapshot. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="982" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — درخواست تغییر</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید با اعمال متفاوت است؛</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان ثبت‌شده تضمین اجرای</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان‌بندی‌شده نیست.</text><rect x="16" y="312" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت —</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پاسخ مجاز</text><rect x="16" y="408" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو یا فیلتر تنها در</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محدودهٔ پشتیبانی‌شده؛ بدون</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شمارش ساختگی.</text><rect x="16" y="532" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست‌کننده، مقدار قبل و</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بعد، دامنه، دلیل و وضعیت</text><rect x="16" y="628" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید، رد، لغو و اعمال جدا؛</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو فقط برای درخواست‌کننده</text><rect x="16" y="724" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال زمان‌بندی‌شدهٔ خودکار</text><text x="288" y="782" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تضمین نشده است.</text><rect x="16" y="832" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="862" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="902" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="930" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
