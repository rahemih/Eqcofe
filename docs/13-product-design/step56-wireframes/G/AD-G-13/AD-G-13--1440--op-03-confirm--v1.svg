<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">AD-G-13 مرور نهایی — اعمال 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. Submitted approve/reject; requester-only cancel submitted/approved; apply approved. No added two-person rule; scheduled_for is stored transition metadata, not deferred job. Proposed value revalidated; not tied to preview snapshot. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="700" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — اعمال</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام را مرور کنید.</text><rect x="32" y="228" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط تأییدشده؛ مقدار دوباره اعتبارسنجی می‌شود. زمان ثبت‌شده وعدهٔ اجرای خودکار در آینده نیست.</text><rect x="32" y="296" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید با اعمال متفاوت است؛ زمان ثبت‌شده تضمین اجرای زمان‌بندی‌شده نیست.</text><rect x="32" y="364" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="32" y="444" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="32" y="514" width="1136" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="544" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال</text><text x="1152" y="584" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
