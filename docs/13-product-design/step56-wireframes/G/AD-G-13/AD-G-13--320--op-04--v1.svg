<svg xmlns="http://www.w3.org/2000/svg" width="320" height="770" viewBox="0 0 320 770" role="img" aria-labelledby="title desc"><title id="title">AD-G-13 تأیید — درخواست تغییر تنظیمات 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Submitted approve/reject; requester-only cancel submitted/approved; apply approved. No added two-person rule; scheduled_for is stored transition metadata, not deferred job. Proposed value revalidated; not tied to preview snapshot. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="770" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید — درخواست تغییر</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">توضیح اختیاری</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط ارسال‌شده؛ تأیید به معنی</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال نیست.</text><rect x="16" y="416" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="446" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید با اعمال متفاوت است؛</text><text x="288" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان ثبت‌شده تضمین اجرای</text><text x="288" y="502" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان‌بندی‌شده نیست.</text><rect x="16" y="540" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="570" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="620" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="650" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="690" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
