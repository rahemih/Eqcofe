<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1126" viewBox="0 0 320 1126" role="img" aria-labelledby="title desc"><title id="title">AD-G-03 ویرایش — حساب‌های حسابداری 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create code/name/type/normal/optional parent/system key/postable. PATCH only name/parent/postable/active. Self-parent rejected; deeper cycle protection not certified. Deactivate route Step-Up; PATCH is_active has different source metadata. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1126" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش — حساب‌های حسابداری</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حساب والد</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قابل ثبت بودن</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال بودن</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداقل یک تغییر؛ کد، نوع و</text><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ماهیت ثابت‌اند. والد خود</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حساب ممنوع؛ بررسی چرخهٔ عمیق</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تضمین نشده است.</text><rect x="16" y="840" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="870" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حساب والد و قابلیت ثبت بررسی</text><text x="288" y="898" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شوند؛ تغییر کد، نوع و ماهیت</text><text x="288" y="926" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از ویرایش مجاز نیست.</text><rect x="16" y="976" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1006" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1046" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1074" font-size="16" dire