<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1354" viewBox="0 0 1440 1354" role="img" aria-labelledby="title desc"><title id="title">AD-G-03 ایجاد — حساب‌های حسابداری 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. Create code/name/type/normal/optional parent/system key/postable. PATCH only name/parent/postable/active. Self-parent rejected; deeper cycle protection not certified. Deactivate route Step-Up; PATCH is_active has different source metadata. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="1354" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — حساب‌های حسابداری</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کد حساب — حداکثر ۴۰ نویسه</text><rect x="32" y="228" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="292" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی — حداکثر ۲۰۰ نویسه</text><rect x="32" y="360" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="424" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع حساب</text><rect x="32" y="492" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="556" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ماهیت بدهکار یا بستانکار</text><rect x="32" y="624" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="688" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حساب والد — اختیاری</text><rect x="32" y="756" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="820" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید سیستمی — اختیاری</text><rect x="32" y="888" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="952" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="982" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قابل ثبت بودن</text><rect x="32" y="1020" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="1084" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="1114" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع از دارایی، بدهی، حقوق مالکانه، درآمد، هزینه، کاهندهٔ دارایی یا درآمد؛ حساب والد باید موجود باشد.</text><rect x="32" y="1152" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="1182" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حساب والد و قابلیت ثبت بررسی شوند؛ تغییر کد، نوع و ماهیت از ویرایش مجاز نیست.</text><rect x="32" y="1232" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="1262" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="1152" y="1302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
