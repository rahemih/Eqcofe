<svg xmlns="http://www.w3.org/2000/svg" width="320" height="764" viewBox="0 0 320 764" role="img" aria-labelledby="title desc"><title id="title">AD-G-03 مرور نهایی — ایجاد 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create code/name/type/normal/optional parent/system key/postable. PATCH only name/parent/postable/active. Self-parent rejected; deeper cycle protection not certified. Deactivate route Step-Up; PATCH is_active has different source metadata. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="764" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — ایجاد</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع از دارایی، بدهی، حقوق</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالکانه، درآمد، هزینه،</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کاهندهٔ دارایی یا درآمد؛</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حساب والد باید موجود باشد.</text><rect x="16" y="408" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حساب والد و قابلیت ثبت بررسی</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شوند؛ تغییر کد، نوع و ماهیت</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از ویرایش مجاز نیست.</text><rect x="16" y="544" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="614" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="644" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
