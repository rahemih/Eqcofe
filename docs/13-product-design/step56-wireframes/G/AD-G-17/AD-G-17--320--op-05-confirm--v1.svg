<svg xmlns="http://www.w3.org/2000/svg" width="320" height="832" viewBox="0 0 320 832" role="img" aria-labelledby="title desc"><title id="title">AD-G-17 مرور نهایی — غیرفعال‌سازی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Staff create enrollment24h, recovery30min revokes credentials/sessions. Staff PATCH name/code only; role/scope replacement not additive, matching If-Match, no idempotency. Empty scope per type means global in ScopePolicy. Last-superadmin checks exist for disable/role removal, not universal race-proof protection. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="832" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — غیرفعال‌سازی</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری؛ پروفایل غیرفعال</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و نشست‌ها باطل می‌شوند؛</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آخرین مدیرکل محافظت دارد.</text><rect x="16" y="380" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر نقش، دامنه یا بازیابی</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید ممکن است نشست‌ها را</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل کند؛ دامنهٔ خالی</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌تواند دسترسی سراسری بدهد.</text><rect x="16" y="532" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="612" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="682" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال‌سازی</text><text x="288" y="752" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="780" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
