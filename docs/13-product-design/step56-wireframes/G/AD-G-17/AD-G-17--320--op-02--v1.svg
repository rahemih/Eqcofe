<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1066" viewBox="0 0 320 1066" role="img" aria-labelledby="title desc"><title id="title">AD-G-17 مشاهده — کارکنان، دامنه و بازیابی کلید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Staff create enrollment24h, recovery30min revokes credentials/sessions. Staff PATCH name/code only; role/scope replacement not additive, matching If-Match, no idempotency. Empty scope per type means global in ScopePolicy. Last-superadmin checks exist for disable/role removal, not universal race-proof protection. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1066" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — کارکنان، دامنه و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازیابی کلید</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر نقش، دامنه یا بازیابی</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید ممکن است نشست‌ها را</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل کند؛ دامنهٔ خالی</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌تواند دسترسی سراسری بدهد.</text><rect x="16" y="340" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت —</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پاسخ مجاز</text><rect x="16" y="436" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو یا فیلتر تنها در</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محدودهٔ پشتیبانی‌شده؛ بدون</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شمارش ساختگی.</text><rect x="16" y="560" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ کارمند، نام، وضعیت</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پروفایل و نسخه</text><rect x="16" y="656" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نقش‌ها و دامنه‌ها با دسترسی</text><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مستقل؛ خالی یعنی سراسری همان</text><text x="288" y="742" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع</text><rect x="16" y="780" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="810" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رمز عبور، هش و رمز</text><text x="288" y="838" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">راه‌اندازی در فهرست یا</text><text x="288" y="866" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تاریخچه نشان داده نشوند.</text><rect x="16" y="916" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="946" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="986" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1014" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
