<svg xmlns="http://www.w3.org/2000/svg" width="320" height="886" viewBox="0 0 320 886" role="img" aria-labelledby="title desc"><title id="title">AD-G-17 نتیجهٔ راه‌اندازی کلید — محرمانه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Staff create enrollment24h, recovery30min revokes credentials/sessions. Staff PATCH name/code only; role/scope replacement not additive, matching If-Match, no idempotency. Empty scope per type means global in ScopePolicy. Last-superadmin checks exist for disable/role removal, not universal race-proof protection. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="886" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ راه‌اندازی کلید —</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محرمانه</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پس از پاسخ موفق و برای</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کارمند تأییدشده</text><rect x="16" y="284" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگاه رمز راه‌اندازی — هیچ</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار واقعی در این طرح نیست</text><rect x="16" y="380" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مهلت: ۳۰ دقیقه</text><rect x="16" y="448" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در فهرست، تاریخچه، گزارش،</text><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشانی صفحه یا ذخیرهٔ مرورگر</text><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نگهداری نشود؛ ارسال خودکار</text><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ندارد.</text><rect x="16" y="600" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در نتیجهٔ نامعلوم، رمز تازه</text><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا موفقیت ساختگی نمایش</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ندهید؛ بررسی دستی لازم است.</text><rect x="16" y="736" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بستن نمایش محرمانه</text><text x="288" y="806" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="834" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
