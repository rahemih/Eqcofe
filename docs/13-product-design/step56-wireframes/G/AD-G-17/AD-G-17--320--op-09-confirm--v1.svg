<svg xmlns="http://www.w3.org/2000/svg" width="320" height="888" viewBox="0 0 320 888" role="img" aria-labelledby="title desc"><title id="title">AD-G-17 مرور نهایی — جایگزینی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Staff create enrollment24h, recovery30min revokes credentials/sessions. Staff PATCH name/code only; role/scope replacement not additive, matching If-Match, no idempotency. Empty scope per type means global in ScopePolicy. Last-superadmin checks exist for disable/role removal, not universal race-proof protection. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="888" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — جایگزینی</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری؛ جایگزینی نشست‌ها</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را باطل می‌کند. خالی‌بودن یک</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع دامنه به معنی دسترسی</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سراسری آن نوع است، نه</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بی‌دسترسی.</text><rect x="16" y="436" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر نقش، دامنه یا بازیابی</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید ممکن است نشست‌ها را</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل کند؛ دامنهٔ خالی</text><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌تواند دسترسی سراسری بدهد.</text><rect x="16" y="588" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="668" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="738" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگزینی</text><text x="288" y="808" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="836" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
