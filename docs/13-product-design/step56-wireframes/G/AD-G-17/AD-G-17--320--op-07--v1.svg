<svg xmlns="http://www.w3.org/2000/svg" width="320" height="848" viewBox="0 0 320 848" role="img" aria-labelledby="title desc"><title id="title">AD-G-17 بازیابی کلید — کارکنان، دامنه و بازیابی کلید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Staff create enrollment24h, recovery30min revokes credentials/sessions. Staff PATCH name/code only; role/scope replacement not additive, matching If-Match, no idempotency. Empty scope per type means global in ScopePolicy. Last-superadmin checks exist for disable/role removal, not universal race-proof protection. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="848" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازیابی کلید — کارکنان،</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه و بازیابی کلید</text><rect x="16" y="188" width="288" height="192" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری؛ تمام کلیدها و</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشست‌های قبلی باطل می‌شوند.</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رمز راه‌اندازی جدید ۳۰ دقیقه</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعتبار دارد؛ فقط پس از پاسخ</text><text x="288" y="330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موفق و بدون ذخیرهٔ عمومی</text><text x="288" y="358" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش یابد.</text><rect x="16" y="396" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر نقش، دامنه یا بازیابی</text><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید ممکن است نشست‌ها را</text><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل کند؛ دامنهٔ خالی</text><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌تواند دسترسی سراسری بدهد.</text><rect x="16" y="548" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="628" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="698" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="728" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازیابی کلید</text><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="796" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
