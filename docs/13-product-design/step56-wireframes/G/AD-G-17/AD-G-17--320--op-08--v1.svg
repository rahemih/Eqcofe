<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1042" viewBox="0 0 320 1042" role="img" aria-labelledby="title desc"><title id="title">AD-G-17 جایگزینی — کارکنان، دامنه و بازیابی کلید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Staff create enrollment24h, recovery30min revokes credentials/sessions. Staff PATCH name/code only; role/scope replacement not additive, matching If-Match, no idempotency. Empty scope per type means global in ScopePolicy. Last-superadmin checks exist for disable/role removal, not universal race-proof protection. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1042" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگزینی — کارکنان، دامنه و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازیابی کلید</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نقش‌های فعال — مجموعهٔ کامل</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگزین</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل — اختیاری</text><rect x="16" y="416" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="480" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری؛ جایگزینی کامل</text><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است و نشست‌ها باطل می‌شوند.</text><text x="288" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حذف نقش آخرین مدیرکل محافظت</text><text x="288" y="594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دارد؛ تضمین همزمانی سراسری</text><text x="288" y="622" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ادعا نمی‌شود.</text><rect x="16" y="660" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="690" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر نقش، دامنه یا بازیابی</text><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید ممکن است نشست‌ها را</text><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل کند؛ دامنهٔ خالی</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌تواند دسترسی سراسری بدهد.</text><rect x="16" y="812" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="842" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="892" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="922" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
