<svg xmlns="http://www.w3.org/2000/svg" width="320" height="804" viewBox="0 0 320 804" role="img" aria-labelledby="title desc"><title id="title">AD-G-02 مرور نهایی — برگشت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. 2..500 one-sided positive debit/credit lines with equal safe-integer totals, active postable accounts; occurred_at&lt;=now+5min. Post draft only with reason; reverse posted once via compensating posted entry. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="804" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — برگشت</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط ثبت‌شده و بدون برگشت</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قبلی؛ سند جبرانی جدید ساخته</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌شود، اصل حذف نمی‌شود.</text><rect x="16" y="380" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نویس، ثبت قطعی و سند</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برگشت جدا هستند؛ سند ثبت‌شده</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حذف نمی‌شود.</text><rect x="16" y="504" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="584" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="654" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برگشت</text><text x="288" y="724" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="752" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
