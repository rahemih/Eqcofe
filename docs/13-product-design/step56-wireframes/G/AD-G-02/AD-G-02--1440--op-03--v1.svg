<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1222" viewBox="0 0 1440 1222" role="img" aria-labelledby="title desc"><title id="title">AD-G-02 ایجاد — دفتر و ثبت و برگشت سند 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. 2..500 one-sided positive debit/credit lines with equal safe-integer totals, active postable accounts; occurred_at&lt;=now+5min. Post draft only with reason; reverse posted once via compensating posted entry. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="1222" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — دفتر و ثبت و برگشت سند</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شرح سند — حداکثر ۱۰۰۰ نویسه</text><rect x="32" y="228" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="292" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان وقوع</text><rect x="32" y="360" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="424" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ردیف حساب، بدهکار یا بستانکار — تومان صحیح</text><rect x="32" y="492" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="556" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شرح اختیاری هر ردیف</text><rect x="32" y="624" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="688" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع و شناسهٔ منبع — اختیاری</text><rect x="32" y="756" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="820" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ رویداد منبع — اختیاری</text><rect x="32" y="888" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="952" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="982" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۲ تا ۵۰۰ ردیف؛ هر ردیف فقط یک سمت مثبت؛ جمع دو سمت برابر و حساب‌ها فعال و قابل ثبت باشند. زمان حداکثر پنج دقیقه آینده.</text><rect x="32" y="1020" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="1050" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نویس، ثبت قطعی و سند برگشت جدا هستند؛ سند ثبت‌شده حذف نمی‌شود.</text><rect x="32" y="1100" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="1130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="1152" y="1170" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
