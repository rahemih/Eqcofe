<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1474" viewBox="0 0 320 1474" role="img" aria-labelledby="title desc"><title id="title">AD-G-02 ایجاد — دفتر و ثبت و برگشت سند 320</title><desc id="desc">Persian RTL low-fidelity design evidence. 2..500 one-sided positive debit/credit lines with equal safe-integer totals, active postable accounts; occurred_at&lt;=now+5min. Post draft only with reason; reverse posted once via compensating posted entry. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1474" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — دفتر و ثبت و برگشت</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سند</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شرح سند — حداکثر ۱۰۰۰ نویسه</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان وقوع</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ردیف حساب، بدهکار یا</text><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بستانکار — تومان صحیح</text><rect x="16" y="548" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="612" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شرح اختیاری هر ردیف</text><rect x="16" y="680" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="744" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع و شناسهٔ منبع — اختیاری</text><rect x="16" y="812" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="876" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ رویداد منبع — اختیاری</text><rect x="16" y="944" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1008" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1038" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۲ تا ۵۰۰ ردیف؛ هر ردیف فقط</text><text x="288" y="1066" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یک سمت مثبت؛ جمع دو سمت</text><text x="288" y="1094" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برابر و حساب‌ها فعال و قابل</text><text x="288" y="1122" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت باشند. زمان حداکثر پنج</text><text x="288" y="1150" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دقیقه آینده.</text><rect x="16" y="1188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نویس، ثبت قطعی و سند</text><text x="288" y="1246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برگشت جدا هستند؛ سند ثبت‌شده</text><text x="288" y="1274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حذف نمی‌شود.</text><rect x="16" y="1324" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1354" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1422" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
