<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">AD-G-04 هزینه‌ها و نهایی‌سازی 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Draft cost with nonnegative integer amount and four treatments; item requires order, campaign/order exclusive. Capitalization pair required at finalization. Reverse original finalized once, preserves amount with negative effect sign. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="500" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه‌ها و نهایی‌سازی</text><rect x="24" y="160" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر هزینه با مبلغ آن متفاوت است؛ برگشت یک رکورد مستقل با</text><text x="560" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر معکوس است.</text><rect x="24" y="256" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسترسی و وضعیت هر اقدام مستقل بررسی شود؛ دادهٔ کهنه مشخص</text><text x="560" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باشد.</text><rect x="24" y="364" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="560" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
