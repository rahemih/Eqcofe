<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1898" viewBox="0 0 320 1898" role="img" aria-labelledby="title desc"><title id="title">AD-G-04 ایجاد — هزینه‌ها و نهایی‌سازی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Draft cost with nonnegative integer amount and four treatments; item requires order, campaign/order exclusive. Capitalization pair required at finalization. Reverse original finalized once, preserves amount with negative effect sign. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1898" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — هزینه‌ها و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نهایی‌سازی</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع هزینه</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نحوهٔ اثر: قبل از تقسیم،</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سرمایه‌ای، غیرقابل‌توزیع یا</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعاتی</text><rect x="16" y="444" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="508" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ تومان صحیح نامنفی</text><rect x="16" y="576" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="640" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان وقوع</text><rect x="16" y="708" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="772" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سفارش و قلم — اختیاری</text><rect x="16" y="840" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="904" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کمپین — اختیاری</text><rect x="16" y="972" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1036" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1066" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شرح — اختیاری</text><rect x="16" y="1104" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1168" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1198" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رویداد منبع — اختیاری</text><rect x="16" y="1236" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1300" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع و شناسهٔ مرجع سرمایه‌ای</text><text x="288" y="1358" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">— مشروط</text><rect x="16" y="1396" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1460" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قلم بدون سفارش مجاز نیست؛</text><text x="288" y="1518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سفارش و کمپین همزمان نیستند.</text><text x="288" y="1546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان حداکثر پنج دقیقه آینده؛</text><text x="288" y="1574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرجع سرمایه‌ای زوج است.</text><rect x="16" y="1612" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر هزینه با مبلغ آن متفاوت</text><text x="288" y="1670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ برگشت یک رکورد مستقل با</text><text x="288" y="1698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر معکوس است.</text><rect x="16" y="1748" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1778" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1818" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1846" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
