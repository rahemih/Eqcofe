<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1146" viewBox="0 0 320 1146" role="img" aria-labelledby="title desc"><title id="title">AD-G-04 نهایی‌سازی — هزینه‌ها و نهایی‌سازی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Draft cost with nonnegative integer amount and four treatments; item requires order, campaign/order exclusive. Capitalization pair required at finalization. Reverse original finalized once, preserves amount with negative effect sign. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1146" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نهایی‌سازی — هزینه‌ها و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نهایی‌سازی</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کد دلیل — اختیاری، حداکثر ۸۰</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل — اختیاری، حداکثر ۲۰۰۰</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="444" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="508" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت — اختیاری، حداکثر</text><text x="288" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۴۰۰۰ نویسه</text><rect x="16" y="604" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="668" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پیش‌نویس؛ هزینهٔ</text><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سرمایه‌ای مرجع موجودی</text><text x="288" y="754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌خواهد.</text><rect x="16" y="792" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر هزینه با مبلغ آن متفاوت</text><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ برگشت یک رکورد مستقل با</text><text x="288" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر معکوس است.</text><rect x="16" y="916" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="946" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="996" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="