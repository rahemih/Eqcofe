<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="838" viewBox="0 0 1440 838" role="img" aria-labelledby="title desc"><title id="title">AD-G-08 مشاهده — گزارش و کار خروجی 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. Run is synchronous snapshot saved completed; cancel only queued/running. Export csv/json from completed job, download JSON envelope with content. No requester binding, cache headers or formula neutralization guarantee inferred. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="838" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — گزارش و کار خروجی</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خروجی مالی با خروجی تحلیلی متفاوت است؛ دریافت نیازمند مجوز مستقل و تأیید دوبارهٔ هویت است.</text><rect x="32" y="228" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت — فقط پاسخ مجاز</text><rect x="32" y="296" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو یا فیلتر تنها در محدودهٔ پشتیبانی‌شده؛ بدون شمارش ساختگی.</text><rect x="32" y="364" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت این خروجی تأیید دوبارهٔ هویت و مجوز مستقل می‌خواهد.</text><rect x="32" y="432" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط دریافت صریح کاربر؛ خروجی خودکار باز یا ارسال نشود.</text><rect x="32" y="500" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع گزارش، وضعیت کار، زمان و تعداد ردیف</text><rect x="32" y="568" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="598" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خروجی مالی: پاسخ شامل نام فایل، نوع، قالب و محتواست.</text><rect x="32" y="636" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="666" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالکیت محدود به درخواست‌کننده و ایمنی فرمول CSV تضمین نشده است؛ فایل خودکار باز نشود.</text><rect x="32" y="716" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت خروجی</text><text x="1152" y="786" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
