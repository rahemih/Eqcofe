<svg xmlns="http://www.w3.org/2000/svg" width="320" height="598" viewBox="0 0 320 598" role="img" aria-labelledby="title desc"><title id="title">AD-G-08 پاسخ معتبر دریافت شد 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Run is synchronous snapshot saved completed; cancel only queued/running. Export csv/json from completed job, download JSON envelope with content. No requester binding, cache headers or formula neutralization guarantee inferred. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="598" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پاسخ معتبر دریافت شد</text><rect x="16" y="160" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خروجی مالی با خروجی تحلیلی</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است؛ دریافت نیازمند</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز مستقل و تأیید دوبارهٔ</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هویت است.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجه فقط مطابق پاسخ سرور؛</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت درخواست با تکمیل اثر</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نهایی برابر نیست.</text><rect x="16" y="448" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت به کار</text><text x="288" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
