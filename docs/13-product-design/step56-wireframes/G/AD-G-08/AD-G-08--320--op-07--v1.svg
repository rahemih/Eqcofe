<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1222" viewBox="0 0 320 1222" role="img" aria-labelledby="title desc"><title id="title">AD-G-08 ایجاد — گزارش و کار خروجی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Run is synchronous snapshot saved completed; cancel only queued/running. Export csv/json from completed job, download JSON envelope with content. No requester binding, cache headers or formula neutralization guarantee inferred. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1222" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — گزارش و کار خروجی</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گزارش از فهرست مجاز</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از تاریخ — اختیاری</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تا تاریخ — اختیاری</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ردیف — تا ۱۰۰۰</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از تاریخ بعد از تا تاریخ</text><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نباشد؛ محاسبه در همین</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست انجام و نتیجه ثبت</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌شود، صف تضمین‌شده نیست.</text><rect x="16" y="840" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="870" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خروجی مالی با خروجی تحلیلی</text><text x="288" y="898" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است؛ دریافت نیازمند</text><text x="288" y="926" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز مستقل و تأیید دوبارهٔ</text><text x="288" y="954" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هویت است.</text><rect x="16" y="992" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1022" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="1072" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1102" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1142" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1170" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
