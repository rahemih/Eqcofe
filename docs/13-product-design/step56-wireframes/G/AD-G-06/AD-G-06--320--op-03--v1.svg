<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1766" viewBox="0 0 320 1766" role="img" aria-labelledby="title desc"><title id="title">AD-G-06 ویرایش — قواعد تقسیم سود 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Four-decimal percentage units sum exactly100; global/category/brand/product scope, priority and ordered effective interval. Full input draft-only update; active expiration; split signed integer Toman conserves total. Preview remains frozen NO_ACTION. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1766" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش — قواعد تقسیم سود</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه: سراسری، دسته، برند یا</text><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محصول</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ دامنه — غیرسراسری</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اولویت صحیح</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درصد مالک فیزیکی — تا چهار</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعشار</text><rect x="16" y="812" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="876" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درصد مالک آنلاین — تا چهار</text><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعشار</text><rect x="16" y="972" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1036" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1066" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع اعتبار</text><rect x="16" y="1104" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1168" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1198" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پایان اعتبار — اختیاری</text><rect x="16" y="1236" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1300" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ورودی کامل؛ جمع درصدها</text><text x="288" y="1358" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دقیقاً صد؛ دامنهٔ سراسری</text><text x="288" y="1386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه ندارد. پایان پس از</text><text x="288" y="1414" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع؛ ویرایش فقط پیش‌نویس.</text><rect x="16" y="1452" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جمع درصد دو مالک دقیقاً صد</text><text x="288" y="1510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ پیش‌نمایش این سطح</text><text x="288" y="1538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">به‌علت محدودیت قرارداد</text><text x="288" y="1566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال می‌ماند.</text><rect x="16" y="1616" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
