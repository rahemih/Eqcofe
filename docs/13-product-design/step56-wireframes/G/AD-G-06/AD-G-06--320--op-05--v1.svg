<svg xmlns="http://www.w3.org/2000/svg" width="320" height="882" viewBox="0 0 320 882" role="img" aria-labelledby="title desc"><title id="title">AD-G-06 فعال‌سازی نسخه — قواعد تقسیم سود 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Four-decimal percentage units sum exactly100; global/category/brand/product scope, priority and ordered effective interval. Full input draft-only update; active expiration; split signed integer Toman conserves total. Preview remains frozen NO_ACTION. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="882" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال‌سازی نسخه — قواعد تقسیم</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سود</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل — الزامی، حداکثر ۲۰۰۰</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پیش‌نویس؛ اثر بر تقسیم</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سود آینده مرور شود؛</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش قراردادی اینجا</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال است.</text><rect x="16" y="500" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جمع درصد دو مالک دقیقاً صد</text><text x="288" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ پیش‌نمایش این سطح</text><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">به‌علت محدودیت قرارداد</text><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال می‌ماند.</text><rect x="16" y="652" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="682" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="732" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="762" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="830" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
