<svg xmlns="http://www.w3.org/2000/svg" width="320" height="886" viewBox="0 0 320 886" role="img" aria-labelledby="title desc"><title id="title">AD-G-07 مشاهده — توزیع سود 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Distributions read-only with signed reversal evidence; no settlement or payout command. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="886" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — توزیع سود</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تقسیم و برگشت سود فقط</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خواندنی‌اند؛ این سطح پرداخت</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وجه ندارد.</text><rect x="16" y="284" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت —</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پاسخ مجاز</text><rect x="16" y="380" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو یا فیلتر تنها در</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محدودهٔ پشتیبانی‌شده؛ بدون</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شمارش ساختگی.</text><rect x="16" y="504" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ سود قطعی و تقسیم</text><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وابسته</text><rect x="16" y="600" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ و سهم با علامت؛ پیوند</text><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">به برگشت جبرانی؛ بدون پرداخت</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وجه</text><rect x="16" y="736" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="806" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="834" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
