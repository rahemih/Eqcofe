<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1314" viewBox="0 0 320 1314" role="img" aria-labelledby="title desc"><title id="title">AD-G-11 ایجاد — قواعد مالیات 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Basis points0..10000 integer. Draft-only PATCH; activate draft with matching version and same-scope interval exclusion; expire active. Scope immutable on PATCH. All three need If-Match, no idempotency decorator invented. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1314" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — قواعد مالیات</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی — حداقل ۲ نویسه</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نرخ — عدد صحیح ۰ تا ۱۰۰۰۰</text><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">صدم درصد</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه: سراسری، برند، دسته یا</text><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محصول</text><rect x="16" y="548" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="612" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ دامنه — غیرسراسری</text><rect x="16" y="680" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="744" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع و پایان — اختیاری</text><rect x="16" y="812" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="876" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نویس؛ دامنهٔ سراسری</text><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه ندارد. نرخ با تومان</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اشتباه نشود.</text><rect x="16" y="1000" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1030" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نرخ بر حسب صدم درصد است؛</text><text x="288" y="1058" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری و نبود همپوشانی</text><text x="288" y="1086" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هنگام فعال‌سازی بررسی</text><text x="288" y="1114" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌شود.</text><rect x="16" y="1164" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1234" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1262" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
