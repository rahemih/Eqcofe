<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1038" viewBox="0 0 320 1038" role="img" aria-labelledby="title desc"><title id="title">AD-G-05 مشاهده — سود سفارش و تاریخچهٔ محاسبه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Finalization needs fresh provisional fingerprint, settled payment/refunds and no draft cost; existing final replays. Rules must resolve unambiguously to one rule for all items. Reversal compensates distribution; not money movement. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1038" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — سود سفارش و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تاریخچهٔ محاسبه</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محاسبهٔ موقت، سود قطعی و</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تقسیم سود جدا هستند؛ دادهٔ</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قدیمی ابتدا باز‌محاسبه</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌خواهد.</text><rect x="16" y="340" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت —</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پاسخ مجاز</text><rect x="16" y="436" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو یا فیلتر تنها در</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محدودهٔ پشتیبانی‌شده؛ بدون</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شمارش ساختگی.</text><rect x="16" y="560" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرحلهٔ محاسبه، زمان و</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثرانگشت دادهٔ مبنا</text><rect x="16" y="656" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ سود با علامت و تقسیم هر</text><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالک — تومان صحیح</text><rect x="16" y="752" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="782" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مانع قطعی‌سازی: دادهٔ کهنه،</text><text x="288" y="810" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت حل‌نشده، هزینهٔ</text><text x="288" y="838" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نویس یا قاعدهٔ مبهم</text><rect x="16" y="888" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="918" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی</text><text x="288" y="958" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="986" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
