<svg xmlns="http://www.w3.org/2000/svg" width="320" height="804" viewBox="0 0 320 804" role="img" aria-labelledby="title desc"><title id="title">AD-G-05 مرور نهایی — محاسبهٔ تازه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Finalization needs fresh provisional fingerprint, settled payment/refunds and no draft cost; existing final replays. Rules must resolve unambiguously to one rule for all items. Reversal compensates distribution; not money movement. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="804" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — محاسبهٔ تازه</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محاسبهٔ تازه ثبت می‌شود؛</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هنوز قطعی نیست.</text><rect x="16" y="352" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محاسبهٔ موقت، سود قطعی و</text><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تقسیم سود جدا هستند؛ دادهٔ</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قدیمی ابتدا باز‌محاسبه</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌خواهد.</text><rect x="16" y="504" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="584" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="654" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">محاسبهٔ تازه</text><text x="288" y="724" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="752" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
