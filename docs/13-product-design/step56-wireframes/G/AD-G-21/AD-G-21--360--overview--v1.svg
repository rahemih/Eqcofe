<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="title desc"><title id="title">AD-G-21 نشست‌ها و قفل و ابطال 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Sessions list active max500; revoke single or staff sessions; staff account lock revokes, unlock does not restore. User-id routes use staffId, not accountId. No If-Match/idempotency or last-superadmin lock protection certified. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="570" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشست‌ها و قفل و ابطال</text><rect x="16" y="160" width="328" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ کارمند با شناسهٔ حساب یا</text><text x="328" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشست متفاوت است؛ قفل حساب و</text><text x="328" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال‌کردن پروفایل یکسان</text><text x="328" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیستند.</text><rect x="16" y="312" width="328" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسترسی و وضعیت هر اقدام مستقل</text><text x="328" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی شود؛ دادهٔ کهنه مشخص باشد.</text><rect x="16" y="420" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="328" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
