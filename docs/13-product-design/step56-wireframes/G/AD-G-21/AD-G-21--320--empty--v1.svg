<svg xmlns="http://www.w3.org/2000/svg" width="320" height="598" viewBox="0 0 320 598" role="img" aria-labelledby="title desc"><title id="title">AD-G-21 موردی در پاسخ فعلی نیست 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Sessions list active max500; revoke single or staff sessions; staff account lock revokes, unlock does not restore. User-id routes use staffId, not accountId. No If-Match/idempotency or last-superadmin lock protection certified. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="598" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موردی در پاسخ فعلی نیست</text><rect x="16" y="160" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ کارمند با شناسهٔ حساب</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا نشست متفاوت است؛ قفل حساب</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و غیرفعال‌کردن پروفایل یکسان</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیستند.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ خالی به معنی نبودن</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تمام داده‌ها نیست؛ دسترسی</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گسترده‌تر درخواست نشود.</text><rect x="16" y="448" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پاک‌کردن فیلتر محلی</text><text x="288" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
