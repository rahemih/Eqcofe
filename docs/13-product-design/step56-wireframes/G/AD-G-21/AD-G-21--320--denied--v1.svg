<svg xmlns="http://www.w3.org/2000/svg" width="320" height="750" viewBox="0 0 320 750" role="img" aria-labelledby="title desc"><title id="title">AD-G-21 دسترسی یا شرایط اقدام فراهم نیست 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Sessions list active max500; revoke single or staff sessions; staff account lock revokes, unlock does not restore. User-id routes use staffId, not accountId. No If-Match/idempotency or last-superadmin lock protection certified. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="750" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسترسی یا شرایط اقدام فراهم</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ کارمند با شناسهٔ حساب</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا نشست متفاوت است؛ قفل حساب</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و غیرفعال‌کردن پروفایل یکسان</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیستند.</text><rect x="16" y="340" width="288" height="136" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق نتیجه از ارائه‌دهنده</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انجام می‌شود؛ بازگشت مرورگر</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا پرداخت دیررس تضمین</text><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آماده‌سازی سفارش نیست.</text><rect x="16" y="492" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خلاصهٔ خطا قابل‌تمرکز و به</text><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلد مرتبط متصل باشد.</text><rect x="16" y="600" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
