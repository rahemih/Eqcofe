<svg xmlns="http://www.w3.org/2000/svg" width="320" height="826" viewBox="0 0 320 826" role="img" aria-labelledby="title desc"><title id="title">AD-G-21 ابطال نشست‌ها — نشست‌ها و قفل و ابطال 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Sessions list active max500; revoke single or staff sessions; staff account lock revokes, unlock does not restore. User-id routes use staffId, not accountId. No If-Match/idempotency or last-superadmin lock protection certified. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="826" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ابطال نشست‌ها — نشست‌ها و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قفل و ابطال</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل — اختیاری</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ کارمند، نه حساب؛ همهٔ</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشست‌های وابسته باطل</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌شوند.</text><rect x="16" y="444" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ کارمند با شناسهٔ حساب</text><text x="288" y="502" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا نشست متفاوت است؛ قفل حساب</text><text x="288" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و غیرفعال‌کردن پروفایل یکسان</text><text x="288" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیستند.</text><rect x="16" y="596" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="626" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="676" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="706" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
