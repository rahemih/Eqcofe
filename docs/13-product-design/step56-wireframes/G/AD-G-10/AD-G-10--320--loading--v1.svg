<svg xmlns="http://www.w3.org/2000/svg" width="320" height="542" viewBox="0 0 320 542" role="img" aria-labelledby="title desc"><title id="title">AD-G-10 در حال دریافت پاسخ 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Nine datasets, csv/json, owner-bound list/get/download; completed only. Idempotency actor/key/payload-bound; same-key failed replay not retry. Serializer allowlists columns, neutralizes CSV formulas,5MiB cap; private no-store download. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="542" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در حال دریافت پاسخ</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط خروجی متعلق به کاربر</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جاری؛ زمان مبنا، تعداد ردیف</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و شناسهٔ فایل حفظ شوند.</text><rect x="16" y="284" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دادهٔ قبلی هنگام بازخوانی با</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشان قدیمی باقی می‌ماند.</text><rect x="16" y="392" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="422" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
