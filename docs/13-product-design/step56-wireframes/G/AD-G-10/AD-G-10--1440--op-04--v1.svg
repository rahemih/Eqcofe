<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1186" viewBox="0 0 1440 1186" role="img" aria-labelledby="title desc"><title id="title">AD-G-10 ایجاد — خروجی تحلیل و دریافت امن 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. Nine datasets, csv/json, owner-bound list/get/download; completed only. Idempotency actor/key/payload-bound; same-key failed replay not retry. Serializer allowlists columns, neutralizes CSV formulas,5MiB cap; private no-store download. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="1186" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — خروجی تحلیل و دریافت امن</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دادهٔ مجاز از فهرست نه‌گانه</text><rect x="32" y="228" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="292" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قالب CSV یا JSON</text><rect x="32" y="360" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="424" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از تاریخ و تا تاریخ — متناسب با داده</text><rect x="32" y="492" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="556" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان مبنای بررسی — برای عملیات</text><rect x="32" y="624" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="688" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ردیف — ۱ تا ۵۰۰</text><rect x="32" y="756" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="820" width="1136" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خروجی به کاربر جاری تعلق دارد؛ دورهٔ عملیات از ≤ تا ≤ زمان مبنا. تکرار همان کلید، همان درخواست است و کار ناموفق را دوباره</text><text x="1152" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اجرا نمی‌کند.</text><rect x="32" y="916" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="946" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط خروجی متعلق به کاربر جاری؛ زمان مبنا، تعداد ردیف و شناسهٔ فایل حفظ شوند.</text><rect x="32" y="984" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="1014" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="32" y="1064" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="1094" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="1152" y="1134" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
