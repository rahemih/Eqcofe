<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1466" viewBox="0 0 320 1466" role="img" aria-labelledby="title desc"><title id="title">AD-G-10 ایجاد — خروجی تحلیل و دریافت امن 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Nine datasets, csv/json, owner-bound list/get/download; completed only. Idempotency actor/key/payload-bound; same-key failed replay not retry. Serializer allowlists columns, neutralizes CSV formulas,5MiB cap; private no-store download. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1466" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — خروجی تحلیل و دریافت</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امن</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دادهٔ مجاز از فهرست نه‌گانه</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قالب CSV یا JSON</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از تاریخ و تا تاریخ — متناسب</text><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">با داده</text><rect x="16" y="548" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="612" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان مبنای بررسی — برای</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عملیات</text><rect x="16" y="708" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="772" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ردیف — ۱ تا ۵۰۰</text><rect x="16" y="840" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="904" width="288" height="192" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خروجی به کاربر جاری تعلق</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دارد؛ دورهٔ عملیات از ≤ تا ≤</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان مبنا. تکرار همان کلید،</text><text x="288" y="1018" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">همان درخواست است و کار</text><text x="288" y="1046" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ناموفق را دوباره اجرا</text><text x="288" y="1074" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌کند.</text><rect x="16" y="1112" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1142" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط خروجی متعلق به کاربر</text><text x="288" y="1170" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جاری؛ زمان مبنا، تعداد ردیف</text><text x="288" y="1198" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و شناسهٔ فایل حفظ شوند.</text><rect x="16" y="1236" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1266" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="1316" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1346" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1414" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
