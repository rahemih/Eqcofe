<svg xmlns="http://www.w3.org/2000/svg" width="320" height="764" viewBox="0 0 320 764" role="img" aria-labelledby="title desc"><title id="title">AD-G-14 مرور نهایی — ایجاد 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create boolean/variant with key/name/default/risk; PATCH metadata only. Preview target ids not persisted; rollout0..100, enable, disable, emergency disable to0, retire terminal. No version header or universal Step-Up on disable/emergency. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="764" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — ایجاد</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد فراداده؛ مجوز و</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات جاری همچنان</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعیین‌کننده‌اند.</text><rect x="16" y="380" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش مخاطبان به معنی</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ذخیرهٔ هدف‌گیری نیست؛</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خاموش‌کردن اضطراری درصد را</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">صفر می‌کند.</text><rect x="16" y="544" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="614" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="644" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
