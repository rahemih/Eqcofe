<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1022" viewBox="0 0 320 1022" role="img" aria-labelledby="title desc"><title id="title">AD-G-14 ویرایش — پرچم قابلیت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create boolean/variant with key/name/default/risk; PATCH metadata only. Preview target ids not persisted; rollout0..100, enable, disable, emergency disable to0, retire terminal. No version header or universal Step-Up on disable/emergency. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1022" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش — پرچم قابلیت</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گونهٔ پیش‌فرض</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سطح ریسک</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط فرادادهٔ نسخهٔ</text><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازنشسته‌نشده؛ این مسیر درصد</text><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا هدف‌گیری را تغییر</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌دهد.</text><rect x="16" y="708" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="738" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش مخاطبان به معنی</text><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ذخیرهٔ هدف‌گیری نیست؛</text><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خاموش‌کردن اضطراری درصد را</text><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">صفر می‌کند.</text><rect x="16" y="872" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="902" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="942" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="970" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
