<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1342" viewBox="0 0 320 1342" role="img" aria-labelledby="title desc"><title id="title">AD-G-14 ایجاد — پرچم قابلیت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create boolean/variant with key/name/default/risk; PATCH metadata only. Preview target ids not persisted; rollout0..100, enable, disable, emergency disable to0, retire terminal. No version header or universal Step-Up on disable/emergency. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1342" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — پرچم قابلیت</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید لاتین — حداکثر ۱۵۰</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی — حداکثر ۲۰۰ نویسه</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع درست‌ونادرست یا گونه</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گونهٔ پیش‌فرض — حداکثر ۱۰۰</text><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه</text><rect x="16" y="680" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="744" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ریسک کم، متوسط، زیاد یا</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بحرانی</text><rect x="16" y="840" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="904" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد فراداده؛ مجوز و</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات جاری همچنان</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعیین‌کننده‌اند.</text><rect x="16" y="1028" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1058" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش مخاطبان به معنی</text><text x="288" y="1086" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ذخیرهٔ