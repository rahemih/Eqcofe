<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1050" viewBox="0 0 320 1050" role="img" aria-labelledby="title desc"><title id="title">AD-G-12 ویرایش — تنظیمات، پیش‌نمایش و بازگردانی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Registry typed values; direct PATCH low-risk/global only, but no current low-risk key. Preview advisory. Rollback takes history[0]/[1] across key, not chosen version or scoped history. No client expected version or scheduling guarantee. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1050" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش — تنظیمات، پیش‌نمایش</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و بازگردانی</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار متناسب با نوع کلید</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل الزامی</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع اثر — اختیاری</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط تنظیم کم‌ریسک و سراسری؛</text><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در فهرست کنونی کلید واجد</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شرایط نیست، این ثبت غیرفعال</text><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بماند.</text><rect x="16" y="736" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیم فقط از کلیدهای</text><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت‌شده؛ پیش‌نمایش توکن</text><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال نیست و بازگردانی</text><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب آزاد نسخه ندارد.</text><rect x="16" y="900" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="930" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت در حال حاضر غیرفعال</text><text x="288" y="970" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="998" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
