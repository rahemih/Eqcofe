<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1286" viewBox="0 0 320 1286" role="img" aria-labelledby="title desc"><title id="title">AD-G-12 ایجاد — تنظیمات، پیش‌نمایش و بازگردانی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Registry typed values; direct PATCH low-risk/global only, but no current low-risk key. Preview advisory. Rollback takes history[0]/[1] across key, not chosen version or scoped history. No client expected version or scheduling guarantee. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1286" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — تنظیمات، پیش‌نمایش و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگردانی</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار پیشنهادی</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل الزامی</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع دامنه</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ دامنه — غیرسراسری</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع اثر — اختیاری</text><rect x="16" y="784" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="848" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کلید باید دامنه‌پذیر باشد؛</text><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست ثبت می‌شود و هنوز</text><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال نشده است.</text><rect x="16" y="972" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1002" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیم فقط از کلیدهای</text><text x="288" y="1030" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت‌شده؛ پیش‌نمایش توکن</text><text x="288" y="1058" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال نیست و بازگردانی</text><text x="288" y="1086" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب آزاد نسخه ندارد.</text><rect x="16" y="1136" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1166" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1206" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1234" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
