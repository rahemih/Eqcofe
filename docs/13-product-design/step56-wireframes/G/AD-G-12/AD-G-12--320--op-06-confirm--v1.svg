<svg xmlns="http://www.w3.org/2000/svg" width="320" height="916" viewBox="0 0 320 916" role="img" aria-labelledby="title desc"><title id="title">AD-G-12 مرور نهایی — بازگردانی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Registry typed values; direct PATCH low-risk/global only, but no current low-risk key. Preview advisory. Rollback takes history[0]/[1] across key, not chosen version or scoped history. No client expected version or scheduling guarantee. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="916" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — بازگردانی</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="192" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دو رکورد نخست تاریخچهٔ کلید</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبنا هستند؛ انتخاب نسخهٔ</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلخواه یا تاریخچهٔ محدود به</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یک دامنه تضمین نشده است.</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه‌ها را پیش از اقدام</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور کنید.</text><rect x="16" y="464" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیم فقط از کلیدهای</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت‌شده؛ پیش‌نمایش توکن</text><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال نیست و بازگردانی</text><text x="288" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب آزاد نسخه ندارد.</text><rect x="16" y="616" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="696" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="766" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="796" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگردانی</text><text x="288" y="836" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="864" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
