<svg xmlns="http://www.w3.org/2000/svg" width="320" height="792" viewBox="0 0 320 792" role="img" aria-labelledby="title desc"><title id="title">AD-G-12 مرور نهایی — ویرایش 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Registry typed values; direct PATCH low-risk/global only, but no current low-risk key. Preview advisory. Rollback takes history[0]/[1] across key, not chosen version or scoped history. No client expected version or scheduling guarantee. All actions retain frozen operation authority; no additional runtime or security guarantee is introduced. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="792" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — ویرایش</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر و پیامد اقدام</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="256" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط تنظیم کم‌ریسک و سراسری؛</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در فهرست کنونی کلید واجد</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شرایط نیست، این ثبت غیرفعال</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بماند.</text><rect x="16" y="408" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیم فقط از کلیدهای</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت‌شده؛ پیش‌نمایش توکن</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال نیست و بازگردانی</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب آزاد نسخه ندارد.</text><rect x="16" y="572" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="602" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="642" width="288" height="48" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="672" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت در حال حاضر غیرفعال</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
