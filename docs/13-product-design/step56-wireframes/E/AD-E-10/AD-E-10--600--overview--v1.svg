<svg xmlns="http://www.w3.org/2000/svg" width="600" height="734" viewBox="0 0 600 734" role="img" aria-labelledby="title desc"><title id="title">AD-E-10 اسکن و فروش حضوری 600</title><desc id="desc">Persian RTL low-fidelity design evidence. POS sale authority is limited to canonical scan, create-sale, add-line, price and commit operations. The server owns pricing, stock, totals and lifecycle; idempotency is preserved for mutations and expected_version on commit is a body guard rather than If-Match. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="734" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اسکن و فروش حضوری</text><rect x="24" y="160" width="552" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر محلیِ موارد نمایش‌داده‌شده</text><rect x="24" y="224" width="552" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="254" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="560" y="282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="560" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="24" y="380" width="552" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="560" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="560" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="24" y="536" width="552" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><rect x="24" y="612" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی دادهٔ مجاز</text><text x="560" y="682" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
