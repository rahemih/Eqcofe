<svg xmlns="http://www.w3.org/2000/svg" width="320" height="514" viewBox="0 0 320 514" role="img" aria-labelledby="title desc"><title id="title">AD-E-10 دسترسی یا scope کافی نیست 320</title><desc id="desc">Persian RTL low-fidelity design evidence. POS sale authority is limited to canonical scan, create-sale, add-line, price and commit operations. The server owns pricing, stock, totals and lifecycle; idempotency is preserved for mutations and expected_version on commit is a body guard rather than If-Match. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="514" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسترسی یا scope کافی نیست</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسترسی یا scope کافی نیست</text><rect x="16" y="228" width="288" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عملیات متوقف است و هیچ</text><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">authority محلی جایگزین</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">permission سرور نمی‌شود.</text><rect x="16" y="364" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی امن</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
