<svg xmlns="http://www.w3.org/2000/svg" width="320" height="542" viewBox="0 0 320 542" role="img" aria-labelledby="title desc"><title id="title">AD-E-10 پاسخ معتبر سرور دریافت شد 320</title><desc id="desc">Persian RTL low-fidelity design evidence. POS sale authority is limited to canonical scan, create-sale, add-line, price and commit operations. The server owns pricing, stock, totals and lifecycle; idempotency is preserved for mutations and expected_version on commit is a body guard rather than If-Match. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="542" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پاسخ معتبر سرور دریافت شد</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پاسخ معتبر سرور دریافت شد</text><rect x="16" y="228" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موفقیت فقط از پاسخ</text><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">authoritative اعلام می‌شود و</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه‌های مرجع برای پیگیری</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حفظ می‌شوند.</text><rect x="16" y="392" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="422" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت به عملیات</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
