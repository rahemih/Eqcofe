<svg xmlns="http://www.w3.org/2000/svg" width="320" height="726" viewBox="0 0 320 726" role="img" aria-labelledby="title desc"><title id="title">AD-E-10 ثبت نهایی فروش حضوری 320</title><desc id="desc">Persian RTL low-fidelity design evidence. POS sale authority is limited to canonical scan, create-sale, add-line, price and commit operations. The server owns pricing, stock, totals and lifecycle; idempotency is preserved for mutations and expected_version on commit is a body guard rather than If-Match. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="726" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت نهایی فروش حضوری</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">payload فقط از فیلدهای</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">source-proven ساخته می‌شود و</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">server authority حفظ می‌شود.</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از mutation بازبینی صریح</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انجام می‌شود؛ replay فقط طبق</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">idempotency و وضعیت مرجع</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز است.</text><rect x="16" y="500" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="576" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="606" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازبینی عملیات</text><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="674" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
