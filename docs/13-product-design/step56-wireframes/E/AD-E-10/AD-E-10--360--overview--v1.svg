<svg xmlns="http://www.w3.org/2000/svg" width="360" height="598" viewBox="0 0 360 598" role="img" aria-labelledby="title desc"><title id="title">AD-E-10 اسکن و فروش حضوری 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Frozen POS sale operations remain NO_ACTION even where controller exists outside assembled OpenAPI. Runtime commit expected_version is a body field, not If-Match. Cash/card source evidence does not authorize any action. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="598" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اسکن و فروش حضوری</text><rect x="16" y="160" width="328" height="136" rx="4" fill="#eeeeee" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اسکن، قیمت‌گذاری و ثبت فروش</text><text x="328" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حضوری تا تطبیق قرارداد</text><text x="328" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال‌اند؛ ثبت آزمایشی نیز</text><text x="328" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انجام نمی‌شود.</text><rect x="16" y="312" width="328" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="328" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تا تطبیق منابع، خواندن و اقدام</text><text x="328" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز نیست؛ هیچ نتیجهٔ موفقی ادعا</text><text x="328" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌شود.</text><rect x="16" y="448" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="328" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
