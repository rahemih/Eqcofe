<svg xmlns="http://www.w3.org/2000/svg" width="320" height="626" viewBox="0 0 320 626" role="img" aria-labelledby="title desc"><title id="title">AD-E-11 در دسترس نیست — فرمان آفلاین و تطبیق فروش حضوری 320</title><desc id="desc">Persian RTL low-fidelity design evidence. All six offline/reconciliation obligations remain NO_ACTION. Runtime retry only failed and recovery_count&lt;5, requires owner sync; retry is not completed sale. Abandon failed only. Preserve staff ownership, no owner transfer or automatic sync is invented. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="626" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در دسترس نیست — فرمان آفلاین</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و تطبیق فروش حضوری</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فرمان آفلاین و بازیابی فروش</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حضوری آمادهٔ اجرا نیست؛</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">همگام‌سازی یا تکرار خودکار</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نداریم.</text><rect x="16" y="340" width="288" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تا تطبیق منابع، خواندن و</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام مجاز نیست؛ هیچ نتیجهٔ</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موفقی ادعا نمی‌شود.</text><rect x="16" y="476" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="288" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
