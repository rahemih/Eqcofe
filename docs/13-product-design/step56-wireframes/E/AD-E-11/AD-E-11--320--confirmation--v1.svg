<svg xmlns="http://www.w3.org/2000/svg" width="320" height="696" viewBox="0 0 320 696" role="img" aria-labelledby="title desc"><title id="title">AD-E-11 بازبینی نهایی عملیات POS 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Offline POS authority is limited to canonical capture/sync and reconciliation reads/retry/abandon. Retry and abandon preserve server ownership, failed-only recovery, max-five recovery and Step-Up/idempotency requirements; retry is not proof of a completed sale. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="696" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازبینی نهایی عملیات POS</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه، payload، permission و</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر عملیات را پیش از ارسال</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوباره بررسی کنید.</text><rect x="16" y="284" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف امن پیش‌فرض است؛</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">Step-Up فقط در عملیات</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منبع‌اثبات‌شدهٔ</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">reconciliation درخواست</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌شود.</text><rect x="16" y="476" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="546" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="576" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید پس از بازبینی</text><text x="288" y="616" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="644" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
