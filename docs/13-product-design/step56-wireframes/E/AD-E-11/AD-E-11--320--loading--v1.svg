<svg xmlns="http://www.w3.org/2000/svg" width="320" height="598" viewBox="0 0 320 598" role="img" aria-labelledby="title desc"><title id="title">AD-E-11 در حال دریافت پاسخ authoritative 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Offline POS authority is limited to canonical capture/sync and reconciliation reads/retry/abandon. Retry and abandon preserve server ownership, failed-only recovery, max-five recovery and Step-Up/idempotency requirements; retry is not proof of a completed sale. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="598" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در حال دریافت پاسخ</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">authoritative</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در حال دریافت پاسخ</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">authoritative</text><rect x="16" y="284" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنترل‌ها در زمان ارسال</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال می‌مانند و</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوباره‌ارسال همزمان انجام</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌شود.</text><rect x="16" y="448" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی امن</text><text x="288" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
