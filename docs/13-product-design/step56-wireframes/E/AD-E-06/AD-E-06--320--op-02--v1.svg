<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1118" viewBox="0 0 320 1118" role="img" aria-labelledby="title desc"><title id="title">AD-E-06 ویرایش — روش‌های حمل 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create validates lowercase code, Persian name and nonnegative integer Toman fee; active defaults true. PATCH If-Match permits name/fee/active, not code. No delete, Step-Up or idempotency decorator is invented. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1118" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش — روش‌های حمل</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی — حداقل ۲ نویسه</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه — تومان صحیح نامنفی</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال یا غیرفعال</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه به تومان صحیح؛ کد روش</text><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حمل پس از ساخت تغییر</text><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌کند. ویرایش بر پایهٔ</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری است.</text><rect x="16" y="708" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="738" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت در زمان ثبت</text><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوباره بررسی شود.</text><rect x="16" y="804" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="834" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری لازم است؛ تعارض</text><text x="288" y="862" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخه بازخوانی و مرور دوباره</text><text x="288" y="890" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌خواهد. کد قابل ویرایش</text><text x="288" y="918" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="16" y="968" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="998" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1038" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1066" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
