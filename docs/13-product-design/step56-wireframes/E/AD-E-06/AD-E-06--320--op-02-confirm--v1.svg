<svg xmlns="http://www.w3.org/2000/svg" width="320" height="984" viewBox="0 0 320 984" role="img" aria-labelledby="title desc"><title id="title">AD-E-06 مرور نهایی — ویرایش 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create validates lowercase code, Persian name and nonnegative integer Toman fee; active defaults true. PATCH If-Match permits name/fee/active, not code. No delete, Step-Up or idempotency decorator is invented. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="984" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — ویرایش</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر واردشده و</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیامد اقدام را مرور کنید.</text><rect x="16" y="256" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه به تومان صحیح؛ کد روش</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حمل پس از ساخت تغییر</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌کند. ویرایش بر پایهٔ</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری است.</text><rect x="16" y="408" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت جاری بررسی شود.</text><rect x="16" y="476" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اگر نتیجه نامشخص شد، پیش از</text><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار وضعیت معتبر را</text><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بخوانید.</text><rect x="16" y="600" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری لازم است؛ تعارض</text><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخه بازخوانی و مرور دوباره</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌خواهد. کد قابل ویرایش</text><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="16" y="764" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="834" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="864" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش</text><text x="288" y="904" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="932" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
