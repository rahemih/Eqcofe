<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1278" viewBox="0 0 320 1278" role="img" aria-labelledby="title desc"><title id="title">AD-E-06 ایجاد — روش‌های حمل 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create validates lowercase code, Persian name and nonnegative integer Toman fee; active defaults true. PATCH If-Match permits name/fee/active, not code. No delete, Step-Up or idempotency decorator is invented. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1278" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — روش‌های حمل</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کد روش حمل — حروف کوچک، رقم،</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خط تیره یا زیرخط</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی — حداقل ۲ نویسه</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه — تومان صحیح نامنفی</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فعال یا غیرفعال</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه به تومان صحیح؛ کد روش</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حمل پس از ساخت تغییر</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌کند. ویرایش بر پایهٔ</text><text x="288" y="830" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ جاری است.</text><rect x="16" y="868" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="898" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت در زمان ثبت</text><text x="288" y="926" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوباره بررسی شود.</text><rect x="16" y="964" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="994" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کد ۲ تا ۵۰ نویسه؛ نام فارسی</text><text x="288" y="1022" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداقل ۲ نویسه؛ هزینه صحیح</text><text x="288" y="1050" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نامنفی و فعال به‌صورت</text><text x="288" y="1078" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌فرض.</text><rect x="16" y="1128" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1158" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1198" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1226" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
