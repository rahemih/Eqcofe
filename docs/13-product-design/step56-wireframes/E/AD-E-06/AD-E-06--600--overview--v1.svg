<svg xmlns="http://www.w3.org/2000/svg" width="600" height="554" viewBox="0 0 600 554" role="img" aria-labelledby="title desc"><title id="title">AD-E-06 روش‌های حمل 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Create validates lowercase code, Persian name and nonnegative integer Toman fee; active defaults true. PATCH If-Match permits name/fee/active, not code. No delete, Step-Up or idempotency decorator is invented. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="554" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">روش‌های حمل</text><rect x="24" y="160" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه به تومان صحیح؛ کد روش حمل پس از ساخت تغییر نمی‌کند.</text><text x="560" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش بر پایهٔ نسخهٔ جاری است.</text><rect x="24" y="256" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات فقط از پاسخ مجاز؛ شمارش خارج از دسترسی نمایش داده</text><text x="560" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشود.</text><rect x="24" y="352" width="552" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت پاسخ کنار هم دیده شوند.</text><rect x="24" y="432" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="560" y="502" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
