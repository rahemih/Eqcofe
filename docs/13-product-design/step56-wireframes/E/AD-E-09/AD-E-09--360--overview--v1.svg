<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="title desc"><title id="title">AD-E-09 فروشگاه، صندوق و شیفت حضوری 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Frozen shift/store/register operations have unresolved assembled-contract/runtime evidence. Preserve all seven NO_ACTION dispositions and do not infer an executable shift lifecycle. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="570" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروشگاه، صندوق و شیفت حضوری</text><rect x="16" y="160" width="328" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروشگاه، صندوق و شیفت در این</text><text x="328" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرحله آمادهٔ اجرا نیستند؛ شروع</text><text x="328" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا بستن شیفت غیرفعال است.</text><rect x="16" y="284" width="328" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="328" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تا تطبیق منابع، خواندن و اقدام</text><text x="328" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز نیست؛ هیچ نتیجهٔ موفقی ادعا</text><text x="328" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌شود.</text><rect x="16" y="420" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="328" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
