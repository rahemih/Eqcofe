<svg xmlns="http://www.w3.org/2000/svg" width="320" height="764" viewBox="0 0 320 764" role="img" aria-labelledby="title desc"><title id="title">AD-E-02 تطبیق نتیجه — پرداخت، تلاش‌ها و تطبیق نتیجه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Payment reconcile requires Step-Up and payment.reconcile idempotency. Provider lease is two minutes; amount mismatch/reference conflict needs manual review. No manual mark-paid action. Payment list default50/max200; attempts are read-only. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="764" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق نتیجه — پرداخت،</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تلاش‌ها و تطبیق نتیجه</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق نتیجه از ارائه‌دهنده</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انجام می‌شود؛ بازگشت مرورگر</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا پرداخت دیررس تضمین</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آماده‌سازی سفارش نیست.</text><rect x="16" y="340" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="408" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مغایرت مبلغ یا مرجع نیازمند</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی دستی است؛ وضعیت پرداخت</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را دستی موفق نکنید.</text><rect x="16" y="544" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="614" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="644" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق نتیجه</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
