<svg xmlns="http://www.w3.org/2000/svg" width="320" height="514" viewBox="0 0 320 514" role="img" aria-labelledby="title desc"><title id="title">AD-E-02 در حال دریافت پاسخ 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Payment reconcile requires Step-Up and payment.reconcile idempotency. Provider lease is two minutes; amount mismatch/reference conflict needs manual review. No manual mark-paid action. Payment list default50/max200; attempts are read-only. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="514" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در حال دریافت پاسخ</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تمرکز حفظ شود؛ ثبت دوباره تا</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت نتیجه غیرفعال است.</text><rect x="16" y="256" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دادهٔ قبلی هنگام بازخوانی با</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشان قدیمی باقی می‌ماند.</text><rect x="16" y="364" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
