<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AD-E-02 پرداخت، تلاش‌ها و تطبیق نتیجه 1200</title><desc id="desc">Persian RTL low-fidelity design evidence. Payment reconcile requires Step-Up and payment.reconcile idempotency. Provider lease is two minutes; amount mismatch/reference conflict needs manual review. No manual mark-paid action. Payment list default50/max200; attempts are read-only. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1200" height="700" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1200" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1168" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1168" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="960" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="976" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="976" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="976" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="976" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="976" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="976" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="976" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="976" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="928" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="912" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرداخت، تلاش‌ها و تطبیق نتیجه</text><rect x="32" y="160" width="896" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق نتیجه از ارائه‌دهنده انجام می‌شود؛ بازگشت مرورگر یا پرداخت دیررس تضمین آماده‌سازی سفارش</text><text x="912" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="32" y="256" width="896" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات فقط از پاسخ مجاز؛ شمارش خارج از دسترسی نمایش داده نشود.</text><rect x="32" y="324" width="896" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="354" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت پاسخ کنار هم دیده شوند.</text><rect x="32" y="404" width="896" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="912" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="912" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
