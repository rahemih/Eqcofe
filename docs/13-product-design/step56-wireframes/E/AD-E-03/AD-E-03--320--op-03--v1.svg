<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1202" viewBox="0 0 320 1202" role="img" aria-labelledby="title desc"><title id="title">AD-E-03 ایجاد — درخواست و پردازش بازپرداخت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create requires eligible settled payment, positive integer Toman and reason_code. Cap is checked at create/process. Creator cannot approve own refund. Retry only failed; reconcile processing/unknown; cancel requested/approved/failed only. All refund mutations require Step-Up and scoped idempotency; provider support is not guaranteed. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1202" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — درخواست و پردازش</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ پرداخت</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ بازپرداخت — تومان صحیح</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مثبت</text><rect x="16" y="416" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="480" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل درخواست — الزامی،</text><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۲۰۰ نویسه</text><rect x="16" y="576" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="640" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت نامشخص را تطبیق</text><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دهید؛ تکرار پردازش فقط برای</text><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ناموفق مجاز است. درخواست با</text><text x="288" y="754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرداخت موفق برابر نیست.</text><rect x="16" y="792" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="860" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="890" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرداخت مبنا باید پرداخت‌شده،</text><text x="288" y="918" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دیررس دریافت‌شده یا نیازمند</text><text x="288" y="946" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت باشد؛ سقف قابل</text><text x="288" y="974" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت دوباره بررسی</text><text x="288" y="1002" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌شود.</text><rect x="16" y="1052" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1082" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1122" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1150" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
