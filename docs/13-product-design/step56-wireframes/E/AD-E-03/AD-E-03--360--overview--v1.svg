<svg xmlns="http://www.w3.org/2000/svg" width="360" height="666" viewBox="0 0 360 666" role="img" aria-labelledby="title desc"><title id="title">AD-E-03 درخواست و پردازش بازپرداخت 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Create requires eligible settled payment, positive integer Toman and reason_code. Cap is checked at create/process. Creator cannot approve own refund. Retry only failed; reconcile processing/unknown; cancel requested/approved/failed only. All refund mutations require Step-Up and scoped idempotency; provider support is not guaranteed. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="666" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و پردازش بازپرداخت</text><rect x="16" y="160" width="328" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت نامشخص را تطبیق دهید؛</text><text x="328" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار پردازش فقط برای ناموفق</text><text x="328" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز است. درخواست با پرداخت موفق</text><text x="328" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برابر نیست.</text><rect x="16" y="312" width="328" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات فقط از پاسخ مجاز؛ شمارش</text><text x="328" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">خارج از دسترسی نمایش داده نشود.</text><rect x="16" y="408" width="328" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و زمان دریافت پاسخ</text><text x="328" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنار هم دیده شوند.</text><rect x="16" y="516" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="328" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
