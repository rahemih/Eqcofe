<svg xmlns="http://www.w3.org/2000/svg" width="320" height="902" viewBox="0 0 320 902" role="img" aria-labelledby="title desc"><title id="title">AD-E-03 مشاهده — درخواست و پردازش بازپرداخت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create requires eligible settled payment, positive integer Toman and reason_code. Cap is checked at create/process. Creator cannot approve own refund. Retry only failed; reconcile processing/unknown; cancel requested/approved/failed only. All refund mutations require Step-Up and scoped idempotency; provider support is not guaranteed. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="902" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — درخواست و پردازش</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت</text><rect x="16" y="188" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر محلیِ موارد نمایش‌داده‌شده</text><rect x="16" y="252" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="338" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="408" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="564" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><text x="288" y="628" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت نامشخص را تطبیق</text><text x="288" y="656" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دهید؛ تکرار پردازش فقط برای</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ناموفق مجاز است. درخواست با</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرداخت موفق برابر نیست.</text><rect x="16" y="752" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="782" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی اطلاعات</text><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
