<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="922" viewBox="0 0 1440 922" role="img" aria-labelledby="title desc"><title id="title">AD-E-07 ثبت دریافت — مرجوعی و بازرسی و نتیجه 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. Requested-&gt;under_review-&gt;approved; receive approved/in_transit_to_store requires all items positive after receipt; inspect received; resolve inspecting only with exact unique item coverage and resolution_note. Refund positive integer amount capped by delivered line value, non-refund amount forbidden; stock dispositions require warehouse. Reject needs reason. Resolve requires Step-Up. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="922" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت دریافت — مرجوعی و بازرسی و نتیجه</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان دریافت — اختیاری</text><rect x="32" y="228" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="292" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ قلم مرجوعی و تعداد دریافتی — تمام اقلام</text><rect x="32" y="360" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="424" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت اختیاری</text><rect x="32" y="492" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="556" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت، بازرسی و تعیین نتیجه جدا هستند؛ درخواست بازپرداخت یا جایگزینی به معنی پرداخت یا ارسال نیست.</text><rect x="32" y="624" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="654" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت در زمان ثبت دوباره بررسی شود.</text><rect x="32" y="692" width="1136" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="722" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط تأییدشده یا در مسیر بازگشت؛ پس از دریافت، همهٔ اقلام باید مقدار مثبت داشته باشند. زمان بیش از پنج دقیقه آینده مجاز</text><text x="1152" y="750" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="32" y="800" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="830" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="1152" y="870" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
