<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1202" viewBox="0 0 320 1202" role="img" aria-labelledby="title desc"><title id="title">AD-E-07 ثبت دریافت — مرجوعی و بازرسی و نتیجه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Requested-&gt;under_review-&gt;approved; receive approved/in_transit_to_store requires all items positive after receipt; inspect received; resolve inspecting only with exact unique item coverage and resolution_note. Refund positive integer amount capped by delivered line value, non-refund amount forbidden; stock dispositions require warehouse. Reject needs reason. Resolve requires Step-Up. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1202" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت دریافت — مرجوعی و بازرسی</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و نتیجه</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان دریافت — اختیاری</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ قلم مرجوعی و تعداد</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافتی — تمام اقلام</text><rect x="16" y="416" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="480" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت اختیاری</text><rect x="16" y="548" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="612" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت، بازرسی و تعیین نتیجه</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جدا هستند؛ درخواست بازپرداخت</text><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا جایگزینی به معنی پرداخت</text><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا ارسال نیست.</text><rect x="16" y="764" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت در زمان ثبت</text><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوباره بررسی شود.</text><rect x="16" y="860" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="890" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط تأییدشده یا در مسیر</text><text x="288" y="918" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت؛ پس از دریافت، همهٔ</text><text x="288" y="946" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقلام باید مقدار مثبت داشته</text><text x="288" y="974" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باشند. زمان بیش از پنج دقیقه</text><text x="288" y="1002" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آینده مجاز نیست.</text><rect x="16" y="1052" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1082" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1122" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1150" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
