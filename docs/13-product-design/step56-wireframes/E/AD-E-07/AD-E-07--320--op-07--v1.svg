<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1794" viewBox="0 0 320 1794" role="img" aria-labelledby="title desc"><title id="title">AD-E-07 ثبت نتیجه — مرجوعی و بازرسی و نتیجه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Requested-&gt;under_review-&gt;approved; receive approved/in_transit_to_store requires all items positive after receipt; inspect received; resolve inspecting only with exact unique item coverage and resolution_note. Refund positive integer amount capped by delivered line value, non-refund amount forbidden; stock dispositions require warehouse. Reject needs reason. Resolve requires Step-Up. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1794" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت نتیجه — مرجوعی و بازرسی</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و نتیجه</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت نتیجه — الزامی،</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۴۰۰۰ نویسه</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ هر قلم — دقیقاً</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یک‌بار</text><rect x="16" y="444" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="508" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ قلم: بازپرداخت،</text><text x="288" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگزینی، تعمیر یا بدون</text><text x="288" y="594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام</text><rect x="16" y="632" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="696" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعیین وضعیت کالا — مستقل از</text><text x="288" y="754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ مشتری</text><rect x="16" y="792" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="856" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="886" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انبار — برای وضعیت‌های</text><text x="288" y="914" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی</text><rect x="16" y="952" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1016" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1046" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ تومان صحیح مثبت — فقط</text><text x="288" y="1074" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برای بازپرداخت</text><rect x="16" y="1112" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1176" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1206" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت، بازرسی و تعیین نتیجه</text><text x="288" y="1234" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جدا هستند؛ درخواست بازپرداخت</text><text x="288" y="1262" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا جایگزینی به معنی پرداخت</text><text x="288" y="1290" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا ارسال نیست.</text><rect x="16" y="1328" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1358" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="1396" width="288" height="220" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط در حال بازرسی؛ همهٔ</text><text x="288" y="1454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقلام دقیقاً یک‌بار. وضعیت</text><text x="288" y="1482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا: قابل‌فروش، قرنطینه،</text><text x="288" y="1510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آسیب‌دیده، تعمیر، جایگزینی،</text><text x="288" y="1538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت یا بدون اقدام. سه</text><text x="288" y="1566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت موجودی انبار</text><text x="288" y="1594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌خواهند.</text><rect x="16" y="1644" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1674" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1742" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
