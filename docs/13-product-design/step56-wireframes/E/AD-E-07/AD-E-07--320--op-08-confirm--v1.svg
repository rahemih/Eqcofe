<svg xmlns="http://www.w3.org/2000/svg" width="320" height="928" viewBox="0 0 320 928" role="img" aria-labelledby="title desc"><title id="title">AD-E-07 مرور نهایی — شروع بازرسی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Requested-&gt;under_review-&gt;approved; receive approved/in_transit_to_store requires all items positive after receipt; inspect received; resolve inspecting only with exact unique item coverage and resolution_note. Refund positive integer amount capped by delivered line value, non-refund amount forbidden; stock dispositions require warehouse. Reject needs reason. Resolve requires Step-Up. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="928" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — شروع بازرسی</text><rect x="16" y="160" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر واردشده و</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیامد اقدام را مرور کنید.</text><rect x="16" y="256" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت، بازرسی و تعیین نتیجه</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جدا هستند؛ درخواست بازپرداخت</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا جایگزینی به معنی پرداخت</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا ارسال نیست.</text><rect x="16" y="408" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت جاری بررسی شود.</text><rect x="16" y="476" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اگر نتیجه نامشخص شد، پیش از</text><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار وضعیت معتبر را</text><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بخوانید.</text><rect x="16" y="600" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط دریافت‌شده؛ وضعیت به در</text><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حال بازرسی می‌رود.</text><rect x="16" y="708" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="738" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="778" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="808" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع بازرسی</text><text x="288" y="848" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="876" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
