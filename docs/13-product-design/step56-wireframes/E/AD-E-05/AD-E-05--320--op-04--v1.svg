<svg xmlns="http://www.w3.org/2000/svg" width="320" height="826" viewBox="0 0 320 826" role="img" aria-labelledby="title desc"><title id="title">AD-E-05 لغو — محموله و تحویل و رهگیری 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create requires confirmed settled order, warehouse, shipping method and unique positive picked items. Draft-&gt;ready-&gt;handed_over; cancel draft/ready only. Handover and cancel require Step-Up. Tracking refresh requires provider and tracking number; no manual delivery or tracking-number edit route. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="826" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو — محموله و تحویل و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رهگیری</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل لغو — ۲ تا ۲۰۰۰ نویسه</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تحویل به حمل‌کننده با تحویل</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">به مشتری متفاوت است؛ پس از</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تحویل به حمل‌کننده لغو این</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مسیر مجاز نیست.</text><rect x="16" y="472" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="502" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="540" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="570" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط پیش‌نویس یا آماده؛ پس از</text><text x="288" y="598" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تحویل به حمل‌کننده این لغو</text><text x="288" y="626" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز نیست.</text><rect x="16" y="676" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="706" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
