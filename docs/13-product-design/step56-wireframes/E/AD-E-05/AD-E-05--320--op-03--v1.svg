<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1410" viewBox="0 0 320 1410" role="img" aria-labelledby="title desc"><title id="title">AD-E-05 ایجاد — محموله و تحویل و رهگیری 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Create requires confirmed settled order, warehouse, shipping method and unique positive picked items. Draft-&gt;ready-&gt;handed_over; cancel draft/ready only. Handover and cancel require Step-Up. Tracking refresh requires provider and tracking number; no manual delivery or tracking-number edit route. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1410" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجاد — محموله و تحویل و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رهگیری</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسهٔ سفارش</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انبار</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">روش حمل</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارائه‌دهندهٔ حمل — اختیاری</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قلم سفارش و تعداد مثبت —</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ردیف‌های یکتا</text><rect x="16" y="812" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="876" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تحویل به حمل‌کننده با تحویل</text><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">به مشتری متفاوت است؛ پس از</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تحویل به حمل‌کننده لغو این</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مسیر مجاز نیست.</text><rect x="16" y="1028" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1058" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت در زمان ثبت</text><text x="288" 