<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1390" viewBox="0 0 320 1390" role="img" aria-labelledby="title desc"><title id="title">AD-E-08 ثبت نتیجه — گارانتی و تعمیر و نتیجه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Requested-&gt;under_review-&gt;approved-&gt;received-&gt;repairing; resolve received/repairing, close resolved only. Refund/replacement needs positive quantity within delivered quantity; refund positive integer Toman capped by line value, non-refund amount forbidden. Resolve and close require Step-Up; both require resolution_note. Refund/replacement references are requests. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1390" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت نتیجه — گارانتی و تعمیر</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و نتیجه</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت نتیجه — الزامی،</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۴۰۰۰ نویسه</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجه: تعمیر، جایگزینی،</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت، بازرسی یا بدون</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام</text><rect x="16" y="472" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="536" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعداد — برای بازپرداخت یا</text><text x="288" y="594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جایگزینی</text><rect x="16" y="632" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="696" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="726" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ تومان صحیح مثبت — فقط</text><text x="288" y="754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برای بازپرداخت</text><rect x="16" y="792" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="856" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="886" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ گارانتی با بستن</text><text x="288" y="914" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرونده جداست؛ بستن پرونده</text><text x="288" y="942" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید پرداخت بازپرداخت نیست.</text><rect x="16" y="980" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1010" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت لازم است.</text><rect x="16" y="1048" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1078" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط دریافت‌شده یا در حال</text><text x="288" y="1106" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعمیر؛ مقدار جایگزینی یا</text><text x="288" y="1134" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت مثبت و حداکثر</text><text x="288" y="1162" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تحویل‌شده. مبلغ فقط برای</text><text x="288" y="1190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازپرداخت و در سقف ارزش قلم.</text><rect x="16" y="1240" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1270" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1338" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
