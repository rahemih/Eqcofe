<svg xmlns="http://www.w3.org/2000/svg" width="320" height="638" viewBox="0 0 320 638" role="img" aria-labelledby="title desc"><title id="title">AD-E-08 مشاهده — گارانتی و تعمیر و نتیجه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Requested-&gt;under_review-&gt;approved-&gt;received-&gt;repairing; resolve received/repairing, close resolved only. Refund/replacement needs positive quantity within delivered quantity; refund positive integer Toman capped by line value, non-refund amount forbidden. Resolve and close require Step-Up; both require resolution_note. Refund/replacement references are requests. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="638" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — گارانتی و تعمیر و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجه</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">زمان رویداد، وضعیت قبل و بعد</text><rect x="16" y="256" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">توضیح و عامل — فقط از پاسخ</text><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز</text><rect x="16" y="352" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ گارانتی با بستن</text><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرونده جداست؛ بستن پرونده</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید پرداخت بازپرداخت نیست.</text><rect x="16" y="488" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی اطلاعات</text><text x="288" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
