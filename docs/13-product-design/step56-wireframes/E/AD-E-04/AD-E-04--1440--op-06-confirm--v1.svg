<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="704" viewBox="0 0 1440 704" role="img" aria-labelledby="title desc"><title id="title">AD-E-04 مرور نهایی — شروع آماده‌سازی 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. Confirmed settled order and reservation required. Allocate single_warehouse_preferred/manual with unique positive item/warehouse quantities. Start preparation requires full allocation. Pick delta cannot exceed allocation; unpick cannot undercut shipped quantity and requires reason. No uniform warehouse scope guarantee is inferred. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="704" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — شروع آماده‌سازی</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، مقادیر واردشده و پیامد اقدام را مرور کنید.</text><rect x="32" y="228" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تخصیص، شروع آماده‌سازی و برداشت جدا هستند؛ برداشت مقدار افزایشی است و از تخصیص بیشتر نمی‌شود.</text><rect x="32" y="296" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت جاری بررسی شود.</text><rect x="32" y="364" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اگر نتیجه نامشخص شد، پیش از تکرار وضعیت معتبر را بخوانید.</text><rect x="32" y="432" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تمام مقدار همهٔ اقلام باید تخصیص یافته باشد.</text><rect x="32" y="512" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="542" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="32" y="582" width="1136" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="612" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع آماده‌سازی</text><text x="1152" y="652" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
