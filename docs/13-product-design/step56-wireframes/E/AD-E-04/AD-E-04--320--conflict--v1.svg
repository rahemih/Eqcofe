<svg xmlns="http://www.w3.org/2000/svg" width="320" height="818" viewBox="0 0 320 818" role="img" aria-labelledby="title desc"><title id="title">AD-E-04 نتیجه نامشخص یا اطلاعات قدیمی 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Confirmed settled order and reservation required. Allocate single_warehouse_preferred/manual with unique positive item/warehouse quantities. Start preparation requires full allocation. Pick delta cannot exceed allocation; unpick cannot undercut shipped quantity and requires reason. No uniform warehouse scope guarantee is inferred. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="818" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجه نامشخص یا اطلاعات</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قدیمی</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تخصیص، شروع آماده‌سازی و</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برداشت جدا هستند؛ برداشت</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار افزایشی است و از تخصیص</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بیشتر نمی‌شود.</text><rect x="16" y="340" width="288" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت را خودکار تکرار نکنید؛</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ابتدا وضعیت معتبر را</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بخوانید.</text><rect x="16" y="464" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برای تغییر همزمان، پاسخ تازه</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بگیرید و دوباره مرور کنید.</text><rect x="16" y="560" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بدون مسیر خواندن مجاز،</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیگیری دستی لازم است.</text><rect x="16" y="668" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت به بررسی</text><text x="288" y="738" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="766" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
