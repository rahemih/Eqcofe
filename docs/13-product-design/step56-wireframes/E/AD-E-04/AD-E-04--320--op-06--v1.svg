<svg xmlns="http://www.w3.org/2000/svg" width="320" height="854" viewBox="0 0 320 854" role="img" aria-labelledby="title desc"><title id="title">AD-E-04 شروع آماده‌سازی — آماده‌سازی و برداشت سفارش 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Confirmed settled order and reservation required. Allocate single_warehouse_preferred/manual with unique positive item/warehouse quantities. Start preparation requires full allocation. Pick delta cannot exceed allocation; unpick cannot undercut shipped quantity and requires reason. No uniform warehouse scope guarantee is inferred. Server permission and lifecycle remain authoritative. Design evidence grants no permission and certifies no runtime readiness. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="854" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع آماده‌سازی — آماده‌سازی</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و برداشت سفارش</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت اختیاری — حداکثر</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">۲۰۰۰ نویسه</text><rect x="16" y="284" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="348" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تخصیص، شروع آماده‌سازی و</text><text x="288" y="406" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برداشت جدا هستند؛ برداشت</text><text x="288" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار افزایشی است و از تخصیص</text><text x="288" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بیشتر نمی‌شود.</text><rect x="16" y="500" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجوز و وضعیت در زمان ثبت</text><text x="288" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوباره بررسی شود.</text><rect x="16" y="596" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="626" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تمام مقدار همهٔ اقلام باید</text><text x="288" y="654" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تخصیص یافته باشد.</text><rect x="16" y="704" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="734" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
