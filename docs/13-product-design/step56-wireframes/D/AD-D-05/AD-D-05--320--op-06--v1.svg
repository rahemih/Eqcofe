<svg xmlns="http://www.w3.org/2000/svg" width="320" height="696" viewBox="0 0 320 696" role="img" aria-labelledby="title desc"><title id="title">AD-D-05 غیرفعال‌سازی — قواعد وابسته به ارز 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Currency rule create validates nonnegative coefficient/fixed integer cost and positive integer rounding; update only name/coefficient/fixed/rounding with If-Match, not scope or currency replacement. Source update validation is not identical to create. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="696" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال‌سازی — قواعد وابسته</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">به ارز</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قیمت پیشنهادی از نرخ، ضریب،</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینهٔ ثابت و گردکردن به دست</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌آید؛ نسخهٔ ویرایش حفظ</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شود.</text><rect x="16" y="340" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از غیرفعال‌سازی، شناسه و</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنهٔ انتخاب‌شده و پیامد</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر را بررسی کنید.</text><rect x="16" y="476" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="546" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="576" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">غیرفعال‌سازی</text><text x="288" y="616" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="644" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
