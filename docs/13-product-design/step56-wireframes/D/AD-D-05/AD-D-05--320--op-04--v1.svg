<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1266" viewBox="0 0 320 1266" role="img" aria-labelledby="title desc"><title id="title">AD-D-05 ثبت — قواعد وابسته به ارز 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Currency rule create validates nonnegative coefficient/fixed integer cost and positive integer rounding; update only name/coefficient/fixed/rounding with If-Match, not scope or currency replacement. Source update validation is not identical to create. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1266" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — قواعد وابسته به ارز</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کد ارز</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ضریب</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینهٔ ثابت تومان</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مضرب گردکردن</text><rect x="16" y="756" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="820" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه</text><rect x="16" y="888" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="952" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="982" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قیمت پیشنهادی از نرخ، ضریب،</text><text x="288" y="1010" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینهٔ ثابت و گردکردن به دست</text><text x="288" y="1038" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌آید؛ نسخهٔ ویرایش حفظ</text><text x="288" y="1066" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شود.</text><rect x="16" y="1116" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1146" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1186" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1214" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
