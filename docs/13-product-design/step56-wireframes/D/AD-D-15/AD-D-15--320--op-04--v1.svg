<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1626" viewBox="0 0 320 1626" role="img" aria-labelledby="title desc"><title id="title">AD-D-15 ثبت — رسید کالا و برگشت سند 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Receipt draft-&gt;submitted-&gt;posted-&gt;reversed; If-Match throughout; post/reverse Step-Up and idempotency. Accepted+quarantine become owned; rejected does not. PO net cost/supplier/warehouse/item must match. Reverse requires reason and is blocked by closed PO or consumed/transferred cost-layer constraints. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1626" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — رسید کالا و برگشت سند</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سفارش و قلم مبنا</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأمین‌کننده</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انبار</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافتی</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پذیرفته</text><rect x="16" y="756" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="820" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قرنطینه</text><rect x="16" y="888" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="952" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="982" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ردشده</text><rect x="16" y="1020" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1084" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1114" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بهای واحد</text><rect x="16" y="1152" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1216" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جمع پذیرفته، قرنطینه و ردشده</text><text x="288" y="1274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برابر دریافتی؛ ثبت قطعی</text><text x="288" y="1302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی را تغییر می‌دهد.</text><rect x="16" y="1340" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="1398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="1426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="1476" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1574" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
