<svg xmlns="http://www.w3.org/2000/svg" width="320" height="578" viewBox="0 0 320 578" role="img" aria-labelledby="title desc"><title id="title">AD-D-15 ویرایش — رسید کالا و برگشت سند 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Receipt draft-&gt;submitted-&gt;posted-&gt;reversed; If-Match throughout; post/reverse Step-Up and idempotency. Accepted+quarantine become owned; rejected does not. PO net cost/supplier/warehouse/item must match. Reverse requires reason and is blocked by closed PO or consumed/transferred cost-layer constraints. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="578" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش — رسید کالا و برگشت</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سند</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقلام رسید و مقادیر</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ آخرین پاسخ؛ تعارض را</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">با بازخوانی حل کنید.</text><rect x="16" y="428" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="458" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="498" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="526" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
