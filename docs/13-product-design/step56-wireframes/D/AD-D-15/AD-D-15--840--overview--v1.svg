<svg xmlns="http://www.w3.org/2000/svg" width="840" height="700" viewBox="0 0 840 700" role="img" aria-labelledby="title desc"><title id="title">AD-D-15 رسید کالا و برگشت سند 840</title><desc id="desc">Persian RTL low-fidelity design evidence. Receipt draft-&gt;submitted-&gt;posted-&gt;reversed; If-Match throughout; post/reverse Step-Up and idempotency. Accepted+quarantine become owned; rejected does not. PO net cost/supplier/warehouse/item must match. Reverse requires reason and is blocked by closed PO or consumed/transferred cost-layer constraints. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="840" height="700" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="840" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="808" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="808" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="600" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="616" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="616" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="616" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="616" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="616" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="616" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="616" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="616" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="792" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="568" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="552" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رسید کالا و برگشت سند</text><rect x="32" y="160" width="536" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جمع پذیرفته، قرنطینه و ردشده برابر دریافتی؛ ثبت قطعی</text><text x="552" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی را تغییر می‌دهد.</text><rect x="32" y="256" width="536" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات بر اساس آخرین پاسخ مجاز؛ دادهٔ قدیمی نشانه‌گذاری</text><text x="552" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شود.</text><rect x="32" y="352" width="536" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="552" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو فقط در موارد بارشده؛ نبود داده با نداشتن دسترسی</text><text x="552" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است.</text><rect x="32" y="460" width="536" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="552" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="552" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
