<svg xmlns="http://www.w3.org/2000/svg" width="600" height="582" viewBox="0 0 600 582" role="img" aria-labelledby="title desc"><title id="title">AD-D-08 انتقال بین انبارها 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Transfer draft-&gt;approved-&gt;shipped-&gt;received; cancel only draft/approved. Unique positive item quantities; approval checks free stock but does not reserve it. Shipping consumes cost layers and receipt preserves cost lineage; no partial-receive input or fresh free-stock guarantee at ship. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="582" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتقال بین انبارها</text><rect x="24" y="160" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبدأ و مقصد متفاوت و هر دو در محدودهٔ دسترسی؛ پس از ارسال</text><text x="560" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو ساده وجود ندارد.</text><rect x="24" y="256" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات بر اساس آخرین پاسخ مجاز؛ دادهٔ قدیمی نشانه‌گذاری</text><text x="560" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شود.</text><rect x="24" y="352" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="382" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو فقط در موارد بارشده؛ نبود داده با نداشتن دسترسی</text><text x="560" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است.</text><rect x="24" y="460" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="560" y="530" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
