<svg xmlns="http://www.w3.org/2000/svg" width="320" height="640" viewBox="0 0 320 640" role="img" aria-labelledby="title desc"><title id="title">AD-D-08 تأیید — انتقال بین انبارها 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Transfer draft-&gt;approved-&gt;shipped-&gt;received; cancel only draft/approved. Unique positive item quantities; approval checks free stock but does not reserve it. Shipping consumes cost layers and receipt preserves cost lineage; no partial-receive input or fresh free-stock guarantee at ship. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="640" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید — انتقال بین انبارها</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبدأ و مقصد متفاوت و هر دو</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در محدودهٔ دسترسی؛ پس از</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال لغو ساده وجود ندارد.</text><rect x="16" y="284" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از تأیید، شناسه و دامنهٔ</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب‌شده و پیامد تغییر را</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی کنید.</text><rect x="16" y="420" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="490" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="520" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید</text><text x="288" y="560" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="588" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
