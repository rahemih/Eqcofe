<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1098" viewBox="0 0 320 1098" role="img" aria-labelledby="title desc"><title id="title">AD-D-08 ثبت — انتقال بین انبارها 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Transfer draft-&gt;approved-&gt;shipped-&gt;received; cancel only draft/approved. Unique positive item quantities; approval checks free stock but does not reserve it. Shipping consumes cost layers and receipt preserves cost lineage; no partial-receive input or fresh free-stock guarantee at ship. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1098" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — انتقال بین انبارها</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انبار مبدأ</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انبار مقصد</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">واریانت</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعداد</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبدأ و مقصد متفاوت و هر دو</text><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در محدودهٔ دسترسی؛ پس از</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال لغو ساده وجود ندارد.</text><rect x="16" y="812" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="842" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="870" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="898" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="948" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="978" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1018" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1046" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
