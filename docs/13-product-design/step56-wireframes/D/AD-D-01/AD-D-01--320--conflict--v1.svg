<svg xmlns="http://www.w3.org/2000/svg" width="320" height="902" viewBox="0 0 320 902" role="img" aria-labelledby="title desc"><title id="title">AD-D-01 تغییر همزمان یا نتیجهٔ نامشخص 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Base-price create validates nonnegative integer Toman, interval order and profit guard on decreases; base preview is informational, without an apply token or If-Match guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="902" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر همزمان یا نتیجهٔ</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نامشخص</text><rect x="16" y="188" width="288" height="164" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تاریخچهٔ قیمت و بازهٔ</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعتبار؛ کاهش قیمت نیازمند</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عبور از کنترل سود است.</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش پایه توکن قفل قیمت</text><text x="288" y="330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="16" y="368" width="288" height="80" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پاسخ موفق دریافت نشده است؛</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام را خودکار تکرار نکنید.</text><rect x="16" y="464" width="288" height="136" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">با خواندن مجاز نتیجه را</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی کنید؛ اگر مسیر خواندن</text><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ندارید، پیگیری دستی لازم</text><text x="288" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است.</text><rect x="16" y="616" width="288" height="108" rx="4" fill="#eeeeee" stroke="#555555"/><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برای دادهٔ منقضی، نسخه یا</text><text x="288" y="674" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش تازه بگیرید و</text><text x="288" y="702" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوباره مرور کنید.</text><rect x="16" y="752" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="782" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت به بررسی</text><text x="288" y="822" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
