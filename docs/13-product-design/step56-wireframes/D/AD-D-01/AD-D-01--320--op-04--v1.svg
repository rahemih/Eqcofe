<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1030" viewBox="0 0 320 1030" role="img" aria-labelledby="title desc"><title id="title">AD-D-01 ثبت — قیمت پایه و تاریخچه 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Base-price create validates nonnegative integer Toman, interval order and profit guard on decreases; base preview is informational, without an apply token or If-Match guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1030" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — قیمت پایه و تاریخچه</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">واریانت</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ صحیح تومان</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شروع اعتبار</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پایان اعتبار اختیاری</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تاریخچهٔ قیمت و بازهٔ</text><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعتبار؛ کاهش قیمت نیازمند</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عبور از کنترل سود است.</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش پایه توکن قفل قیمت</text><text x="288" y="830" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیست.</text><rect x="16" y="880" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="910" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="950" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="978" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
