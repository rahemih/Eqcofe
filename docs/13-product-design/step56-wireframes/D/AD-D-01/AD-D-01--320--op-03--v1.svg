ffffff" stroke="#555555"/><text x="288" y="1078" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تومان — اعداد نمونه نیستند؛</text><text x="288" y="1106" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در اجرا فقط پاسخ معتبر سرور</text><text x="288" y="1134" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبنای تأیید است.</text><rect x="16" y="1184" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1214" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش</text><text x="288" y="1254" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
