384" width="378.6666666666667" height="56" rx="4" fill="#ffffff" stroke="#555555"/><text x="394.66666666666663" y="418" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">—</text><rect x="32" y="456" width="1136" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="486" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><text x="1152" y="520" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط خواندنِ محدودهٔ مجاز؛ حرکت و بهای لایه قابل ویرایش مستقیم نیست.</text><rect x="32" y="560" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی اطلاعات</text><text x="1152" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
