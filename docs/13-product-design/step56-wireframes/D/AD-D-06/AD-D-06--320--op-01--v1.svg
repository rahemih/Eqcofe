<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1042" viewBox="0 0 320 1042" role="img" aria-labelledby="title desc"><title id="title">AD-D-06 مشاهده — موجودی، گردش و لایه‌های بهای تمام‌شده 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Physical availability=max(0,onHand-reserved-allocated-damaged-quarantine); protected quantity=ceil(physical*percent/100); online=max(0,physical-protected). FIFO orders receivedAt then id. Cost basis uses a global query, not a warehouse-scoped guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1042" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — موجودی، گردش و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لایه‌های بهای تمام‌شده</text><rect x="16" y="188" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر محلیِ موارد نمایش‌داده‌شده</text><rect x="16" y="252" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="282" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="338" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="408" width="288" height="144" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">عنوان: رکورد نمونه</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت: فقط نمایش</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام: مشاهده</text><rect x="16" y="564" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="594" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><text x="288" y="628" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجود فیزیکی با قابل‌فروش</text><text x="288" y="656" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آنلاین یکی نیست؛ لایهٔ هزینه</text><text x="288" y="684" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و گردش فقط خواندنی‌اند.</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آخرین پاسخ معتبر و زمان</text><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت؛ شناسه، وضعیت و</text><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جزئیات فقط از پاسخ مجاز.</text><text x="288" y="796" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ خالی: دامنهٔ مجاز و</text><text x="288" y="824" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر قابل‌پشتیبانی را بررسی</text><text x="288" y="852" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید.</text><rect x="16" y="892" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="922" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی فهرست</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
