<svg xmlns="http://www.w3.org/2000/svg" width="320" height="722" viewBox="0 0 320 722" role="img" aria-labelledby="title desc"><title id="title">AD-D-06 موجودی، گردش و لایه‌های بهای تمام‌شده 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Physical availability=max(0,onHand-reserved-allocated-damaged-quarantine); protected quantity=ceil(physical*percent/100); online=max(0,physical-protected). FIFO orders receivedAt then id. Cost basis uses a global query, not a warehouse-scoped guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="722" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی، گردش و لایه‌های بهای</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تمام‌شده</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجود فیزیکی با قابل‌فروش</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آنلاین یکی نیست؛ لایهٔ هزینه</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و گردش فقط خواندنی‌اند.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات بر اساس آخرین پاسخ</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مجاز؛ دادهٔ قدیمی</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نشانه‌گذاری شود.</text><rect x="16" y="436" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو فقط در موارد بارشده؛</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نبود داده با نداشتن دسترسی</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است.</text><rect x="16" y="572" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="602" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="288" y="642" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
