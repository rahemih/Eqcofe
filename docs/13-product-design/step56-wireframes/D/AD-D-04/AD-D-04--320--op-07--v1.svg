<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1316" viewBox="0 0 320 1316" role="img" aria-labelledby="title desc"><title id="title">AD-D-04 اعمال تغییرات — نرخ ارز و اثر تغییر آن 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Currency impact stores10-minute preview with first200 items; expected count is optional server-side, UI supplies it. Apply does not recheck current price amounts or fresh profit guard. Scope query default cap5001 is not complete-population proof; selection itself is separate from apply. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1316" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال تغییرات — نرخ ارز و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اثر تغییر آن</text><rect x="16" y="188" width="288" height="164" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب نرخ با اعمال قیمت</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تفاوت دارد؛ دریافت تازه فقط</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش می‌سازد. اثر ارز</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ضمانت بررسی دوبارهٔ قیمت</text><text x="288" y="330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جاری ندارد.</text><rect x="16" y="368" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از اعمال تغییرات، شناسه</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و دامنهٔ انتخاب‌شده و پیامد</text><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر را بررسی کنید.</text><rect x="16" y="492" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت پیش از</text><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام لازم است.</text><rect x="16" y="588" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="674" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="712" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="742" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قلم / مقدار قبل / مقدار بعد</text><text x="288" y="770" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">/ هشدار / تعداد تحت اثر</text><rect x="16" y="808" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="838" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش متعلق به همین</text><text x="288" y="866" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه یا همین فایل باشد؛</text><text x="288" y="894" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر ورودی، تأیید قبلی را</text><text x="288" y="922" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل می‌کند.</text><rect x="16" y="960" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تومان — اعداد نمونه نیستند؛</text><text x="288" y="1018" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در اجرا فقط پاسخ معتبر سرور</text><text x="288" y="1046" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبنای تأیید است.</text><rect x="16" y="1096" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1126" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="1166" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1196" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال تغییرات</text><text x="288" y="1236" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1264" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
