<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">AD-D-04 نرخ ارز و اثر تغییر آن 600</title><desc id="desc">Persian RTL low-fidelity design evidence. Currency impact stores10-minute preview with first200 items; expected count is optional server-side, UI supplies it. Apply does not recheck current price amounts or fresh profit guard. Scope query default cap5001 is not complete-population proof; selection itself is separate from apply. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="600" height="610" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="600" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="576" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="576" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="576" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="560" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نرخ ارز و اثر تغییر آن</text><rect x="24" y="160" width="552" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب نرخ با اعمال قیمت تفاوت دارد؛ دریافت تازه فقط</text><text x="560" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش می‌سازد. اثر ارز ضمانت بررسی دوبارهٔ قیمت جاری</text><text x="560" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ندارد.</text><rect x="24" y="284" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات بر اساس آخرین پاسخ مجاز؛ دادهٔ قدیمی نشانه‌گذاری</text><text x="560" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شود.</text><rect x="24" y="380" width="552" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="560" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو فقط در موارد بارشده؛ نبود داده با نداشتن دسترسی</text><text x="560" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است.</text><rect x="24" y="488" width="552" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="560" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="560" y="558" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
