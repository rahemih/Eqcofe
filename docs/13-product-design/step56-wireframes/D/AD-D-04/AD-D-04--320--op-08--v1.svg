<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1002" viewBox="0 0 320 1002" role="img" aria-labelledby="title desc"><title id="title">AD-D-04 پیش‌نمایش اثر ارز — نرخ ارز و اثر تغییر آن 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Currency impact stores10-minute preview with first200 items; expected count is optional server-side, UI supplies it. Apply does not recheck current price amounts or fresh profit guard. Scope query default cap5001 is not complete-population proof; selection itself is separate from apply. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1002" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش اثر ارز — نرخ ارز</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و اثر تغییر آن</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نرخ معتبر انتخاب‌شده</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنهٔ اثر</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه‌های دامنه</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شامل غیرفعال‌ها؟</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب نرخ و اعمال قیمت دو</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام جدا هستند؛ هشدار نرخ</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشکوک را بررسی کنید.</text><rect x="16" y="852" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="882" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش اثر ارز</text><text x="288" y="922" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="950" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
