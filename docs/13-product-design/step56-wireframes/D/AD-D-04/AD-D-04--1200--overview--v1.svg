<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AD-D-04 نرخ ارز و اثر تغییر آن 1200</title><desc id="desc">Persian RTL low-fidelity design evidence. Currency impact stores10-minute preview with first200 items; expected count is optional server-side, UI supplies it. Apply does not recheck current price amounts or fresh profit guard. Scope query default cap5001 is not complete-population proof; selection itself is separate from apply. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1200" height="700" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1200" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1168" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1168" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="960" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="976" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="976" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="976" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="976" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="976" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="976" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="976" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="976" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="928" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="912" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نرخ ارز و اثر تغییر آن</text><rect x="32" y="160" width="896" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب نرخ با اعمال قیمت تفاوت دارد؛ دریافت تازه فقط پیش‌نمایش می‌سازد. اثر ارز ضمانت بررسی</text><text x="912" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دوبارهٔ قیمت جاری ندارد.</text><rect x="32" y="256" width="896" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="286" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات بر اساس آخرین پاسخ مجاز؛ دادهٔ قدیمی نشانه‌گذاری شود.</text><rect x="32" y="324" width="896" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="912" y="354" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو فقط در موارد بارشده؛ نبود داده با نداشتن دسترسی متفاوت است.</text><rect x="32" y="404" width="896" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="912" y="434" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="912" y="474" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
