<svg xmlns="http://www.w3.org/2000/svg" width="320" height="724" viewBox="0 0 320 724" role="img" aria-labelledby="title desc"><title id="title">AD-D-09 آزادسازی تعهد باقی‌مانده — رزرو و تعهد موجودی و پرداخت دیررس 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Reservation begin-payment needs active; convert allows active/payment_pending/late_payment_review and converted replay. Late review starts from expired; conversion reacquires released stock. Release commitment only converted remainder. Some command paths omit warehouse scope assertions; do not certify uniform scope enforcement. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="724" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آزادسازی تعهد باقی‌مانده —</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رزرو و تعهد موجودی و پرداخت</text><text x="288" y="176" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دیررس</text><rect x="16" y="216" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرداخت دیررس ابتدا بررسی</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌شود؛ تبدیل رزرو با برداشت</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یا خروج کالا برابر نیست.</text><rect x="16" y="340" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از آزادسازی تعهد</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باقی‌مانده، شناسه و دامنهٔ</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب‌شده و پیامد تغییر را</text><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی کنید.</text><rect x="16" y="504" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="574" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="604" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آزادسازی تعهد باقی‌مانده</text><text x="288" y="644" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="672" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
