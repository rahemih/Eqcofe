<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1230" viewBox="0 0 320 1230" role="img" aria-labelledby="title desc"><title id="title">AD-D-13 ثبت — درخواست خرید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Request draft-&gt;submitted-&gt;approved/rejected; cancel draft/submitted, reason for reject/cancel. Approval has separation of duties and Step-Up. Draft replacement uses If-Match, unique positive items. Approved request can convert through a purchase order. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1230" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — درخواست خرید</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انبار</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">واریانت</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعداد درخواستی</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت قلم</text><rect x="16" y="756" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="820" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست‌کننده نمی‌تواند</text><text x="288" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست خود را تأیید کند؛ رد</text><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و لغو دلیل می‌خواهند.</text><rect x="16" y="944" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="974" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="1002" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="1030" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="1080" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1110" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1150" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1178" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
