<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1088" viewBox="0 0 320 1088" role="img" aria-labelledby="title desc"><title id="title">AD-D-13 رد — درخواست خرید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Request draft-&gt;submitted-&gt;approved/rejected; cancel draft/submitted, reason for reject/cancel. Approval has separation of duties and Step-Up. Draft replacement uses If-Match, unique positive items. Approved request can convert through a purchase order. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1088" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رد — درخواست خرید</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست‌کننده نمی‌تواند</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست خود را تأیید کند؛ رد</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و لغو دلیل می‌خواهند.</text><rect x="16" y="284" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از رد، شناسه و دامنهٔ</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب‌شده و پیامد تغییر را</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی کنید.</text><rect x="16" y="408" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت پیش از</text><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام لازم است.</text><rect x="16" y="504" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل یا یادداشت الزامی را</text><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وارد کنید.</text><rect x="16" y="600" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ آخرین پاسخ حفظ شود؛</text><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعارض نسخه نیازمند بازخوانی</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و مرور تغییرات است.</text><rect x="16" y="724" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="754" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل / یادداشت</text><rect x="16" y="792" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="868" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="898" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="938" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="968" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رد</text><text x="288" y="1008" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1036" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
