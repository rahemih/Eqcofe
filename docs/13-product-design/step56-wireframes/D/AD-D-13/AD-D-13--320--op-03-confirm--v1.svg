<svg xmlns="http://www.w3.org/2000/svg" width="320" height="860" viewBox="0 0 320 860" role="img" aria-labelledby="title desc"><title id="title">AD-D-13 مرور نهایی — ویرایش — درخواست خرید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Request draft-&gt;submitted-&gt;approved/rejected; cancel draft/submitted, reason for reject/cancel. Approval has separation of duties and Step-Up. Draft replacement uses If-Match, unique positive items. Approved request can convert through a purchase order. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="860" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور نهایی — ویرایش —</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست خرید</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه و دامنهٔ انتخاب‌شده،</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقادیر واردشده و پیامد تغییر</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">را مرور کنید.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست‌کننده نمی‌تواند</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست خود را تأیید کند؛ رد</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و لغو دلیل می‌خواهند.</text><rect x="16" y="436" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دسترسی و وضعیت مجاز در زمان</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت دوباره بررسی شود.</text><rect x="16" y="532" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پس از نتیجهٔ نامشخص، پیش از</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار وضعیت را بررسی کنید.</text><rect x="16" y="640" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="710" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ویرایش</text><text x="288" y="780" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="808" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
