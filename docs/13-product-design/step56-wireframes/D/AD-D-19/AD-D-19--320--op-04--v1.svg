<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1308" viewBox="0 0 320 1308" role="img" aria-labelledby="title desc"><title id="title">AD-D-19 بازیابی صریح — قالب، بارگذاری و بررسی خشک اکسل 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Binary XLSX uses server-derived parsing/security facts; max10MiB upload,5000 rows/sheet,64 columns,256 ZIP entries,50MiB expanded. No import list/status GET; recovery failed only, max3 attempts and note3..500. Completed/processing jobs cannot recover. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1308" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازیابی صریح — قالب،</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بارگذاری و بررسی خشک اکسل</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فایل واقعی حداکثر ۱۰</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مگابایت؛ ثبت کار ورود به</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">معنی اعمال داده نیست.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از بازیابی صریح، شناسه و</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنهٔ انتخاب‌شده و پیامد</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر را بررسی کنید.</text><rect x="16" y="436" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت پیش از</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام لازم است.</text><rect x="16" y="532" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل یا یادداشت الزامی را</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وارد کنید.</text><rect x="16" y="628" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="752" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="782" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فقط کار شکست‌خورده با شواهد</text><text x="288" y="810" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تلاش شکست‌خورده؛ سقف ۳ تلاش.</text><rect x="16" y="848" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">یادداشت بازیابی: ۳ تا ۵۰۰</text><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نویسه.</text><rect x="16" y="944" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="974" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل / یادداشت</text><rect x="16" y="1012" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1088" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1118" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="1158" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1188" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازیابی صریح</text><text x="288" y="1228" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1256" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
