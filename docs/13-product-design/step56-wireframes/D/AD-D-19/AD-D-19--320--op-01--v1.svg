<svg xmlns="http://www.w3.org/2000/svg" width="320" height="598" viewBox="0 0 320 598" role="img" aria-labelledby="title desc"><title id="title">AD-D-19 مشاهده — قالب، بارگذاری و بررسی خشک اکسل 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Binary XLSX uses server-derived parsing/security facts; max10MiB upload,5000 rows/sheet,64 columns,256 ZIP entries,50MiB expanded. No import list/status GET; recovery failed only, max3 attempts and note3..500. Completed/processing jobs cannot recover. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="598" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — قالب، بارگذاری و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی خشک اکسل</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت قالب رسمی XLSX با</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شیت‌های products، variants و</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">prices.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">راهنمای ستون‌ها را از پاسخ</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قالب بخوانید؛ فایل و فرمول</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلخواه پذیرفته نیست.</text><rect x="16" y="448" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت قالب</text><text x="288" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
