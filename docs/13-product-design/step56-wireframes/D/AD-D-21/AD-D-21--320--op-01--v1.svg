<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1260" viewBox="0 0 320 1260" role="img" aria-labelledby="title desc"><title id="title">AD-D-21 اعمال تغییرات — پیش‌نمایش و اعمال قیمت اکسل 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Pricing XLSX requires prices sheet sku/price_toman, unique SKU/variant and nonnegative integer Toman. Recomputed hash and in-transaction current price id/amount check; fresh profit guard on decreases. Step-Up and excel.pricing.apply idempotency; separate from catalog apply. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1260" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال تغییرات — پیش‌نمایش و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال قیمت اکسل</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قیمت قبل و بعد را بررسی</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید؛ تغییر فایل یا قیمت،</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش تازه می‌خواهد.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از اعمال تغییرات، شناسه</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و دامنهٔ انتخاب‌شده و پیامد</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر را بررسی کنید.</text><rect x="16" y="436" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت پیش از</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام لازم است.</text><rect x="16" y="532" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="656" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قلم / مقدار قبل / مقدار بعد</text><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">/ هشدار / تعداد تحت اثر</text><rect x="16" y="752" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="782" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش متعلق به همین</text><text x="288" y="810" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه یا همین فایل باشد؛</text><text x="288" y="838" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر ورودی، تأیید قبلی را</text><text x="288" y="866" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل می‌کند.</text><rect x="16" y="904" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تومان — اعداد نمونه نیستند؛</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در اجرا فقط پاسخ معتبر سرور</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبنای تأیید است.</text><rect x="16" y="1040" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1070" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="1110" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1140" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال تغییرات</text><text x="288" y="1180" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1208" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
