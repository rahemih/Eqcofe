<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1278" viewBox="0 0 320 1278" role="img" aria-labelledby="title desc"><title id="title">AD-D-21 پیش‌نمایش — پیش‌نمایش و اعمال قیمت اکسل 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Pricing XLSX requires prices sheet sku/price_toman, unique SKU/variant and nonnegative integer Toman. Recomputed hash and in-transaction current price id/amount check; fresh profit guard on decreases. Step-Up and excel.pricing.apply idempotency; separate from catalog apply. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1278" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش — پیش‌نمایش و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال قیمت اکسل</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">همان فایل بررسی‌شده</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">SKU</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قیمت صحیح تومان</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ کنترل سود</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قیمت قبل و بعد را بررسی</text><text x="288" y="774" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید؛ تغییر فایل یا قیمت،</text><text x="288" y="802" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش تازه می‌خواهد.</text><rect x="16" y="840" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="870" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پس از دریافت پاسخ: تعداد</text><text x="288" y="898" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">واقعی، هشدارها، مقادیر قبل و</text><text x="288" y="926" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بعد و اعتبار پیش‌نمایش را</text><text x="288" y="954" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور کنید.</text><rect x="16" y="992" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1022" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تومان — اعداد نمونه نیستند؛</text><text x="288" y="1050" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در اجرا فقط پاسخ معتبر سرور</text><text x="288" y="1078" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبنای تأیید است.</text><rect x="16" y="1128" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1158" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش</text><text x="288" y="1198" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1226" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
