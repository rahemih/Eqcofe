x="394.66666666666663" y="418" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده</text><rect x="32" y="456" width="1136" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="486" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش بخش بعدیِ موارد بارشده</text><text x="1152" y="520" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنهٔ سراسری با دامنهٔ دیگر ترکیب نمی‌شود؛ ویرایش فقط فیلدهای مجاز را تغییر می‌دهد. آخرین پاسخ معتبر و زمان دریافت؛</text><text x="1152" y="548" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه، وضعیت و جزئیات فقط از پاسخ مجاز. نتیجهٔ خالی: دامنهٔ مجاز و فیلتر قابل‌پشتیبانی را بررسی کنید.</text><rect x="32" y="588" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی فهرست</text><text x="1152" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
