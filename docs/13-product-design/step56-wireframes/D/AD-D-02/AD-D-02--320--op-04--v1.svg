<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1530" viewBox="0 0 320 1530" role="img" aria-labelledby="title desc"><title id="title">AD-D-02 ثبت — قواعد قیمت‌گذاری 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Price rules require scopes; global is exclusive. Percentage maximum100; quantity minimum comes from configuration when omitted. PATCH requires If-Match; activation validates the rule; no rule deletion route. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1530" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — قواعد قیمت‌گذاری</text><rect x="16" y="160" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نام فارسی</text><rect x="16" y="228" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="292" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع قانون</text><rect x="16" y="360" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="424" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="454" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع مقدار</text><rect x="16" y="492" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="556" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار</text><rect x="16" y="624" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="688" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="718" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه</text><rect x="16" y="756" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="820" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="850" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اولویت</text><rect x="16" y="888" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="952" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="982" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازهٔ اعتبار</text><rect x="16" y="1020" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1084" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1114" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداقل و حداکثر تعداد</text><rect x="16" y="1152" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="1216" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنهٔ سراسری با دامنهٔ دیگر</text><text x="288" y="1274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ترکیب نمی‌شود؛ ویرایش فقط</text><text x="288" y="1302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلدهای مجاز را تغییر</text><text x="288" y="1330" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌دهد.</text><rect x="16" y="1380" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1478" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
