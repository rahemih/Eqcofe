<svg xmlns="http://www.w3.org/2000/svg" width="320" height="766" viewBox="0 0 320 766" role="img" aria-labelledby="title desc"><title id="title">AD-D-16 پیش‌نمایش تخصیص — هزینهٔ تأمین و تخصیص آن 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Landed cost quantity/value/manual allocation uses accepted+quarantine; manual unique candidate ids and exact sum. Finalize draft with If-Match, Step-Up/idempotency and recomputes allocations; preview is not a frozen allocation token. Preview/finalize omit explicit warehouse ScopePolicy calls; restriction retained. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="766" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش تخصیص — هزینهٔ</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأمین و تخصیص آن</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینهٔ پیش‌نویس انتخاب‌شده</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تخصیص دستی هر قلم، فقط در</text><text x="288" y="378" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">روش دستی</text><rect x="16" y="416" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="480" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="510" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جمع سهم‌ها باید برابر هزینه</text><text x="288" y="538" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باشد؛ روش تعدادی یا ارزشی را</text><text x="288" y="566" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سرور محاسبه می‌کند.</text><rect x="16" y="616" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش تخصیص</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
