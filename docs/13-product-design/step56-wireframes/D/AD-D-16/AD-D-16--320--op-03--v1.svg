<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1286" viewBox="0 0 320 1286" role="img" aria-labelledby="title desc"><title id="title">AD-D-16 ثبت — هزینهٔ تأمین و تخصیص آن 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Landed cost quantity/value/manual allocation uses accepted+quarantine; manual unique candidate ids and exact sum. Finalize draft with If-Match, Step-Up/idempotency and recomputes allocations; preview is not a frozen allocation token. Preview/finalize omit explicit warehouse ScopePolicy calls; restriction retained. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1286" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — هزینهٔ تأمین و تخصیص</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آن</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">رسید یا سفارش مبنا</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع هزینه</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ تومان</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">روش تخصیص</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سهم هر قلم</text><rect x="16" y="784" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="848" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جمع تخصیص دقیقاً برابر</text><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هزینه؛ نهایی‌سازی می‌تواند</text><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و بهای مصرف‌شده را</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعدیل کند.</text><rect x="16" y="1000" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1030" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="1058" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="1086" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="1136" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1166" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1206" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1234" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
