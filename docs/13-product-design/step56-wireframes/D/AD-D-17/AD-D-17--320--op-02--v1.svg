<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1390" viewBox="0 0 320 1390" role="img" aria-labelledby="title desc"><title id="title">AD-D-17 ثبت — صورتحساب تأمین‌کننده و مغایرت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Invoice recorded-&gt;matched/disputed/cancelled with If-Match; match needs PO and equal amount, dispute/cancel reason. List is the read source; no single-invoice GET or payment endpoint. Unlinked invoices are not claimed warehouse-isolated. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1390" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ثبت — صورتحساب تأمین‌کننده و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مغایرت</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأمین‌کننده</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سفارش اختیاری</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شمارهٔ فاکتور</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تاریخ</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبلغ تومان</text><rect x="16" y="784" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="848" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل مغایرت</text><rect x="16" y="916" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="980" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1010" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق فقط از ثبت‌شده و با</text><text x="288" y="1038" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سفارش مبنا و مبلغ برابر؛</text><text x="288" y="1066" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرداخت در این سطح نیست.</text><rect x="16" y="1104" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1134" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="1162" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="1190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="1240" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1270" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور پیش از ثبت</text><text x="288" y="1310" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1338" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
