<svg xmlns="http://www.w3.org/2000/svg" width="320" height="792" viewBox="0 0 320 792" role="img" aria-labelledby="title desc"><title id="title">AD-D-17 تطبیق فاکتور — صورتحساب تأمین‌کننده و مغایرت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Invoice recorded-&gt;matched/disputed/cancelled with If-Match; match needs PO and equal amount, dispute/cancel reason. List is the read source; no single-invoice GET or payment endpoint. Unlinked invoices are not claimed warehouse-isolated. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="792" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق فاکتور — صورتحساب</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأمین‌کننده و مغایرت</text><rect x="16" y="188" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق فقط از ثبت‌شده و با</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سفارش مبنا و مبلغ برابر؛</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پرداخت در این سطح نیست.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از تطبیق فاکتور، شناسه و</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنهٔ انتخاب‌شده و پیامد</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر را بررسی کنید.</text><rect x="16" y="436" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ آخرین پاسخ حفظ شود؛</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعارض نسخه نیازمند بازخوانی</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و مرور تغییرات است.</text><rect x="16" y="572" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="602" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="642" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="672" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تطبیق فاکتور</text><text x="288" y="712" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="740" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
