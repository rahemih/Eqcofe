<svg xmlns="http://www.w3.org/2000/svg" width="320" height="888" viewBox="0 0 320 888" role="img" aria-labelledby="title desc"><title id="title">AD-D-18 تأیید — مرجوعی خرید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Purchase return draft-&gt;approved-&gt;shipped-&gt;completed; approve rejects creator and requires Step-Up; ship Step-Up/idempotency; If-Match transitions. Source default bucket quarantine. Receipt ownership limits checked at create, not a claimed fresh recheck at approval; no cancel/refund route. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="888" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید — مرجوعی خرید</text><rect x="16" y="160" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجادکننده تأییدکننده نیست؛</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال مرجوعی موجودی را کم</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">می‌کند و بازپرداخت محسوب</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمی‌شود.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از تأیید، شناسه و دامنهٔ</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب‌شده و پیامد تغییر را</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی کنید.</text><rect x="16" y="436" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت پیش از</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام لازم است.</text><rect x="16" y="532" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ آخرین پاسخ حفظ شود؛</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعارض نسخه نیازمند بازخوانی</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و مرور تغییرات است.</text><rect x="16" y="668" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="738" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="768" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید</text><text x="288" y="808" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="836" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
