<svg xmlns="http://www.w3.org/2000/svg" width="360" height="666" viewBox="0 0 360 666" role="img" aria-labelledby="title desc"><title id="title">AD-D-18 مرجوعی خرید 360</title><desc id="desc">Persian RTL low-fidelity design evidence. Purchase return draft-&gt;approved-&gt;shipped-&gt;completed; approve rejects creator and requires Step-Up; ship Step-Up/idempotency; If-Match transitions. Source default bucket quarantine. Receipt ownership limits checked at create, not a claimed fresh recheck at approval; no cancel/refund route. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="360" height="666" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="360" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="344" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="344" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="344" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="328" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرجوعی خرید</text><rect x="16" y="160" width="328" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ایجادکننده تأییدکننده نیست؛</text><text x="328" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">ارسال مرجوعی موجودی را کم می‌کند</text><text x="328" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و بازپرداخت محسوب نمی‌شود.</text><rect x="16" y="284" width="328" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اطلاعات بر اساس آخرین پاسخ مجاز؛</text><text x="328" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دادهٔ قدیمی نشانه‌گذاری شود.</text><rect x="16" y="380" width="328" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="328" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جست‌وجو فقط در موارد بارشده؛</text><text x="328" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نبود داده با نداشتن دسترسی</text><text x="328" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">متفاوت است.</text><rect x="16" y="516" width="328" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="328" y="546" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب کار</text><text x="328" y="586" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="328" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
