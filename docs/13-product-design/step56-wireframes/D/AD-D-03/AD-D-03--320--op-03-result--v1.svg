<svg xmlns="http://www.w3.org/2000/svg" width="320" height="914" viewBox="0 0 320 914" role="img" aria-labelledby="title desc"><title id="title">AD-D-03 نتیجهٔ پیش‌نمایش — پیش‌نمایش و اعمال گروهی قیمت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Bulk preview rejects scopes above5000; exposes first200 items and affected_count. Apply requires count, Step-Up and scoped idempotency, rejects blocked/unavailable stored guard and changed current price amounts; no fresh guard or requester-binding guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="914" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ پیش‌نمایش — پیش‌نمایش</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و اعمال گروهی قیمت</text><rect x="16" y="188" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنهٔ انتخاب‌شده و زمان</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت پاسخ</text><rect x="16" y="284" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعداد اقلام و هشدارها — فقط</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">از پاسخ معتبر</text><rect x="16" y="380" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="410" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قلم | مقدار قبل | مقدار</text><text x="288" y="438" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیشنهادی | علت هشدار</text><rect x="16" y="476" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="506" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۵۰۰۰ واریانت؛</text><text x="288" y="534" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش ۱۰ دقیقه معتبر</text><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ ۲۰۰ قلم نخست فقط نمونهٔ</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش‌اند.</text><rect x="16" y="628" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="658" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">برای تغییر ورودی، پیش‌نمایش</text><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تازه بگیرید؛ این نتیجه به</text><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">معنی اعمال نیست.</text><rect x="16" y="764" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="794" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور اقدام بعدی</text><text x="288" y="834" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="862" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
