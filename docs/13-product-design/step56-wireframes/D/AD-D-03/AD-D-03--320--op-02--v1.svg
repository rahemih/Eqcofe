<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1288" viewBox="0 0 320 1288" role="img" aria-labelledby="title desc"><title id="title">AD-D-03 اعمال تغییرات — پیش‌نمایش و اعمال گروهی قیمت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Bulk preview rejects scopes above5000; exposes first200 items and affected_count. Apply requires count, Step-Up and scoped idempotency, rejects blocked/unavailable stored guard and changed current price amounts; no fresh guard or requester-binding guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1288" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال تغییرات — پیش‌نمایش و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال گروهی قیمت</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۵۰۰۰ واریانت؛</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش ۱۰ دقیقه معتبر</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ ۲۰۰ قلم نخست فقط نمونهٔ</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش‌اند.</text><rect x="16" y="340" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از اعمال تغییرات، شناسه</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و دامنهٔ انتخاب‌شده و پیامد</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر را بررسی کنید.</text><rect x="16" y="464" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید دوبارهٔ هویت پیش از</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اقدام لازم است.</text><rect x="16" y="560" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ نامشخص: ابتدا بررسی؛</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تکرار صریح فقط با همان</text><text x="288" y="646" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">درخواست و کلید قبلی.</text><rect x="16" y="684" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="714" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">قلم / مقدار قبل / مقدار بعد</text><text x="288" y="742" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">/ هشدار / تعداد تحت اثر</text><rect x="16" y="780" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="810" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش متعلق به همین</text><text x="288" y="838" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه یا همین فایل باشد؛</text><text x="288" y="866" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تغییر ورودی، تأیید قبلی را</text><text x="288" y="894" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">باطل می‌کند.</text><rect x="16" y="932" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تومان — اعداد نمونه نیستند؛</text><text x="288" y="990" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در اجرا فقط پاسخ معتبر سرور</text><text x="288" y="1018" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبنای تأیید است.</text><rect x="16" y="1068" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1098" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="1138" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1168" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال تغییرات</text><text x="288" y="1208" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1236" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
