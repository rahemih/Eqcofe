<svg xmlns="http://www.w3.org/2000/svg" width="320" height="750" viewBox="0 0 320 750" role="img" aria-labelledby="title desc"><title id="title">AD-D-03 مشاهده — پیش‌نمایش و اعمال گروهی قیمت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Bulk preview rejects scopes above5000; exposes first200 items and affected_count. Apply requires count, Step-Up and scoped idempotency, rejects blocked/unavailable stored guard and changed current price amounts; no fresh guard or requester-binding guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="750" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشاهده — پیش‌نمایش و اعمال</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گروهی قیمت</text><rect x="16" y="188" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۵۰۰۰ واریانت؛</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش ۱۰ دقیقه معتبر</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ ۲۰۰ قلم نخست فقط نمونهٔ</text><text x="288" y="302" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش‌اند.</text><rect x="16" y="340" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">آخرین پاسخ معتبر و زمان</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت؛ شناسه، وضعیت و</text><text x="288" y="426" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">جزئیات فقط از پاسخ مجاز.</text><rect x="16" y="464" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نتیجهٔ خالی: دامنهٔ مجاز و</text><text x="288" y="522" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فیلتر قابل‌پشتیبانی را بررسی</text><text x="288" y="550" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کنید.</text><rect x="16" y="600" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="630" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازخوانی اطلاعات</text><text x="288" y="670" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="698" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
