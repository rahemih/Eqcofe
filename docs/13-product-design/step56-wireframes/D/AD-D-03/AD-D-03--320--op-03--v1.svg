<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1438" viewBox="0 0 320 1438" role="img" aria-labelledby="title desc"><title id="title">AD-D-03 پیش‌نمایش — پیش‌نمایش و اعمال گروهی قیمت 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Bulk preview rejects scopes above5000; exposes first200 items and affected_count. Apply requires count, Step-Up and scoped idempotency, rejects blocked/unavailable stored guard and changed current price amounts; no fresh guard or requester-binding guarantee. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1438" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش — پیش‌نمایش و</text><text x="288" y="148" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">اعمال گروهی قیمت</text><rect x="16" y="188" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دامنه</text><rect x="16" y="256" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="320" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="350" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">شناسه‌های دامنه</text><rect x="16" y="388" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="452" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="482" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نوع تغییر</text><rect x="16" y="520" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="584" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="614" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مقدار تغییر</text><rect x="16" y="652" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="716" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="746" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">گردکردن</text><rect x="16" y="784" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="848" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="878" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">حداکثر ۵۰۰۰ واریانت؛</text><text x="288" y="906" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش ۱۰ دقیقه معتبر</text><text x="288" y="934" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ ۲۰۰ قلم نخست فقط نمونهٔ</text><text x="288" y="962" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمایش‌اند.</text><rect x="16" y="1000" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1030" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پس از دریافت پاسخ: تعداد</text><text x="288" y="1058" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">واقعی، هشدارها، مقادیر قبل و</text><text x="288" y="1086" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بعد و اعتبار پیش‌نمایش را</text><text x="288" y="1114" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مرور کنید.</text><rect x="16" y="1152" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="1182" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تومان — اعداد نمونه نیستند؛</text><text x="288" y="1210" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در اجرا فقط پاسخ معتبر سرور</text><text x="288" y="1238" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مبنای تأیید است.</text><rect x="16" y="1288" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="1318" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش‌نمایش</text><text x="288" y="1358" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="1386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
