<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1020" viewBox="0 0 320 1020" role="img" aria-labelledby="title desc"><title id="title">AD-D-14 لغو — سفارش خرید 320</title><desc id="desc">Persian RTL low-fidelity design evidence. PO draft-&gt;submitted-&gt;approved-&gt;sent; cancel draft/submitted/approved/sent; close received/partially_received, unfinished remainder needs reason and closability checks. Linked request must be approved and same warehouse. Amounts integer Toman; discount cannot exceed line subtotal. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="1020" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو — سفارش خرید</text><rect x="16" y="160" width="288" height="136" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سازنده نمی‌تواند سفارش را</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تأیید کند؛ سفارش</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نیمه‌دریافت‌شده با بستن</text><text x="288" y="274" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مانده خاتمه می‌یابد.</text><rect x="16" y="312" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از لغو، شناسه و دامنهٔ</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انتخاب‌شده و پیامد تغییر را</text><text x="288" y="398" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بررسی کنید.</text><rect x="16" y="436" width="288" height="80" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="466" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل یا یادداشت الزامی را</text><text x="288" y="494" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وارد کنید.</text><rect x="16" y="532" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="562" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ آخرین پاسخ حفظ شود؛</text><text x="288" y="590" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تعارض نسخه نیازمند بازخوانی</text><text x="288" y="618" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">و مرور تغییرات است.</text><rect x="16" y="656" width="288" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="686" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل / یادداشت</text><rect x="16" y="724" width="288" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="16" y="800" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="830" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="16" y="870" width="288" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="900" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو</text><text x="288" y="940" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="968" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
