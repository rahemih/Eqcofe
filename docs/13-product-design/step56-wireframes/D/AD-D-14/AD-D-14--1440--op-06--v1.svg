<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="768" viewBox="0 0 1440 768" role="img" aria-labelledby="title desc"><title id="title">AD-D-14 لغو — سفارش خرید 1440</title><desc id="desc">Persian RTL low-fidelity design evidence. PO draft-&gt;submitted-&gt;approved-&gt;sent; cancel draft/submitted/approved/sent; close received/partially_received, unfinished remainder needs reason and closability checks. Linked request must be approved and same warehouse. Amounts integer Toman; discount cannot exceed line subtotal. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="1440" height="768" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="1440" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="1408" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="1408" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><rect x="1200" y="80" width="224" height="580" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="1216" y="100" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="130" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمای کلی</text><rect x="1216" y="164" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="194" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">فروش و سفارش</text><rect x="1216" y="228" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">کالا و قیمت</text><rect x="1216" y="292" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="322" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">موجودی و تأمین</text><rect x="1216" y="356" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="386" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مشتریان</text><rect x="1216" y="420" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مالی و گزارش‌ها</text><rect x="1216" y="484" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="514" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تنظیمات و کنترل</text><rect x="1216" y="548" width="192" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1392" y="578" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">امنیت و عملیات</text><text x="1168" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="1152" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو — سفارش خرید</text><rect x="32" y="160" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">سازنده نمی‌تواند سفارش را تأیید کند؛ سفارش نیمه‌دریافت‌شده با بستن مانده خاتمه می‌یابد.</text><rect x="32" y="228" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="258" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">پیش از لغو، شناسه و دامنهٔ انتخاب‌شده و پیامد تغییر را بررسی کنید.</text><rect x="32" y="296" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="326" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل یا یادداشت الزامی را وارد کنید.</text><rect x="32" y="364" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="394" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نسخهٔ آخرین پاسخ حفظ شود؛ تعارض نسخه نیازمند بازخوانی و مرور تغییرات است.</text><rect x="32" y="432" width="1136" height="52" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="462" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دلیل / یادداشت</text><rect x="32" y="500" width="1136" height="48" rx="4" fill="#f5f5f5" stroke="#555555"/><rect x="32" y="576" width="1136" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="1152" y="606" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">انصراف</text><rect x="32" y="646" width="1136" height="48" rx="4" fill="#ffffff" stroke="#555555"/><text x="1152" y="676" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">لغو</text><text x="1152" y="716" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها نمونه‌اند.</text></g></svg>
