<svg xmlns="http://www.w3.org/2000/svg" width="320" height="570" viewBox="0 0 320 570" role="img" aria-labelledby="title desc"><title id="title">AD-D-12 در حال دریافت اطلاعات 320</title><desc id="desc">Persian RTL low-fidelity design evidence. Supplier create is idempotent; PATCH and activate/deactivate require If-Match. New orders/receipts/returns require active supplier. No supplier delete endpoint or invented supplier-wide warehouse isolation is claimed. Server permission and owner policy remain authoritative; inherited source gaps are NO_ACTION. UI review never grants permission. Keyboard and state behavior are specified in companion documentation; this SVG is not an interactive implementation.</desc><rect width="320" height="570" fill="#ffffff"/><g font-family="Tahoma, Arial, sans-serif" fill="#111111"><rect x="0" y="0" width="320" height="64" rx="4" fill="#eeeeee" stroke="#555555"/><text x="304" y="28" font-size="18" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت EQCOFE</text><text x="304" y="52" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">منو  |  مسیرها  |  حساب</text><text x="304" y="94" font-size="14" direction="rtl" text-anchor="start" unicode-bidi="plaintext">مدیریت / مسیر جاری</text><text x="288" y="120" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">در حال دریافت اطلاعات</text><rect x="16" y="160" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="190" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">دریافت پاسخ مجاز در جریان</text><text x="288" y="218" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">است؛ تغییرات تا روشن‌شدن</text><text x="288" y="246" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وضعیت غیرفعال‌اند.</text><rect x="16" y="284" width="288" height="108" rx="4" fill="#ffffff" stroke="#555555"/><text x="288" y="314" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">هنگام بازخوانی، دادهٔ قبلی</text><text x="288" y="342" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">با نشان قدیمی باقی می‌ماند؛</text><text x="288" y="370" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">تمرکز جابه‌جا نشود.</text><rect x="16" y="420" width="288" height="48" rx="4" fill="#dddddd" stroke="#555555"/><text x="288" y="450" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">بازگشت امن</text><text x="288" y="490" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">وایرفریم کم‌جزئیات؛ داده‌ها</text><text x="288" y="518" font-size="16" direction="rtl" text-anchor="start" unicode-bidi="plaintext">نمونه‌اند.</text></g></svg>
