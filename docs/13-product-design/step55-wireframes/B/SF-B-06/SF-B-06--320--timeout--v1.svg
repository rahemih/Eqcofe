<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1180" viewBox="0 0 320 1180" role="img" aria-labelledby="title desc">
<title id="title">SF-B-06 — بازیابی مسیر کشف محصول — timeout — 320px</title>
<desc id="desc">وایرفریم کم‌جزئیات فارسی و راست‌به‌چپ برای بازگشت کنترل‌شده از نتیجه خالی یا خطای موقت. اقدام اصلی تلاش دوباره و بازیابی پاک‌کردن فیلتر یا بازگشت به دسته‌ها است.</desc>
<rect width="320" height="1180" fill="#F8FAFC"/>
<style>text{font-family:Vazirmatn,Tahoma,Arial,sans-serif;fill:#0F172A}.muted{fill:#475569}.meta{font-size:10px}.body{font-size:13px}.label{font-size:12px;font-weight:600}.title{font-size:20px;font-weight:700}.section{font-size:15px;font-weight:700}.price{font-size:14px;font-weight:700}.wire{fill:#fff;stroke:#CBD5E1;stroke-width:1}.soft{fill:#F1F5F9;stroke:#CBD5E1}.accent{fill:#F0FDFA;stroke:#0F766E;stroke-width:1.5}.action{fill:#0F766E}.actionText{fill:#fff;font-size:12px;font-weight:700}.danger{fill:#FEF2F2;stroke:#B91C1C}.warning{fill:#FFFBEB;stroke:#B45309}.focus{fill:none;stroke:#1D4ED8;stroke-width:3;stroke-dasharray:5 3}</style>
