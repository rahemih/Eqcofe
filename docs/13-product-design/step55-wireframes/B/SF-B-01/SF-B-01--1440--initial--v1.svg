<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">SF-B-01 — خانه و ورودی خرید — initial — 1440px</title>
<desc id="desc">وایرفریم کم‌جزئیات فارسی و راست‌به‌چپ برای شروع کشف محصول از جست‌وجو یا دسته‌بندی. اقدام اصلی جست‌وجوی محصول و بازیابی مشاهده همه دسته‌ها است.</desc>
