<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1180" viewBox="0 0 320 1180" role="img" aria-labelledby="title desc">
<title id="title">SF-B-01 — خانه و ورودی خرید — progressive — 320px</title>
<desc id="desc">وایرفریم کم‌جزئیات فارسی و راست‌به‌چپ برای شروع کشف محصول از جست‌وجو یا دسته‌بندی. اقدام اصلی جست‌وجوی محصول و بازیابی مشاهده همه دسته‌ها است.</desc>
