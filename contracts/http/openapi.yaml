    BadRequest:
      description: درخواست نامعتبر
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: نیاز به احراز هویت
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: دسترسی غیرمجاز
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: یافت نشد
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: تداخل وضعیت/نسخه
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: نقض قانون کسب‌وکار
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: محدودیت نرخ درخواست
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /products:
    get:
      tags:
      - Catalog
      operationId: listProducts
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: category
        in: query
        schema:
          type: string
      - name: brand
        in: query
        schema:
          type: string
      - name: min_price
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: max_price
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: available
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: موفق
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /products/{slug}:
    get:
      tags:
      - Catalog
      operationId: getProduct
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: موفق
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories:
    get:
      tags:
      - Catalog
      operationId: listCategories
      responses:
        '200':
          description: دسته‌ها
  /categories/{slug}:
    get:
      tags:
      - Catalog
      operationId: getCategory
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: دسته
        '404':
          $ref: '#/components/responses/NotFound'
  /brands:
    get:
      tags:
      - Catalog
      operationId: listBrands
      responses:
        '200':
          description: برندها
  /search:
    get:
      tags:
      - Search
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: نتایج جستجو
  /compare:
    post:
      tags:
      - Compare
      operationId: compareProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - product_ids
              properties:
                product_ids:
                  type: array
                  minItems: 1
                  maxItems: 4
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/EntityId'
      responses:
        '200':
          description: نتیجه مقایسه
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/otp/request:
    post:
      tags:
      - Auth
      operationId: requestOtp
