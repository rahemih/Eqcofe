openapi: 3.1.0
info:
  title: EQCOFE API
  version: 1.0.0-step28
  description: 'قرارداد ماشین‌خوان API سامانه EQCOFE. تمام مبالغ مالی بر حسب تومان
    هستند.


    قدم ۲۸: Schema Catalog و DTO/Validation Contract ماشین‌خوان اضافه شده است.'
servers:
- url: https://api.eqcofe.com/api/v1
  description: Production
- url: https://staging-api.eqcofe.com/api/v1
  description: Staging
security: []
tags:
- name: Auth
- name: Catalog
- name: Search
- name: Compare
- name: Cart
- name: Checkout
- name: Payments
- name: Customer
- name: Returns
- name: Warranty
- name: Admin Products
- name: Admin Pricing
- name: Admin Inventory
- name: Admin Procurement
- name: Admin Orders
- name: Admin Payments
- name: Admin POS
- name: Admin Fulfillment
- name: Admin Returns
- name: Admin Customers
- name: Admin Finance
- name: Admin Marketing
- name: Admin Content
- name: Admin AI
- name: Admin Notifications
- name: Admin Integrations
- name: Admin Configuration
- name: Admin RBAC
- name: Admin Security
- name: Admin Operations
- name: Admin Data
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: eqcofe_session
    adminSession:
      type: apiKey
      in: cookie
      name: eqcofe_admin_session
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    stepUpToken:
      type: apiKey
      in: header
      name: X-Step-Up-Token
    adminPreAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-pre-auth-token
      description: توکن کوتاه‌عمر مرحله پیش‌احراز هویت مدیر پیش از FIDO2.
    checkoutAccessToken:
      type: apiKey
      in: header
      name: X-Checkout-Token
      description: توکن قابلیت کوتاه‌عمر برای Checkout و پرداخت مهمان؛ دانستن شناسه
        سفارش/پرداخت به‌تنهایی مجوز دسترسی نیست.
    cartAccessToken:
      type: apiKey
      in: header
      name: X-Cart-Token
  headers:
    RequestId:
      description: شناسه رهگیری درخواست
      schema:
        type: string
    ETag:
      description: نسخه optimistic concurrency موجودیت
      schema:
        type: string
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string
  schemas:
    FinanceReportRunRequest:
      type: object
      additionalProperties: false
      required: [report_key]
      properties:
        report_key:
          type: string
          enum: [finance_summary, profit_by_order, costs_by_type, owner_distribution, journal_trial_balance]
        from:
          type: [string, 'null']
          format: date-time
        to:
          type: [string, 'null']
          format: date-time
        limit:
          type: integer
          minimum: 1
          maximum: 1000
    FinanceExportCreateRequest:
      type: object
      additionalProperties: false
      required: [report_job_id, format]
      properties:
        report_job_id:
          $ref: '#/components/schemas/EntityId'
        format:
          type: string
          enum: [csv, json]
    EntityId:
      type: string
      format: uuid
    MoneyToman:
      type: integer
      format: int64
      minimum: 0
      description: مبلغ بر حسب تومان
    SignedMoneyToman:
      type: integer
      format: int64
      description: مبلغ علامت‌دار بر حسب تومان؛ برای سود، زیان و حاشیه ارسال
    Timestamp:
      type: string
      format: date-time
    SuccessMeta:
      type: object
      required:
      - request_id
      - timestamp
      properties:
        request_id:
          type: string
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    CursorPagination:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ErrorResponse:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
    ProductCard:
      type: object
      required:
      - id
      - slug
      - name
      - price
      - availability
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        slug:
          type: string
        name:
          type: string
        brand:
          type:
          - object
          - 'null'
          additionalProperties: true
        primary_category:
          type: object
          additionalProperties: true
        primary_image:
          type:
          - object
          - 'null'
          additionalProperties: true
        price:
          type: object
          required:
          - current_toman
          properties:
            current_toman:
              $ref: '#/components/schemas/MoneyToman'
            old_toman:
              oneOf:
              - $ref: '#/components/schemas/MoneyToman'
              - type: 'null'
            discount_percent:
              type:
              - number
              - 'null'
        availability:
          type: object
          required:
          - sales_enabled
          - in_stock
          properties:
            sales_enabled:
              type: boolean
            in_stock:
              type: boolean
    CartItemInput:
      type: object
      required:
      - variant_id
      - quantity
      properties:
        variant_id:
          $ref: '#/components/schemas/EntityId'
        quantity:
          type: integer
          minimum: 1
    QuoteRequest:
      type: object
      required:
      - cart_id
      - address_id
      - shipping_method_id
      properties:
        cart_id:
          $ref: '#/components/schemas/EntityId'
        address_id:
          $ref: '#/components/schemas/EntityId'
        shipping_method_id:
          $ref: '#/components/schemas/EntityId'
        coupon_code:
          type:
          - string
          - 'null'
    Quote:
      type: object
      required:
      - quote_id
      - expires_at
      - subtotal_toman
      - discount_total_toman
      - tax_total_toman
      - shipping_charge_toman
      - grand_total_toman
      properties:
        quote_id:
          $ref: '#/components/schemas/EntityId'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        subtotal_toman:
          $ref: '#/components/schemas/MoneyToman'
        discount_total_toman:
          $ref: '#/components/schemas/MoneyToman'
        tax_total_toman:
          $ref: '#/components/schemas/MoneyToman'
        shipping_charge_toman:
          $ref: '#/components/schemas/MoneyToman'
        grand_total_toman:
          $ref: '#/components/schemas/MoneyToman'
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
    AllowedActions:
      type: array
      items:
        type: string
    NullableEntityId:
      anyOf:
      - $ref: '#/components/schemas/EntityId'
      - type: 'null'
    NullableTimestamp:
      anyOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    Slug:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      minLength: 1
      maxLength: 180
    Sku:
      type: string
      minLength: 1
      maxLength: 100
    Barcode:
      type: string
      minLength: 4
      maxLength: 64
    PersianText:
      type: string
      minLength: 1
      maxLength: 5000
    PhoneIran:
      type: string
      pattern: ^09[0-9]{9}$
    Percentage:
      type: number
      minimum: 0
      maximum: 100
      multipleOf: 0.0001
    PositiveQuantity:
      type: integer
      minimum: 1
      maximum: 1000000
    NonNegativeQuantity:
      type: integer
      minimum: 0
      maximum: 1000000000
    EntityVersion:
      type: integer
      format: int64
      minimum: 1
    OperationAccepted:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          $ref: '#/components/schemas/EntityId'
        status:
          type: string
          enum:
          - queued
          - processing
        correlation_id:
          $ref: '#/components/schemas/NullableEntityId'
      required:
      - operation_id
      - status
    ActionResult:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        status:
          type: string
        allowed_actions:
          type: array
          items:
            type: string
      required:
      - id
      - status
    BrandRef:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name_fa:
          type: string
          maxLength: 150
        slug:
          $ref: '#/components/schemas/Slug'
      required:
      - id
      - name_fa
      - slug
    CategoryRef:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name_fa:
          type: string
          maxLength: 150
        slug:
          $ref: '#/components/schemas/Slug'
      required:
      - id
      - name_fa
      - slug
    MediaRef:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        url:
          type: string
          format: uri
        alt_text_fa:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
      required:
      - id
      - url
    PriceView:
      type: object
      additionalProperties: false
      properties:
        current_toman:
          $ref: '#/components/schemas/MoneyToman'
        old_toman:
          anyOf:
          - $ref: '#/components/schemas/MoneyToman'
          - type: 'null'
        discount_percent:
          anyOf:
          - $ref: '#/components/schemas/Percentage'
          - type: 'null'
      required:
      - current_toman
    AvailabilityView:
      type: object
      additionalProperties: false
      properties:
        sales_enabled:
          type: boolean
        in_stock:
          type: boolean
        available_quantity:
          anyOf:
          - $ref: '#/components/schemas/NonNegativeQuantity'
          - type: 'null'
      required:
      - sales_enabled
      - in_stock
    RatingView:
      type: object
      additionalProperties: false
      properties:
        average:
          type: number
          minimum: 0
          maximum: 5
        count:
          type: integer
          minimum: 0
      required:
      - average
      - count
    VariantResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        product_id:
          $ref: '#/components/schemas/EntityId'
        sku:
          $ref: '#/components/schemas/Sku'
        barcode:
          anyOf:
          - $ref: '#/components/schemas/Barcode'
          - type: 'null'
        name_suffix:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
        status:
          type: string
          enum:
          - draft
          - active
          - inactive
          - archived
        sales_enabled:
          type: boolean
        price:
          anyOf:
          - $ref: '#/components/schemas/PriceView'
          - type: 'null'
        availability:
          anyOf:
          - $ref: '#/components/schemas/AvailabilityView'
          - type: 'null'
        version:
          $ref: '#/components/schemas/EntityVersion'
      required:
      - id
      - product_id
      - sku
      - status
      - sales_enabled
    ProductCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name_fa:
          type: string
          minLength: 1
          maxLength: 250
        name_en:
          anyOf:
          - type: string
            maxLength: 250
          - type: 'null'
        brand_id:
          $ref: '#/components/schemas/NullableEntityId'
        primary_category_id:
          $ref: '#/components/schemas/EntityId'
        additional_category_ids:
          type: array
          items:
            $ref: '#/components/schemas/EntityId'
          uniqueItems: true
        slug:
          anyOf:
          - $ref: '#/components/schemas/Slug'
          - type: 'null'
        short_description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        description:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
        sales_enabled:
          type: boolean
          default: true
      required:
      - name_fa
      - primary_category_id
    ProductUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name_fa:
          type: string
          minLength: 1
          maxLength: 250
        name_en:
          anyOf:
          - type: string
            maxLength: 250
          - type: 'null'
        brand_id:
          $ref: '#/components/schemas/NullableEntityId'
        primary_category_id:
          $ref: '#/components/schemas/EntityId'
        additional_category_ids:
          type: array
          items:
            $ref: '#/components/schemas/EntityId'
          uniqueItems: true
        slug:
          $ref: '#/components/schemas/Slug'
        short_description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        description:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
    ProductResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name_fa:
          type: string
        name_en:
          anyOf:
          - type: string
          - type: 'null'
        slug:
          $ref: '#/components/schemas/Slug'
        brand:
          anyOf:
          - $ref: '#/components/schemas/BrandRef'
          - type: 'null'
        primary_category:
          $ref: '#/components/schemas/CategoryRef'
        additional_categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        status:
          type: string
          enum:
          - draft
          - review
          - published
          - archived
        sales_enabled:
          type: boolean
        published_at:
          $ref: '#/components/schemas/NullableTimestamp'
        archived_at:
          $ref: '#/components/schemas/NullableTimestamp'
        primary_image:
          anyOf:
          - $ref: '#/components/schemas/MediaRef'
          - type: 'null'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantResponse'
        version:
          $ref: '#/components/schemas/EntityVersion'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - name_fa
      - slug
      - primary_category
      - status
      - sales_enabled
      - version
    ProductListResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        pagination:
          $ref: '#/components/schemas/CursorPagination'
      required:
      - items
      - pagination
    SalesControlPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        scope_type:
          type: string
          enum:
          - global
          - brand
          - category
          - product
          - variant
        scope_id:
          $ref: '#/components/schemas/NullableEntityId'
        sales_enabled:
          type: boolean
        reason:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
      required:
      - scope_type
      - sales_enabled
    SalesControlPreviewResponse:
      type: object
      additionalProperties: false
      properties:
        affected_count:
          type: integer
          minimum: 0
        sales_enabled:
          type: boolean
        sample_products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
          maxItems: 20
        warnings:
          type: array
          items:
            type: string
      required:
      - affected_count
      - sales_enabled
    CartItemResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        variant_id:
          $ref: '#/components/schemas/EntityId'
        product_id:
          $ref: '#/components/schemas/EntityId'
        name_fa:
          type: string
        sku:
          $ref: '#/components/schemas/Sku'
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        unit_price_toman:
          $ref: '#/components/schemas/MoneyToman'
        line_total_toman:
          $ref: '#/components/schemas/MoneyToman'
        availability:
          $ref: '#/components/schemas/AvailabilityView'
      required:
      - id
      - variant_id
      - quantity
      - unit_price_toman
      - line_total_toman
    CartSummary:
      type: object
      additionalProperties: false
      properties:
        subtotal_toman:
          $ref: '#/components/schemas/MoneyToman'
        estimated_discount_toman:
          $ref: '#/components/schemas/MoneyToman'
        estimated_total_toman:
          $ref: '#/components/schemas/MoneyToman'
      required:
      - subtotal_toman
      - estimated_discount_toman
      - estimated_total_toman
    CartResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        status:
          type: string
          enum:
          - active
          - converted
          - abandoned
          - expired
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemResponse'
        summary:
          $ref: '#/components/schemas/CartSummary'
        requires_revalidation:
          type: boolean
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        version:
          $ref: '#/components/schemas/EntityVersion'
      required:
      - id
      - status
      - items
      - summary
      - requires_revalidation
    AddCartItemRequest:
      type: object
      additionalProperties: false
      properties:
        variant_id:
          $ref: '#/components/schemas/EntityId'
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
      required:
      - variant_id
      - quantity
    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      properties:
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
      required:
      - quantity
    CheckoutQuoteRequest:
      type: object
      additionalProperties: false
      properties:
        cart_id:
          $ref: '#/components/schemas/EntityId'
        address_id:
          $ref: '#/components/schemas/EntityId'
        shipping_method_id:
          $ref: '#/components/schemas/EntityId'
        coupon_code:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
      required:
      - cart_id
      - address_id
      - shipping_method_id
    CheckoutQuoteResponse:
      type: object
      required:
      - checkout_id
      - checkout_token
      - subtotal_toman
      - discount_toman
      - shipping_toman
      - tax_toman
      - total_toman
      - expires_at
      - items
      properties:
        checkout_id:
          type: string
          format: uuid
        checkout_token:
          type: string
          minLength: 32
        subtotal_toman:
          $ref: '#/components/schemas/MoneyToman'
        discount_toman:
          $ref: '#/components/schemas/MoneyToman'
        shipping_toman:
          $ref: '#/components/schemas/MoneyToman'
        tax_toman:
          $ref: '#/components/schemas/MoneyToman'
        total_toman:
          $ref: '#/components/schemas/MoneyToman'
        expires_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    CreateReservationRequest:
      type: object
      additionalProperties: false
      properties:
        quote_id:
          $ref: '#/components/schemas/EntityId'
      required:
      - quote_id
    ReservationResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        status:
          type: string
          enum:
          - active
          - payment_pending
          - converted
          - released
          - expired
          - late_payment_review
          - cancelled
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        payment_grace_until:
          $ref: '#/components/schemas/NullableTimestamp'
      required:
      - id
      - status
      - expires_at
    CreateOrderRequest:
      type: object
      additionalProperties: false
      properties:
        quote_id:
          $ref: '#/components/schemas/EntityId'
        reservation_id:
          $ref: '#/components/schemas/EntityId'
      required:
      - quote_id
      - reservation_id
    OrderSummary:
      type: object
      additionalProperties: false
      properties:
        order_id:
          $ref: '#/components/schemas/EntityId'
        order_number:
          type: string
          maxLength: 50
        order_status:
          type: string
          enum:
          - draft
          - pending_confirmation
          - confirmed
          - completed
          - cancelled
          - expired
        payment_status:
          type: string
          enum:
          - unpaid
          - pending
          - authorized
          - paid
          - partially_refunded
          - refunded
          - failed
          - cancelled
        fulfillment_status:
          type: string
          enum:
          - unfulfilled
          - partially_allocated
          - allocated
          - preparing
          - partially_shipped
          - shipped
          - partially_delivered
          - delivered
          - cancelled
        return_status:
          type: string
          enum:
          - none
          - requested
          - partially_returned
          - returned
          - closed
        grand_total_toman:
          $ref: '#/components/schemas/MoneyToman'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - order_id
      - order_number
      - order_status
      - payment_status
      - grand_total_toman
    OrderItemResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        product_id:
          $ref: '#/components/schemas/EntityId'
        variant_id:
          $ref: '#/components/schemas/EntityId'
        product_name:
          type: string
        sku:
          type: string
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        unit_base_toman:
          $ref: '#/components/schemas/MoneyToman'
        unit_final_toman:
          $ref: '#/components/schemas/MoneyToman'
        discount_toman:
          $ref: '#/components/schemas/MoneyToman'
        tax_toman:
          $ref: '#/components/schemas/MoneyToman'
        line_total_toman:
          $ref: '#/components/schemas/MoneyToman'
        pricing_snapshot:
          type: object
          additionalProperties: true
      required:
      - id
      - product_id
      - variant_id
      - product_name
      - sku
      - quantity
      - unit_base_toman
      - unit_final_toman
      - discount_toman
      - tax_toman
      - line_total_toman
      - pricing_snapshot
    OrderResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        order_number:
